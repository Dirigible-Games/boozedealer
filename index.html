                                })()}

                                {/* Price setting UI — only shows when bottle selected */}
                                {selectedSellBottle && (() => {
                                  const selBottle = inventory.find(b => b.id === selectedSellBottle);
                                  if (!selBottle) return null;
                                  const paid = selBottle.purchasePrice ?? 0;
                                  const trueVal = selBottle.trueValue || selBottle.value;
                                  const sliderMin = Math.max(Math.round(paid * 0.25), 3);
                                  // Slider max should cover true value and any reasonable markup
                                  const sliderMax = Math.round(Math.max(paid * 4, trueVal * 2, 100));

                                  // Codex price anchor
                                  const modK = selBottle.modifiers.length > 0 ? selBottle.modifiers.sort().join(" ") + " " : "";
                                  const vk = `${modK}${selBottle.typeName}`;
                                  const codexEntry = codex[selBottle.brandName]?.[vk];
                                  const yearKey = selBottle.yearKnown ? String(selBottle.year) : "unknown";
                                  const ph = codexEntry?.priceHistory?.[yearKey];

                                  // Industry Knowledge: market value range (gets tighter with level)
                                  const ikLevel = playerSkills?.industryKnowledge || 0;
                                  let ikRange = null;
                                  if (ikLevel >= 1) {
                                    // Spread narrows with level but always somewhat useful
                                    const spread = [0.40, 0.30, 0.20, 0.12, 0.06][Math.min(ikLevel - 1, 4)];
                                    ikRange = {
                                      min: Math.round(trueVal * (1 - spread)),
                                      max: Math.round(trueVal * (1 + spread)),
                                    };
                                  }

                                  // People Reader: customer price range (gets tighter with level)
                                  // Shows the actual range between their opening offer and max willingness
                                  const prLevel = playerSkills?.peopleReader || 0;
                                  const prCalc = getOfferForBottle(currentCustomer, selBottle);
                                  let prRange = null;
                                  if (prLevel >= 1) {
                                    const prOffer = prCalc.offer;
                                    const prMax = prCalc.maxPay;
                                    // At low levels, add noise/spread beyond the actual range
                                    // At high levels, show nearly the exact offer-to-maxPay window
                                    const noise = [0.40, 0.28, 0.18, 0.08, 0.03][Math.min(prLevel - 1, 4)];
                                    prRange = {
                                      min: Math.max(Math.round(prOffer * (1 - noise)), 1),
                                      max: Math.round(prMax * (1 + noise)),
                                    };
                                  }

                                  // Helper: convert a value to a percentage position on the slider
                                  const toPercent = (v) => Math.min(Math.max(((v - sliderMin) / (sliderMax - sliderMin)) * 100, 0), 100);

                                  return (
                                    <div style={{ width: "100%", maxWidth: "460px" }}>
                                      <div style={{ background: "rgba(255,255,255,0.03)", borderRadius: "8px", padding: "8px", marginBottom: "8px", textAlign: "center" }}>
                                        <div style={{ fontSize: "12px", color: "var(--text)", fontFamily: "'Playfair Display', Georgia, serif" }}>{selBottle.displayName}</div>
                                        <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace" }}>Paid: ${paid.toLocaleString()}</div>
                                        {/* Codex price reference */}
                                        {ph && (ph.minSell != null || ph.minBuy != null) && (
                                          <div style={{ fontSize: "9px", fontFamily: "monospace", color: "var(--text-dim)", marginTop: "4px" }}>
                                            <span style={{ color: "var(--accent)" }}>CODEX: </span>
                                            {ph.minSell != null && <span style={{ color: "var(--success)" }}>Sold: ${ph.minSell.toLocaleString()}{ph.maxSell !== ph.minSell ? `–$${ph.maxSell.toLocaleString()}` : ""}</span>}
                                            {ph.minSell != null && ph.minBuy != null && " · "}
                                            {ph.minBuy != null && <span style={{ color: "var(--danger)" }}>Bought: ${ph.minBuy.toLocaleString()}{ph.maxBuy !== ph.minBuy ? `–$${ph.maxBuy.toLocaleString()}` : ""}</span>}
                                          </div>
                                        )}
                                      </div>

                                      {/* Price slider with bracket overlays */}
                                      <div style={{ marginBottom: "8px" }}>
                                        <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", marginBottom: "2px" }}>
                                          <span>${sliderMin.toLocaleString()}</span>
                                          <span style={{ color: "var(--buy-accent)", fontWeight: "bold", fontSize: "13px" }}>${playerOffer.toLocaleString()}</span>
                                          <span>${sliderMax.toLocaleString()}</span>
                                        </div>

                                        {/* IK Market Value bracket — above slider */}
                                        {ikRange && (() => {
                                          const leftPct = toPercent(ikRange.min);
                                          const rightPct = toPercent(ikRange.max);
                                          const gapPct = rightPct - leftPct;
                                          // If bracket is too narrow for text (~18%), position label outside
                                          let labelStyle;
                                          if (gapPct >= 18) {
                                            labelStyle = { left: `${(leftPct + rightPct) / 2}%`, transform: "translate(-50%, -50%)" };
                                          } else if (rightPct < 75) {
                                            labelStyle = { left: `${rightPct + 1.5}%`, transform: "translateY(-50%)" };
                                          } else {
                                            labelStyle = { right: `${100 - leftPct + 1.5}%`, transform: "translateY(-50%)" };
                                          }
                                          return (
                                            <div style={{ position: "relative", height: "18px", marginBottom: "2px", marginLeft: "12px", marginRight: "12px" }}>
                                              <div style={{ position: "absolute", left: `${leftPct}%`, top: "2px", width: "2px", height: "14px", background: "var(--success)", opacity: 0.9 }} />
                                              <div style={{ position: "absolute", left: `${rightPct}%`, top: "2px", width: "2px", height: "14px", background: "var(--success)", opacity: 0.9 }} />
                                              <div style={{ position: "absolute", top: "50%", fontSize: "9px", color: "var(--success)", fontFamily: "monospace", whiteSpace: "nowrap", fontWeight: "600", ...labelStyle }}>
                                                Market Value
                                              </div>
                                            </div>
                                          );
                                        })()}

                                        <input type="range" min={sliderMin} max={sliderMax} step={1} value={playerOffer}
                                          onChange={e => setPlayerOffer(Number(e.target.value))} style={{ width: "100%", accentColor: "var(--buy-accent)", cursor: "pointer" }} />

                                        {/* People Reader Customer Range bracket — below slider */}
                                        {prRange && (() => {
                                          const leftPct = toPercent(prRange.min);
                                          const rightPct = toPercent(prRange.max);
                                          const gapPct = rightPct - leftPct;
                                          let labelStyle;
                                          if (gapPct >= 22) {
                                            labelStyle = { left: `${(leftPct + rightPct) / 2}%`, transform: "translate(-50%, -50%)" };
                                          } else if (rightPct < 70) {
                                            labelStyle = { left: `${rightPct + 1.5}%`, transform: "translateY(-50%)" };
                                          } else {
                                            labelStyle = { right: `${100 - leftPct + 1.5}%`, transform: "translateY(-50%)" };
                                          }
                                          return (
                                            <div style={{ position: "relative", height: "18px", marginTop: "2px", marginLeft: "12px", marginRight: "12px" }}>
                                              <div style={{ position: "absolute", left: `${leftPct}%`, top: "2px", width: "2px", height: "14px", background: "var(--accent)", opacity: 0.9 }} />
                                              <div style={{ position: "absolute", left: `${rightPct}%`, top: "2px", width: "2px", height: "14px", background: "var(--accent)", opacity: 0.9 }} />
                                              <div style={{ position: "absolute", top: "50%", fontSize: "9px", color: "var(--accent)", fontFamily: "monospace", whiteSpace: "nowrap", fontWeight: "600", ...labelStyle }}>
                                                Customer Range
                                              </div>
                                            </div>
                                          );
                                        })()}

                                        {/* Purchase price marker */}
                                        <div style={{ position: "relative", height: "8px", marginTop: prRange ? "0px" : "-4px" }}>
                                          <div style={{ position: "absolute", left: `${Math.min(Math.max(toPercent(paid), 2), 98)}%`, transform: "translateX(-50%)", fontSize: "7px", color: "var(--text-dim)", fontFamily: "monospace", whiteSpace: "nowrap" }}>▲ paid</div>
                                        </div>
                                      </div>

                                      <div style={{ display: "flex", gap: "8px" }}>
                                        <button onClick={() => {
                                          // Pitch the bottle at playerOffer price — buyer reacts
                                          const { maxPay, offer: buyerOffer } = getOfferForBottle(currentCustomer, selBottle);

                                          // Buyer reaction based on asking price vs their valuation
                                          if (playerOffer <= buyerOffer) {
                                            // Instant accept — buyer thinks it's a great price
                                            const reactLine = currentCustomer.traits.knowledge > 60
                                              ? `"${playerOffer < buyerOffer * 0.7 ? "Really? At that price? Sold!" : "That's very fair. I'll take it."}"` 
                                              : `"${playerOffer < buyerOffer * 0.7 ? "Done! I'll take it right now." : "Sounds good to me!"}"`;
                                            setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer the ${selBottle.typeName} for $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: reactLine }]);
                                            setCash(prev => prev + playerOffer);
                                            setDailyLog(prev => [...prev, { type: "sell", desc: selBottle.displayName, amount: playerOffer }]);
                                            setInventory(p => p.filter(b => b.id !== selectedSellBottle));
                                            setReputation(prev => prev + (playerOffer > paid * 1.3 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
                                            trackPriceInCodex(selBottle, "sell", playerOffer); trackBottleInCodex(selBottle);
                                            setSelectedSellBottle(null); audio.playSfx("sellSuccess");
                                            setTimeout(() => advanceToNextCustomer(), 800);
                                          } else if (playerOffer <= maxPay * 1.25) {
                                            // Negotiable range — buyer counters
                                            const reactLines = currentCustomer.traits.confidence > 60
                                              ? ['"That\'s a bit steep. I was thinking more like"', '"I appreciate the bottle, but that price is high. How about"']
                                              : ['"Hmm, could you do"', '"That\'s more than I had in mind. What about"'];
                                            const reactLine = reactLines[Math.floor(Math.random() * reactLines.length)];
                                            setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer the ${selBottle.typeName} for $${playerOffer.toLocaleString()}` }, { who: "customer", amount: buyerOffer, text: `${reactLine} $${buyerOffer.toLocaleString()}?` }]);
                                            setCurrentCustomer(prev => ({ ...prev, openingOffer: buyerOffer, maxPay: maxPay }));
                                            setCustomerOffer(buyerOffer);
                                            setNegotiating(true); setNegRound(0); setNegResult("countered");
                                          } else if (playerOffer <= maxPay * 2.0) {
                                            // Too high but not insulting — firm rejection with hint
                                            const reactLines = ['"That\'s way more than I can do. I\'d need to see something much lower."', '"I can\'t go anywhere near that price, sorry."', '"That\'s out of my range. Significantly."'];
                                            const reactLine = reactLines[Math.floor(Math.random() * reactLines.length)];
                                            setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer the ${selBottle.typeName} for $${playerOffer.toLocaleString()}` }, { who: "customer", amount: null, text: reactLine }]);
                                            // Let player try again with a different price
                                            setPlayerOffer(Math.round(maxPay * 0.9));
                                          } else {
                                            // Insulting price — buyer might walk
                                            const reactLines = ['"You can\'t be serious."', '"I think we\'re way too far apart on this."', '"No. That\'s... no."'];
                                            const reactLine = reactLines[Math.floor(Math.random() * reactLines.length)];
                                            setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer the ${selBottle.typeName} for $${playerOffer.toLocaleString()}` }, { who: "customer", amount: null, text: reactLine }]);
                                            // Decrease disposition, still let them try
                                            setCurrentCustomer(prev => ({ ...prev, disposition: Math.max(0, (prev.disposition || 50) - 15) }));
                                          }
                                          audio.playSfx("buttonClick");
                                        }}
                                          style={{ flex: "1 1 auto", padding: "10px 12px", background: "linear-gradient(145deg, #3B82F6, #2563EB)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                          PITCH ${playerOffer.toLocaleString()}
                                        </button>
                                        <button onClick={handlePass} style={{ flex: "0 0 auto", padding: "10px 12px", background: "transparent", border: "2px solid var(--text-dim)", borderRadius: "8px", color: "var(--text-dim)", fontSize: "12px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>PASS</button>
                                      </div>
                                    </div>
                                  );
                                })()}

                                {/* Pass button when no bottle selected */}
                                {!selectedSellBottle && (
                                  <button onClick={handlePass} style={{ padding: "10px 20px", background: "transparent", border: "2px solid var(--text-dim)", borderRadius: "8px", color: "var(--text-dim)", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>PASS</button>
                                )}
                              </>
                            )}

                            {/* Sell negotiation UI */}
                            {negotiating && (() => {
                              const bottle = inventory.find(b => b.id === selectedSellBottle);
                              if (!bottle) return null;
                              const paid = bottle.purchasePrice ?? 0;
                              const trueVal = bottle.trueValue || bottle.value;
                              const sliderMin = Math.max(Math.round(Math.min(currentCustomer.openingOffer * 0.5, paid * 0.25)), 3);
                              const sliderMax = Math.round(Math.max(currentCustomer.maxPay * 1.5, trueVal * 2, paid * 4, 100));
                              const toPercent = (v) => Math.min(Math.max(((v - sliderMin) / (sliderMax - sliderMin)) * 100, 0), 100);

                              // IK Market Value bracket
                              const ikLevel = playerSkills?.industryKnowledge || 0;
                              let ikRange = null;
                              if (ikLevel >= 1) {
                                const spread = [0.40, 0.30, 0.20, 0.12, 0.06][Math.min(ikLevel - 1, 4)];
                                ikRange = { min: Math.round(trueVal * (1 - spread)), max: Math.round(trueVal * (1 + spread)) };
                              }

                              // PR Customer Range bracket
                              const prLevel = playerSkills?.peopleReader || 0;
                              const prCalc = getOfferForBottle(currentCustomer, bottle);
                              let prRange = null;
                              if (prLevel >= 1) {
                                const noise = [0.40, 0.28, 0.18, 0.08, 0.03][Math.min(prLevel - 1, 4)];
                                prRange = { min: Math.max(Math.round(prCalc.offer * (1 - noise)), 1), max: Math.round(prCalc.maxPay * (1 + noise)) };
                              }

                              return (

                <div style={{ ...dStyle, marginBottom: "6px", fontWeight: "bold" }}>QUICK ACTIONS</div>
                <div style={{ display: "flex", gap: "4px", flexWrap: "wrap" }}>
                  <button onClick={() => { setCash(prev => prev + 1000); }} style={dBtn(false)}>+$1000</button>
                  <button onClick={() => { setReputation(prev => prev + 50); }} style={dBtn(false)}>+50 REP</button>
                  <button onClick={() => {
                    const skills = { ...playerSkills };
                    Object.keys(skills).forEach(k => { skills[k] = 5; });
                    setPlayerSkills(skills);
                  }} style={dBtn(false)}>MAX SKILLS</button>
                  <button onClick={() => {
                    const skills = { ...playerSkills };
                    Object.keys(skills).forEach(k => { skills[k] = 0; });
                    setPlayerSkills(skills);
                  }} style={dBtn(false)}>RESET SKILLS</button>
                  <button onClick={() => setDevNextCustomer(null)} style={dBtn(false)}>CLEAR OVERRIDES</button>
                </div>
              </div>

              {/* Status */}
              {devNextCustomer && Object.keys(devNextCustomer).some(k => devNextCustomer[k] !== undefined) && (
                <div style={{ fontSize: "9px", color: "var(--accent)", fontFamily: "monospace", textAlign: "center", marginBottom: "8px" }}>
                  Overrides active — next customer will use these settings
                </div>
              )}

              <div style={{ textAlign: "center" }}>
                <button onClick={() => setShowDevMenu(false)} style={{ padding: "8px 24px", background: "transparent", border: "1px solid var(--danger)", borderRadius: "6px", color: "var(--danger)", fontSize: "11px", cursor: "pointer", fontFamily: "monospace" }}>CLOSE</button>
              </div>
            </div>
          </div>
        );
      })()}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes msgFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes titlePulse { 0%, 100% { text-shadow: 0 0 30px rgba(212,175,55,0.3), 0 2px 4px rgba(0,0,0,0.5); } 50% { text-shadow: 0 0 50px rgba(212,175,55,0.5), 0 2px 4px rgba(0,0,0,0.5); } }
        @keyframes subtleGlow { 0%, 100% { box-shadow: 0 0 8px rgba(212,175,55,0.1); } 50% { box-shadow: 0 0 16px rgba(212,175,55,0.2); } }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #3a302860; border-radius: 4px; }
        * { box-sizing: border-box; } input::placeholder { color: #5a4a38; }
        button { transition: all 0.15s ease !important; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.07); }
        button:active { transform: scale(0.97) !important; }
        input[type="range"] { -webkit-appearance: none; background: rgba(255,255,255,0.2); border-radius: 4px; height: 8px; outline: none; margin: 12px 0; border: 1px solid rgba(255,255,255,0.08); }
        input[type="range"]::-webkit-slider-runnable-track { height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; border: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(145deg, var(--accent), var(--accent-dark)); border: 2px solid #1a1510; box-shadow: 0 2px 8px rgba(0,0,0,0.4); cursor: pointer; margin-top: -9px; }
        input[type="range"]::-moz-range-track { height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; border: none; }
        input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(145deg, var(--accent), var(--accent-dark)); border: 2px solid #1a1510; box-shadow: 0 2px 8px rgba(0,0,0,0.4); cursor: pointer; }
      `}</style>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(WhiskeyGame));
  </script></body></html>
