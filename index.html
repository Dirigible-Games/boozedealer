    { text: "I'm a fan of Japanese whisky.", filter: b => b.typeName === "Japanese Whisky", hint: "japanese" },
    // Age-specific
    { text: "I want something aged at least 10 years.", filter: b => b.age >= 10, hint: "aged" },
    { text: "What's the oldest bottle you have?", filter: b => b.age >= 8, hint: "old" },
    { text: "I'm after something young and punchy.", filter: b => b.age <= 6 && b.proof >= 95, hint: "young" },
    { text: "Looking for a well-aged Scotch, 18 years or more.", filter: b => b.typeName.includes("Scotch") && b.age >= 18, hint: "aged scotch" },
    { text: "I collect age-stated Bourbons. Got any?", filter: b => b.typeName === "Bourbon" && b.ageStated && b.age >= 7, hint: "aged bourbon" },
    // Modifier-specific
    { text: "I need a gift — something special.", filter: b => b.modifiers.length > 0, hint: "special" },
    { text: "I'm after anything Bottled-in-Bond.", filter: b => b.modifiers.includes("Bottled-in-Bond"), hint: "bib" },
    { text: "I'm a cask strength fanatic. Got any?", filter: b => b.modifiers.includes("Cask Strength"), hint: "cask strength" },
    { text: "I'm looking for a Single Barrel.", filter: b => b.modifiers.includes("Single Barrel"), hint: "single barrel" },
    { text: "Any barrel-finished whiskeys in stock?", filter: b => b.modifiers.some(m => m.startsWith("Finished in") || m.endsWith("Finish") || m.endsWith("Cask")), hint: "finished" },
    { text: "I love peated whisky. Anything smoky?", filter: b => b.modifiers.includes("Peated") || b.modifiers.includes("Heavily Peated"), hint: "peated" },
    { text: "I'm hunting for a Double Oaked bourbon.", filter: b => b.modifiers.includes("Double Oaked"), hint: "double oaked" },
    // Proof-specific
    { text: "Something smooth — nothing too hot.", filter: b => b.proof <= 100, hint: "smooth" },
    { text: "I like it strong. High proof, please.", filter: b => b.proof >= 110, hint: "high proof" },
    { text: "Got anything at exactly 100 proof?", filter: b => b.proof >= 98 && b.proof <= 102, hint: "100 proof" },
    // Value/rarity-specific
    { text: "I'm looking for something budget-friendly.", filter: b => b.trueValue <= 60, hint: "budget" },
    { text: "Price isn't an object — show me the good stuff.", filter: b => b.trueValue >= 100, hint: "premium" },
    { text: "I'm a collector. Anything rare or unusual?", filter: b => { const ri = RARITY_ORDER.indexOf(b.rarity); return ri >= 2; }, hint: "rare" },
    // Region-specific
    { text: "I want something American-made.", filter: b => b.region === "American", hint: "american" },
    { text: "I've been exploring Canadian whisky.", filter: b => b.region === "Canadian", hint: "canadian" },
    { text: "I'm looking for something from Scotland.", filter: b => b.region === "Scottish", hint: "scottish" },
    { text: "Anything from Japan? I love their craft.", filter: b => b.region === "Japanese", hint: "japanese" },
    { text: "Got anything Irish? Maybe a pot still?", filter: b => b.region === "Irish", hint: "irish" },
    // Open
    { text: "Show me what you've got — I'm open to anything.", filter: () => true, hint: "open" },
    { text: "I don't know much about whiskey. What do you recommend?", filter: () => true, hint: "open" },
    { text: "Just browsing. Surprise me.", filter: () => true, hint: "open" },
  ];

  const [dayEvent, setDayEvent] = useState(null); // null | { type, desc, ... }
  const [showEventModal, setShowEventModal] = useState(false);

  const DAY_EVENTS = [
    { type: "hotTip", chance: 0.08, label: "HOT TIP",
      descs: ["Word on the street: a serious collector is hunting for a specific bottle today.", "A wealthy client called ahead — they're willing to pay top dollar for the right bottle.", "A private auction fell through. The buyer is coming to you instead."] },
    { type: "estateSale", chance: 0.06, label: "ESTATE SALE",
      descs: ["A local estate is being liquidated — expect sellers with bottles priced to move.", "A family clearing out a collection is sending people your way today.", "An old bar closed down — their backstock is hitting the streets."] },
  ];

  const generateDayQueue = useCallback(() => {
    if (!engine) return [];
    const rng = seededRandom(Date.now() + day * 777);
    const [minC, maxC] = tierData.customersPerDay;
    let numCustomers = minC + Math.floor(rng() * (maxC - minC + 1));
    const queue = [];
    let event = null;
    for (const evt of DAY_EVENTS) { if (rng() < evt.chance) { event = { ...evt, desc: evt.descs[Math.floor(rng() * evt.descs.length)] }; break; } }
    if (event?.type === "estateSale") numCustomers += 2;
    for (let i = 0; i < numCustomers; i++) {
      const name = generateCustomerName(rng);
      // Apply dev overrides to first customer
      const devOverride = (i === 0 && devNextCustomer) ? devNextCustomer : null;
      const traits = {
        knowledge: devOverride?.knowledge ?? Math.floor(rng() * 100),
        patience: devOverride?.patience ?? Math.floor(rng() * 100),
        sociability: devOverride?.sociability ?? Math.floor(rng() * 100),
        confidence: Math.floor(rng() * 100)
      };
      const flexibility = (traits.sociability * 0.3 + (100 - traits.confidence) * 0.3 + traits.patience * 0.2 + (100 - traits.knowledge) * 0.2) / 100;
      const maxRounds = traits.patience < 25 ? 2 : traits.patience < 50 ? 3 : traits.patience < 75 ? 4 : 5;
      const counterLines = traits.confidence > 60 ? ["The fair price is closer to", "I know what this is worth —", "Let's be realistic —"] : traits.sociability > 60 ? ["How about we meet at", "What if we did", "Fair number around"] : ["How about", "I'll do", "Maybe"];
      const walkLine = traits.confidence > 60 ? "Not at that price." : traits.sociability > 60 ? "Maybe next time, friend." : traits.patience < 30 ? "Too slow. I'm out." : "Nah, I'll pass.";
      const descMatch = DESCRIPTORS.find(d => d.match(traits));
      const descriptor = descMatch ? descMatch.pool[Math.floor(rng() * descMatch.pool.length)] : "A person walks in.";
      const sellerChance = event?.type === "estateSale" ? 0.80 : 0.55;
      const isSeller = devOverride?.type ? devOverride.type === "seller" : (inventory.length === 0 ? true : rng() < sellerChance);
      if (isSeller) {
        // Generate bottle with dev overrides
        let bottle = null;
        if (devOverride?.forceRarity || devOverride?.forceRegion || devOverride?.minAge || devOverride?.minProof) {
          // Try up to 50 times to find a bottle matching dev constraints
          for (let attempt = 0; attempt < 50; attempt++) {
            const candidate = engine.generateBottle(storeTier, reputation);
            if (!candidate) continue;
            if (devOverride.forceRarity && candidate.rarity !== devOverride.forceRarity) continue;
            if (devOverride.forceRegion && candidate.region !== devOverride.forceRegion) continue;
            if (devOverride.minAge && candidate.age < devOverride.minAge) continue;
            if (devOverride.minProof && candidate.proof < devOverride.minProof) continue;
            bottle = candidate;
            break;
          }
          if (!bottle) bottle = engine.generateBottle(storeTier, reputation); // fallback
        } else {
          bottle = engine.generateBottle(storeTier, reputation);
        }
        if (!bottle) continue;

        // Knowledge-rarity correlation: low-knowledge sellers rarely have exotic bottles
        // If a clueless seller rolled a high-rarity bottle, chance to reroll to something more common
        // This makes the "hidden gem" moment genuinely rare and exciting
        const rarityIdx = RARITY_ORDER.indexOf(bottle.rarity);
        if (rarityIdx >= 2) { // Rare or above
          let keepChance;
          if (traits.knowledge < 35) {
            // Clueless: rarely has anything exotic
            keepChance = [1, 1, 0.70, 0.25, 0.08, 0.03][rarityIdx]; // Common, Uncommon, Rare, Epic, Legendary, Unicorn
          } else if (traits.knowledge < 65) {
            // Knows a bit: sometimes has good stuff
            keepChance = [1, 1, 1, 0.85, 0.60, 0.35][rarityIdx];
          } else {
            keepChance = 1; // Knowledgeable sellers keep whatever they rolled
          }
          if (rng() > keepChance) {
            // Reroll — generate a new bottle (likely lower rarity)
            const reroll = engine.generateBottle(storeTier, reputation);
            if (reroll) bottle = reroll;
          }
        }
        // Knowledge affects what the seller knows about their bottle
        // Low knowledge: they don't even know the year, price near common-tier
        // High knowledge: they know everything, price near true value
        const yearKnownChance = traits.knowledge < 35 ? 0.10 : traits.knowledge < 60 ? 0.50 : 0.90;
        const yearKnown = rng() < yearKnownChance;
        bottle.yearKnown = yearKnown;
        if (!yearKnown) { bottle.value = engine._calculateBaseValue(bottle.age, bottle.proof, bottle.rarity, bottle.modifiers, false); bottle.displayName = bottle.baseDisplayName; }
        else { bottle.displayName = `${bottle.year} ${bottle.baseDisplayName}`; }
        // Knowledge-based pricing
        // Low knowledge: seller prices as if it's a common bottle (doesn't know rarity)
        // Medium: has some sense but still undervalues
        // High: prices near true value
        // Base "common" value: what someone who knows nothing would price any bottle at
        const commonValue = 10 + (bottle.age || 4) * 2 + Math.max(0, (bottle.proof || 80) - 80) * 0.2;
        let effectiveValue;
        if (traits.knowledge < 35) {
          // Clueless — prices like it's just another bottle on the shelf
          const mult = 0.7 + rng() * 0.6; // 70-130% of common value
          effectiveValue = commonValue * mult;
        } else if (traits.knowledge < 65) {
          // Knows a little — prices somewhere between common and half of true value
          const midBase = commonValue + (bottle.trueValue - commonValue) * (0.15 + rng() * 0.20);
          effectiveValue = midBase;
        } else {
          // Knows what they have — prices at 75-100% of true value
          const highMult = 0.75 + rng() * 0.25;
          effectiveValue = bottle.trueValue * highMult;
        }
        let isHiddenGem = false;
        if (traits.knowledge < 50 && bottle.trueValue > effectiveValue * 2) isHiddenGem = true;
        const estateMult = event?.type === "estateSale" ? 0.5 + rng() * 0.2 : 1;
        effectiveValue *= estateMult;
        const minAccept = Math.round(effectiveValue * (0.35 + flexibility * 0.4 + rng() * 0.2));
        const askingPrice = Math.max(Math.round(effectiveValue * (0.75 + rng() * 0.35)), Math.round(minAccept * 1.1), 5);
        queue.push({ type: "seller", name, traits, descriptor, bottle, minAccept, askingPrice, isHiddenGem, disposition: 50, maxRounds, counterLines, walkLine, flexibility });
      } else {
        const validRequests = BUYER_REQUESTS.filter(r => inventory.some(r.filter));
        const request = validRequests.length > 0 ? validRequests[Math.floor(rng() * validRequests.length)] : BUYER_REQUESTS[BUYER_REQUESTS.length - 1];
        const matching = inventory.filter(request.filter);
        const avgTrueValue = matching.length > 0 ? matching.reduce((s, b) => s + (b.trueValue || b.value), 0) / matching.length : 50;
        const hotTipMult = event?.type === "hotTip" && rng() < 0.35 ? 2 + rng() : 1;
        const budgetRatio = (0.7 + rng() * 0.8) * hotTipMult;
        const offerRatio = 0.5 + rng() * 0.3;
        // Flat budget for low/medium knowledge buyers — what they walked in expecting to spend
        // Scales with store tier: fancier store attracts bigger spenders
        const tierBudgetBase = [30, 60, 120, 250, 500, 1000][Math.min(storeTier - 1, 5)];
        const flatBudget = Math.round(tierBudgetBase * (0.6 + rng() * 0.8) * hotTipMult);

        // Low-knowledge buyers sometimes state their budget upfront
        // This gives the player useful pricing info through natural dialogue
        let requestText = request.text;
        let requestHint = request.hint || "open";
        if (traits.knowledge < 45 && rng() < 0.55) {
          // Round the budget to a "nice" number for natural dialogue
          const roundedBudget = Math.round(flatBudget / 5) * 5;
          const budgetPhrases = [
            `I'm looking to spend around $${roundedBudget} or less. What do you have?`,
            `I've got about $${roundedBudget} to spend. Anything you'd recommend?`,
            `My budget's around $${roundedBudget}. What can I get for that?`,
            `I don't want to spend more than $${roundedBudget}. Show me what you've got.`,
            `I'm hoping to find something nice for under $${roundedBudget}.`,
          ];
          requestText = budgetPhrases[Math.floor(rng() * budgetPhrases.length)];
          requestHint = "budget";
        } else if (traits.knowledge < 35 && rng() < 0.3) {
          // Very clueless — combine their original request with a budget mention
          const roundedBudget = Math.round(flatBudget / 5) * 5;
          requestText = `${request.text} I've got about $${roundedBudget} to spend.`;
        }

        // Pre-compute budget for queue (used as fallback, actual is computed per-bottle at pitch time)
        const budget = Math.round(avgTrueValue * budgetRatio);
        const maxPay = Math.round(budget * (1 + flexibility * 0.5));
        const openingOffer = Math.round(budget * offerRatio);
        const isHotTipBuyer = hotTipMult > 1;
        queue.push({ type: "buyer", name, traits, descriptor, request: requestText, hint: requestHint, filter: request.filter, flatBudget, budget, maxPay, openingOffer, knowsYear: traits.knowledge > 55, isHotTipBuyer, budgetRatio, offerRatio, disposition: 50, maxRounds, counterLines, walkLine, flexibility });
      }
    }
    return { queue, event };
  }, [engine, day, tierData, inventory, generateCustomerName, storeTier, reputation, devNextCustomer]);

  // --- Negotiation logic ---
  const startNegotiation = useCallback((customer, targetPrice) => {
    setNegotiating(true);
    setNegRound(0);
    setNegResult(null);
    
    if (customer.type === "seller") {
      setCustomerOffer(customer.askingPrice);
      // Default slider at ~60% of asking (within 25%-150% range)
      setPlayerOffer(Math.round(customer.askingPrice * 0.6));
      setConvoLog(prev => [...prev, { who: "customer", amount: customer.askingPrice, text: `"I'm looking to get $${customer.askingPrice.toLocaleString()} for this."` }]);
    } else {
      const bottle = inventory.find(b => b.id === selectedSellBottle);
      const { offer, maxPay, budget } = getOfferForBottle(customer, bottle);
      setCustomerOffer(offer);
      setPlayerOffer(Math.round(offer * 1.3));
      setCurrentCustomer(prev => ({ ...prev, openingOffer: offer, maxPay, budget }));
      setConvoLog(prev => [...prev, { who: "customer", amount: offer, text: `"I'd offer $${offer.toLocaleString()} for that."` }]);
    }
  }, [inventory, selectedSellBottle, getOfferForBottle]);

  const submitOffer = useCallback(() => {
    if (!currentCustomer || !negotiating) return;
    const c = currentCustomer;
    
    const round = negRound + 1;

    if (c.type === "seller") {
      // Player is offering to BUY at playerOffer. Seller wants at least minAccept.
      if (playerOffer >= c.askingPrice) {
        // Accepted immediately — overpaid
        setNegResult("accepted");
        setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"Deal! Pleasure doing business."` }]);
      } else if (playerOffer >= c.minAccept) {
        // In acceptable range — chance of accept scales with how close to asking
        const ratio = (playerOffer - c.minAccept) / (c.askingPrice - c.minAccept);
        const acceptChance = Math.max(0.05, Math.min(0.95, 0.2 + ratio * 0.7 + (c.acceptBonus || 0)));
        if (Math.random() < acceptChance || round >= c.maxRounds) {
          setNegResult("accepted");
          setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"...Alright, you've got a deal."` }]);
        } else {
          // Counter: move toward player's offer
          const newCounter = Math.round(customerOffer - (customerOffer - playerOffer) * (0.3 + c.flexibility * 0.3));
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${c.counterLines[Math.floor(Math.random() * c.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      } else {
        // Below minimum
        if (round >= c.maxRounds) {
          setNegResult("walked");
          setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: null, text: `"${c.walkLine}"` }]);
        } else {
          // Counter more firmly
          const newCounter = Math.round(customerOffer - (customerOffer - c.minAccept) * 0.2);
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${c.counterLines[Math.floor(Math.random() * c.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      }
    } else {
      // Player is SELLING at playerOffer. Buyer will pay up to maxPay.
      if (playerOffer <= c.openingOffer) {
        // Accepted immediately — undersold
        setNegResult("accepted");
        setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"Sold! That's a great price."` }]);
      } else if (playerOffer <= c.maxPay) {
        const ratio = (c.maxPay - playerOffer) / (c.maxPay - c.openingOffer);
        const acceptChance = Math.max(0.05, Math.min(0.95, 0.15 + ratio * 0.7 + (c.acceptBonus || 0)));
        if (Math.random() < acceptChance || round >= c.maxRounds) {
          setNegResult("accepted");
          setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"...Fine, I'll take it."` }]);
        } else {
          const newCounter = Math.round(customerOffer + (playerOffer - customerOffer) * (0.3 + c.flexibility * 0.3));
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          const counterLine = c.counterLines[Math.floor(Math.random() * c.counterLines.length)];
          setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${counterLine} $${newCounter.toLocaleString()}."` }]);
        }
      } else {
        if (round >= c.maxRounds) {
          setNegResult("walked");
          setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: null, text: `"${c.walkLine}"` }]);
        } else {
          const newCounter = Math.round(customerOffer + (c.maxPay - customerOffer) * 0.25);
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          const counterLine = c.counterLines[Math.floor(Math.random() * c.counterLines.length)];
          setConvoLog(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${counterLine} $${newCounter.toLocaleString()}."` }]);
        }
      }
    }
    setNegRound(round);
  }, [currentCustomer, negotiating, negRound, playerOffer, customerOffer, inventory, selectedSellBottle]);

  const acceptCounter = useCallback(() => {
    if (!currentCustomer) return;
    setPlayerOffer(customerOffer);
    setNegResult("accepted");
    setConvoLog(prev => [...prev, { who: "player", amount: customerOffer, text: `You accept $${customerOffer.toLocaleString()}` }, { who: "customer", amount: customerOffer, text: `"Deal!"` }]);
  }, [currentCustomer, customerOffer]);


  const handleTradeResume = useCallback(() => {
    // Restore seller state after side-sale completes
    if (tradePendingBottle) {
      setCurrentCustomer(prev => ({
        ...prev,
        type: tradePendingBottle.type,
        bottle: tradePendingBottle.bottle,
        askingPrice: tradePendingBottle.askingPrice,
        minAccept: tradePendingBottle.minAccept,
        openingOffer: tradePendingBottle.openingOffer,
        maxPay: tradePendingBottle.maxPay,
        budget: tradePendingBottle.budget,
      }));
    }
    setTradeMode(false);
    setTradeResult(null);
    setTradePendingBottle(null);
    setSelectedSellBottle(null);
    setNegotiating(false);
    setNegResult(null);
    
    setPreTacticUsed(null);
    setMidTacticUsed(null);
    setTacticResult(null);
  }, [tradePendingBottle]);

  const handleTradeDismiss = useCallback(() => {
    // Failed trade — dismiss trade UI, continue with normal deal options
    setTradeMode(false);
    setTradeResult(null);
  }, []);

  const finalizeDeal = useCallback(() => {
    if (!currentCustomer || negResult !== "accepted") return;
    const finalPrice = convoLog.filter(m => m.amount != null).slice(-1)[0]?.amount || playerOffer;
    const isSideSale = tradeResult === "saleMode";
    if (currentCustomer.type === "seller") {
      if (!canAfford(finalPrice) || shelfFull) return;
      const boughtBottle = { ...currentCustomer.bottle, purchasePrice: finalPrice };
      setCash(prev => prev - finalPrice);
      setDailyLog(prev => [...prev, { type: "buy", desc: boughtBottle.displayName, amount: -finalPrice }]);
      setInventory(p => [boughtBottle, ...p]);
      setReputation(prev => prev + (finalPrice < currentCustomer.bottle.trueValue * 0.7 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
      trackPriceInCodex(boughtBottle, "buy", finalPrice);
      audio.playSfx("buySuccess");
    } else {
      const bottle = inventory.find(b => b.id === selectedSellBottle);
      if (!bottle) return;
      setCash(prev => prev + finalPrice);
      setDailyLog(prev => [...prev, { type: "sell", desc: bottle.displayName, amount: finalPrice }]);
      setInventory(p => p.filter(b => b.id !== selectedSellBottle));
      setReputation(prev => prev + (finalPrice > (bottle.purchasePrice || 0) * 1.3 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
      trackPriceInCodex(bottle, "sell", finalPrice);
      trackBottleInCodex(bottle);
      audio.playSfx("sellSuccess");
    }
    setNegotiating(false);
    setNegResult(null);
    setSelectedSellBottle(null);
    if (isSideSale) {
      // Side-sale complete — revert to seller's original bottle
      handleTradeResume();
    } else {
      advanceToNextCustomer();
    }
  }, [currentCustomer, negResult, playerOffer, shelfFull, inventory, selectedSellBottle, audio, advanceToNextCustomer, trackBottleInCodex, tradeResult, handleTradeResume]);

  const walkAway = useCallback(() => {
    const isSideSale = tradeResult === "saleMode";
    setNegotiating(false);
    setNegResult(null);
    audio.playSfx("pass");
    if (isSideSale) {
      // Walking away from side-sale — just revert to seller's bottle
      handleTradeResume();
    } else {
      advanceToNextCustomer();
    }
  }, [audio, advanceToNextCustomer, tradeResult, handleTradeResume]);

  const handleStartDay = useCallback(() => {
    const { queue, event } = generateDayQueue();
    setDayEvent(event);
    setShowEventModal(false);
    setCustomerQueue(queue);
    setCustomerIndex(0);
    const first = queue.length > 0 ? queue[0] : null;
    setCurrentCustomer(first);
    if (first) setConvoLog([{ who: "narrator", text: first.descriptor }]);
    if (first && first.type === "seller" && first.bottle) { const yearVis = (first.traits?.knowledge || 0) >= 70 && first.bottle.yearKnown; trackBottleInCodex(first.bottle, yearVis); }
    setDayStarted(true);
    setSelectedSellBottle(null);
    setNegotiating(false);
    setNegResult(null);
    if (devNextCustomer) setDevNextCustomer(null); // clear after use
    audio.playSfx("buttonClick");
  }, [generateDayQueue, audio, trackBottleInCodex, devNextCustomer]);

  const handlePass = useCallback(() => {
    audio.playSfx("pass");
    setNegotiating(false); setNegResult(null);
    advanceToNextCustomer();
  }, [audio, advanceToNextCustomer]);

  // ---- TRADE FLOW: Convince seller to buy from you first ----
  const handleOfferTrade = useCallback(() => {
    // Enter trade mode — show inventory picker
    setTradeMode(true);
    setTradeBottleId(null);
    setTradeResult(null);
  }, []);

  const handleTradeSelect = useCallback((bottleId) => {
    setTradeBottleId(bottleId);
  }, []);

  const handleTradeSubmit = useCallback(() => {
    if (!tradeBottleId || !currentCustomer) return;
    const bottle = inventory.find(b => b.id === tradeBottleId);
    if (!bottle) return;
    const c = currentCustomer;
    const skill = playerSkills.salesmanship || 0;

    // Calculate success chance
    let chance = 0.15 + skill * 0.12;
    const dispBonus = ((c.disposition || 50) - 50) / 200;
    chance += dispBonus;
    const valueRatio = bottle.value / Math.max(c.bottle?.trueValue || 100, 50);
    chance += Math.min(valueRatio * 0.1, 0.15);
    const sellerRegion = c.bottle?.region;
    if (sellerRegion && bottle.region === sellerRegion) chance += 0.08;
    chance = Math.max(0.08, Math.min(0.92, chance));

    const success = Math.random() < chance;

    if (success) {
      // Success! Convert customer to temporary buyer for this bottle
      // Save the seller state so we can restore it later
      const sellerState = {
        type: c.type, bottle: c.bottle, askingPrice: c.askingPrice, minAccept: c.minAccept,
        openingOffer: c.openingOffer, maxPay: c.maxPay, budget: c.budget,
      };
      setTradePendingBottle(sellerState);

      // Generate a buyer offer for this bottle
      const priceSkillMod = 0.55 + skill * 0.08;
      const budgetRatio = (0.7 + Math.random() * 0.5) * priceSkillMod;
      const offerRatio = 0.6 + Math.random() * 0.25;
      const budget = Math.round(bottle.value * budgetRatio * 1.5);
      const maxPay = Math.round(bottle.value * budgetRatio);
      const offer = Math.round(maxPay * offerRatio);

      // Temporarily convert customer to buyer
      setCurrentCustomer(prev => ({
        ...prev, type: "buyer", openingOffer: offer, maxPay, budget, budgetRatio, offerRatio,
        filter: () => true, // they'll buy what we showed them
      }));
      setSelectedSellBottle(tradeBottleId);
      setTradeMode(false);
      setTradeResult("saleMode");

      // Dialogue
      const successLines = skill >= 4
        ? ['"Oh, that\'s lovely. Let me take a closer look... what are you asking?"', '"Now that\'s interesting. Alright, I\'m listening — what\'s your price?"']
        : skill >= 2
        ? ['"Hmm, you know what — I could be interested. What did you have in mind?"', '"I wasn\'t planning on buying, but that caught my eye. What are you thinking?"']
        : ['"Well... I suppose I could take a look. What would you want for it?"', '"I didn\'t come here to buy, but alright — name your price."'];
      const line = successLines[Math.floor(Math.random() * successLines.length)];
      setConvoLog(prev => [...prev, { who: "customer", amount: offer, text: `${line} I'd go $${offer.toLocaleString()}.` }]);

      // Start negotiation
      setNegotiating(true);
      setNegRound(0);
      setNegResult(null);
      setCustomerOffer(offer);
      setPlayerOffer(Math.round(offer * 1.3));
      setPreTacticUsed(null);
      setMidTacticUsed(null);
      setTacticResult(null);

      audio.playSfx("buttonClick");
    } else {
      setTradeResult("failed");
      setCurrentCustomer(prev => ({ ...prev, disposition: Math.max(0, (prev.disposition || 50) - 5) }));
      const failLines = skill >= 3
        ? ['"I appreciate the offer, but I\'m here to sell, not buy. Can we focus on my bottle?"', '"That\'s not quite what I\'m after right now. So — my bottle?"']
        : ['"No thanks, I\'m not in the market for that."', '"I appreciate the hustle, but no. About my bottle though..."', '"Not interested. Can we get back to what I came here for?"'];
      const line = failLines[Math.floor(Math.random() * failLines.length)];
      setConvoLog(prev => [...prev, { who: "customer", amount: null, text: line }]);
      audio.playSfx("pass");
    }

    setTradeBottleId(null);
  }, [tradeBottleId, currentCustomer, inventory, playerSkills, audio]);


  // Upgrade store
  const handleUpgrade = useCallback(() => {
    if (storeTier >= 6) return;
    const nextTier = ECONOMY_TIERS[storeTier];
    if (cash < nextTier.upgradeCost || reputation < nextTier.repRequired) return;
    setCash(prev => prev - nextTier.upgradeCost);
    setStoreTier(prev => prev + 1);
    setDailyLog(prev => [...prev, { type: "upgrade", desc: `Upgraded to ${STORE_TIERS[storeTier].name}`, amount: -nextTier.upgradeCost }]);
    audio.playSfx("storeUpgrade");
  }, [storeTier, cash, reputation, audio]);

  // End of day / Rent system
  const handleEndDay = useCallback(() => {
    const revenue = dailyLog.filter(l => l.amount > 0).reduce((s, l) => s + l.amount, 0);
    const expenses = dailyLog.filter(l => l.amount < 0).reduce((s, l) => s + Math.abs(l.amount), 0);
    const buys = dailyLog.filter(l => l.type === "buy");
    const sells = dailyLog.filter(l => l.type === "sell");
    const deals = buys.length + sells.length;
    const bestDeal = sells.length > 0 ? sells.reduce((best, l) => l.amount > best.amount ? l : best, sells[0]) : null;
    const totalInventoryValue = inventory.reduce((s, b) => s + (b.purchasePrice || b.value), 0);
    const summary = { revenue, expenses, profit: revenue - expenses, deals, dayNum: day,
      buyCount: buys.length, sellCount: sells.length, bestDeal,
      totalWealth: cash + totalInventoryValue, inventoryValue: totalInventoryValue, inventoryCount: inventory.length,
      customersSeen: customerIndex + (currentCustomer ? 1 : 0), customersTotal: customerQueue.length };

    const isRentDay = day > 0 && day % 7 === 0;
    if (isRentDay) {
      const rent = tierData.weeklyRent;
      if (cash >= rent) {
        setCash(prev => prev - rent);
        summary.rentPaid = rent;
        summary.profit -= rent;
      } else {
        const newMissed = missedRent + 1;
        setMissedRent(newMissed);
        summary.rentMissed = true;
        summary.missedCount = newMissed;
        if (newMissed >= MAX_MISSED_RENT) { summary.gameOver = true; setGameOver(true); }
      }
    }

    setShowDaySummary(summary);
    setDay(prev => prev + 1);
    setDailyLog([]);
    setDayStarted(false);
    setCurrentCustomer(null);
    setCustomerQueue([]);
    setCustomerIndex(0);
    setSelectedSellBottle(null);
    setNegotiating(false);
    setNegResult(null);
    setDayEvent(null);
   
    setPreTacticUsed(null);
    setMidTacticUsed(null);
    setTacticResult(null);
    setConvoPhase("greeting"); setConvoLog([]); setConvoTurns(0); setUsedConvoOptions([]); setTraitHints([]); setConvoWaiting(false); setInspectResult(null); setTradeMode(false); setTradeBottleId(null); setTradeResult(null); setTradePendingBottle(null);
  }, [day, dailyLog, cash, tierData, missedRent, customerIndex, currentCustomer, customerQueue]);

  const closeDaySummary = useCallback(() => { setShowDaySummary(null); }, []);

  const filteredInventory = inventory.filter(b => filterType === "All" || b.typeName === filterType).sort((a, b) => {
    if (sortBy === "value") return b.value - a.value; if (sortBy === "age") return b.age - a.age;
    if (sortBy === "proof") return b.proof - a.proof;
    if (sortBy === "rarity") { const o = RARITIES.map(r => r.name); return o.indexOf(b.rarity) - o.indexOf(a.rarity); } return 0;
  });
  const totalValue = inventory.reduce((s, b) => s + b.value, 0);

  return (
    <div id="game-root" style={{ minHeight: "100vh", fontFamily: "'Inter', -apple-system, sans-serif", padding: 0 }}>
      {/* Inject theme CSS variables */}
      <style>{`#game-root { ${themeToCSS(THEMES[colorTheme] || THEMES.classic)} background: linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 40%, var(--bg1) 100%); color: var(--text-muted); }`}</style>

      {showOptions && <OptionsMenu audio={audio} onClose={() => { setShowOptions(false); audio.playSfx("buttonClick"); }}
        onSfxChange={v => { audio.setSfxVolume(v); audio.playSfx("buttonClick"); }} onMusicChange={v => audio.setMusicVolume(v)}
        currentTheme={colorTheme} onThemeChange={handleThemeChange} onDevTools={() => setShowDevMenu(true)} />}

      {/* Day Summary Modal */}
      {showDaySummary && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: "16px" }}>
          <div style={{ background: `linear-gradient(145deg, var(--bg3), var(--bg2))`, borderRadius: "16px", padding: "24px", border: "2px solid var(--border)", width: "420px", maxWidth: "90vw", textAlign: "center", animation: "fadeIn 0.4s ease-out" }}>
            <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "2px", marginBottom: "4px" }}>END OF DAY</div>
            <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "var(--accent)", margin: "0 0 4px 0", fontSize: "28px" }}>
              Day {showDaySummary.dayNum}
            </h2>
            <div style={{ fontSize: "11px", color: "var(--text-dim)", fontFamily: "monospace", marginBottom: "16px" }}>{STORE_TIERS[storeTier - 1].name} · {showDaySummary.customersTotal} visitor{showDaySummary.customersTotal !== 1 ? "s" : ""}</div>

            <div style={{ height: "1px", background: "linear-gradient(90deg, transparent, #3a3028, transparent)", margin: "0 0 16px 0" }} />

            {/* Revenue & Expenses */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "12px" }}>
              <div style={{ background: "var(--surface)", borderRadius: "8px", padding: "10px" }}>
                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px", marginBottom: "2px" }}>REVENUE</div>
                <div style={{ fontSize: "20px", color: "var(--success)", fontFamily: "monospace", fontWeight: "bold" }}>+${showDaySummary.revenue.toLocaleString()}</div>
                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace" }}>{showDaySummary.sellCount} sale{showDaySummary.sellCount !== 1 ? "s" : ""}</div>
              </div>
              <div style={{ background: "var(--surface)", borderRadius: "8px", padding: "10px" }}>
                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px", marginBottom: "2px" }}>EXPENSES</div>
                <div style={{ fontSize: "20px", color: "var(--danger)", fontFamily: "monospace", fontWeight: "bold" }}>-${showDaySummary.expenses.toLocaleString()}</div>
                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace" }}>{showDaySummary.buyCount} purchase{showDaySummary.buyCount !== 1 ? "s" : ""}</div>
              </div>
            </div>

            {/* Net Profit - prominent */}
            <div style={{ background: showDaySummary.profit >= 0 ? "#22C55E08" : "#C0392B08", borderRadius: "10px", padding: "14px", marginBottom: "12px", border: `1px solid ${showDaySummary.profit >= 0 ? "#22C55E20" : "#C0392B20"}` }}>
              <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px", marginBottom: "4px" }}>NET PROFIT</div>
              <div style={{ fontSize: "26px", color: showDaySummary.profit >= 0 ? "var(--success)" : "var(--danger)", fontFamily: "'Playfair Display', Georgia, serif", fontWeight: "bold" }}>
                {showDaySummary.profit >= 0 ? "+" : ""}${showDaySummary.profit.toLocaleString()}
              </div>
            </div>

            {/* Best deal */}
            {showDaySummary.bestDeal && (
              <div style={{ fontSize: "11px", fontFamily: "monospace", color: "var(--accent)", marginBottom: "12px", padding: "6px 10px", background: "#D4AF3708", borderRadius: "6px" }}>
                Best sale: {showDaySummary.bestDeal.desc} — ${showDaySummary.bestDeal.amount.toLocaleString()}
              </div>
            )}

            {/* Portfolio snapshot */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "6px", marginBottom: "16px" }}>
              <div style={{ background: "var(--surface)", borderRadius: "6px", padding: "8px" }}>
                <div style={{ fontSize: "8px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px" }}>CASH</div>
                <div style={{ fontSize: "14px", color: "var(--success)", fontFamily: "monospace" }}>${cash.toLocaleString()}</div>
              </div>
              <div style={{ background: "var(--surface)", borderRadius: "6px", padding: "8px" }}>
                <div style={{ fontSize: "8px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px" }}>INVENTORY</div>
                <div style={{ fontSize: "14px", color: "var(--text)", fontFamily: "monospace" }}>${showDaySummary.inventoryValue.toLocaleString()}</div>
              </div>
              <div style={{ background: "var(--surface)", borderRadius: "6px", padding: "8px" }}>
                <div style={{ fontSize: "8px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px" }}>NET WORTH</div>
                <div style={{ fontSize: "14px", color: "var(--accent)", fontFamily: "monospace" }}>${showDaySummary.totalWealth.toLocaleString()}</div>
              </div>
            </div>

            <div style={{ height: "1px", background: "linear-gradient(90deg, transparent, #3a3028, transparent)", margin: "0 0 12px 0" }} />

            {showDaySummary.rentPaid && (
              <div style={{ background: "#22C55E10", border: "1px solid #22C55E25", borderRadius: "8px", padding: "8px", marginBottom: "10px", fontSize: "11px", fontFamily: "monospace", color: "var(--success)" }}>
                Rent paid: ${showDaySummary.rentPaid.toLocaleString()}
              </div>
            )}
            {showDaySummary.rentMissed && !showDaySummary.gameOver && (
              <div style={{ background: "#C0392B10", border: "1px solid #C0392B25", borderRadius: "8px", padding: "8px", marginBottom: "10px", fontSize: "11px", fontFamily: "monospace", color: "var(--danger)" }}>
                RENT MISSED! ({showDaySummary.missedCount}/{MAX_MISSED_RENT} — {MAX_MISSED_RENT - showDaySummary.missedCount} left)
              </div>
            )}
            {showDaySummary.gameOver && (
              <div style={{ background: "var(--danger)", border: "2px solid #C0392B", borderRadius: "8px", padding: "12px", marginBottom: "10px", fontSize: "13px", fontFamily: "'Playfair Display', Georgia, serif", color: "var(--danger)" }}>
                EVICTION NOTICE — Store closed.
              </div>
            )}

            <button onClick={closeDaySummary} style={{ ...menuBtnStyle, width: "100%", marginTop: "4px" }}>
              {showDaySummary.gameOver ? "ACCEPT FATE" : `BEGIN DAY ${showDaySummary.dayNum + 1}`}
            </button>
          </div>
        </div>
      )}

      {/* TITLE */}
      {screen === "title" && (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: "20px", textAlign: "center" }}>
          <div style={{ width: "100%", maxWidth: "540px", marginBottom: "24px", opacity: 0.85 }}><TitleShelfDisplay /></div>
          <h1 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "clamp(32px, 6vw, 52px)", color: "var(--accent)", margin: "0 0 4px 0", letterSpacing: "4px", textShadow: "0 0 30px rgba(212,175,55,0.3), 0 2px 4px rgba(0,0,0,0.5)", animation: "titlePulse 3s ease-in-out infinite" }}>RARE SPIRITS</h1>
          <div style={{ fontFamily: "'Inter', sans-serif", fontSize: "clamp(10px, 2vw, 13px)", color: "var(--text-dim)", letterSpacing: "4px", marginBottom: "40px", fontWeight: "500" }}>WHISKEY TRADING CO.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: "12px", width: "260px" }}>
            <button onClick={() => { setScreen("saves"); audio.playSfx("buttonClick"); }} style={menuBtnStyle}
              onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 20px rgba(212,175,55,0.5)"; }}
              onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 12px rgba(212,175,55,0.3)"; }}>START GAME</button>
            <button onClick={() => { setShowOptions(true); audio.playSfx("buttonClick"); }}
              style={{ ...menuBtnStyle, background: `linear-gradient(145deg, var(--bg3), var(--bg2))`, color: "var(--accent)", boxShadow: "0 4px 12px rgba(0,0,0,0.3)" }}>OPTIONS</button>
            <button onClick={() => { if (window.close) window.close(); }}
              style={{ ...menuBtnStyle, background: "transparent", color: "var(--text-dim)", border: "2px solid #3a302860", boxShadow: "none" }}>QUIT</button>
          </div>
        </div>
      )}

      {/* SAVE SLOTS */}
      {screen === "saves" && (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
          <SaveSlotScreen saves={saves} onSelectSlot={handleSelectSlot} onDeleteSlot={handleDeleteSlot} onBack={() => { setScreen("title"); audio.playSfx("buttonClick"); }} />
        </div>
      )}

      {/* NAME STORE */}
      {screen === "nameStore" && <StoreNameScreen onSubmit={handleNameSubmit} />}

      {/* GAME */}
      {screen === "game" && engine && (
        <>
          <div style={{ borderBottom: "1px solid var(--border)", padding: "4px 12px", background: "linear-gradient(180deg, var(--surface) 0%, transparent 100%)" }}>
            <div style={{ maxWidth: "1200px", margin: "0 auto" }}>
              {/* Single row: name left, stats center, buttons right */}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ minWidth: "60px" }}>
                  <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "14px", color: "var(--accent)", letterSpacing: "0.5px", lineHeight: 1.1 }}>{storeName}</div>
                  <div style={{ fontSize: "7px", color: "var(--text-dim)", letterSpacing: "1px", fontFamily: "monospace" }}>
                    DAY {day} · {STORE_TIERS[storeTier - 1].name.toUpperCase()}
                    {missedRent > 0 && <span style={{ color: "var(--danger)", marginLeft: "4px" }}>OVERDUE</span>}
                  </div>
                </div>
                <div style={{ display: "flex", gap: "4px", fontSize: "9px", fontFamily: "'Inter', sans-serif", fontWeight: "500" }}>
                  <div style={{ background: "var(--surface)", padding: "2px 6px", borderRadius: "3px", border: "1px solid var(--border)" }}>
                    <span style={{ color: "var(--text-dim)" }}>$</span><span style={{ color: cash < tierData.weeklyRent ? "var(--danger)" : "var(--success)", fontWeight: "bold" }}>{cash.toLocaleString()}</span>
                  </div>
                  <div style={{ background: "var(--surface)", padding: "2px 6px", borderRadius: "3px", border: "1px solid var(--border)" }}>
                    <span style={{ color: "var(--text-dim)" }}>REP </span><span style={{ color: "var(--accent)", fontWeight: "bold" }}>{reputation}</span>
                  </div>
                  <div style={{ background: "var(--surface)", padding: "2px 6px", borderRadius: "3px", border: "1px solid var(--border)" }}>
                    <span style={{ color: inventory.length >= shelfLimit ? "var(--danger)" : "var(--text)", fontWeight: "bold" }}>{inventory.length}/{shelfLimit}</span>
                  </div>
                  <div style={{ background: "var(--surface)", padding: "2px 6px", borderRadius: "3px", border: "1px solid var(--border)" }}>
                    <span style={{ color: "var(--text-dim)" }}>RENT </span><span style={{ color: "var(--text)" }}>${tierData.weeklyRent}</span>
                    {day % 7 > 0 && <span style={{ color: "var(--text-dim)" }}> ({7 - (day % 7)}d)</span>}
                  </div>
                </div>
                <div style={{ display: "flex", gap: "3px", alignItems: "center", minWidth: "60px", justifyContent: "flex-end" }}>
                  {dayStarted && dayEvent && (
                    <button onClick={() => setShowEventModal(true)}
                      style={{ padding: "2px 5px", background: dayEvent.type === "hotTip" ? "var(--accent)" : "var(--success)", border: "none", borderRadius: "3px", color: "var(--bg1)", fontSize: "10px", fontWeight: "bold", cursor: "pointer", lineHeight: 1 }}>!</button>
                  )}
                  <button onClick={() => { setShowOptions(true); audio.playSfx("buttonClick"); }}
                    style={{ padding: "2px 5px", border: "1px solid var(--border)", borderRadius: "3px", background: "transparent", color: "var(--text-dim)", fontSize: "10px", cursor: "pointer", fontFamily: "monospace" }}>⚙</button>
                  <button onClick={() => { resetActiveState(); setScreen("title"); audio.playSfx("buttonClick"); }}
                    style={{ padding: "2px 5px", border: "1px solid var(--border)", borderRadius: "3px", background: "transparent", color: "var(--text-dim)", fontSize: "10px", cursor: "pointer", fontFamily: "monospace" }}>☰</button>
                </div>
              </div>
              {/* Daily log ticker in header */}
              {dayStarted && dailyLog.length > 0 && (
                <div style={{ textAlign: "center", fontSize: "8px", color: "var(--text-dim)", fontFamily: "monospace", marginTop: "2px" }}>
                  {dailyLog.filter(l => l.type === "buy").length}B · {dailyLog.filter(l => l.type === "sell").length}S · Net: <span style={{ color: dailyLog.reduce((s, l) => s + l.amount, 0) >= 0 ? "var(--success)" : "var(--danger)" }}>${dailyLog.reduce((s, l) => s + l.amount, 0).toLocaleString()}</span>
                </div>
              )}
              {/* Thin progress bar beneath */}
              {dayStarted && customerQueue.length > 0 && (
                <div style={{ display: "flex", alignItems: "center", gap: "4px", marginTop: "3px" }}>
                  <span style={{ fontSize: "8px", color: "var(--text-dim)", fontFamily: "monospace" }}>{Math.min(customerIndex + 1, customerQueue.length)}/{customerQueue.length}</span>
                  <div style={{ flex: 1, height: "2px", background: "var(--surface)", borderRadius: "1px", overflow: "hidden" }}>
                    <div style={{ width: `${((customerIndex + (currentCustomer ? 0 : 1)) / Math.max(customerQueue.length, 1)) * 100}%`, height: "100%", background: "var(--accent)", borderRadius: "1px", transition: "width 0.3s" }} />
                  </div>
                </div>
              )}
            </div>
          </div>

          <div style={{ maxWidth: "1200px", margin: "0 auto", padding: "8px 12px 72px" }}>

            <div style={{ minHeight: "calc(100vh - 140px)" }}>
            {activeTab === "storefront" && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "20px" }}>
                <StorefrontSVG storeName={storeName} tier={storeTier} />
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "16px", color: "var(--accent)", marginBottom: "4px" }}>
                    {STORE_TIERS[storeTier - 1].name}
                  </div>
                  <p style={{ color: "var(--text-dim)", fontSize: "13px", fontStyle: "italic", maxWidth: "500px", lineHeight: 1.6, margin: "0 auto" }}>
                    {STORE_TIERS[storeTier - 1].desc}
                  </p>
                </div>
                {/* Economy overview */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "12px", width: "100%", maxWidth: "500px" }}>
                  {[
                    ["Shelf Capacity", `${inventory.length} / ${shelfLimit}`],
                    ["Weekly Rent", `$${tierData.weeklyRent}`],
                    ["Reputation", `${reputation}`],
                  ].map(([label, val]) => (
                    <div key={label} style={{ background: "var(--surface)", borderRadius: "8px", padding: "12px", textAlign: "center", border: "1px solid var(--border)" }}>
                      <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px", marginBottom: "4px" }}>{label}</div>
                      <div style={{ fontSize: "16px", color: "var(--text)", fontFamily: "'Playfair Display', Georgia, serif" }}>{val}</div>
                    </div>
                  ))}
                </div>
                {/* Upgrade section */}
                {storeTier < 6 && (() => {
                  const next = ECONOMY_TIERS[storeTier];
                  const canUpgrade = cash >= next.upgradeCost && reputation >= next.repRequired;
                  return (

                                        setCash(prev => prev - currentCustomer.askingPrice);
                                        setDailyLog(prev => [...prev, { type: "buy", desc: boughtBottle.displayName, amount: -currentCustomer.askingPrice }]);
                                        setInventory(p => [boughtBottle, ...p]);
                                        setReputation(prev => prev + (currentCustomer.askingPrice < currentCustomer.bottle.trueValue * 0.7 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
                                        trackPriceInCodex(boughtBottle, "buy", currentCustomer.askingPrice);
                                        audio.playSfx("buySuccess");
                                        advanceToNextCustomer();
                                      }
                                    }} disabled={!canAfford(currentCustomer.askingPrice)}
                                      style={{ flex: "1 1 auto", minWidth: "100px", padding: "12px 16px", background: canAfford(currentCustomer.askingPrice) ? "linear-gradient(145deg, #22C55E, var(--success))" : "var(--border)", border: "none", borderRadius: "8px", color: canAfford(currentCustomer.askingPrice) ? "#fff" : "var(--text-dim)", fontSize: "13px", fontWeight: "bold", cursor: canAfford(currentCustomer.askingPrice) ? "pointer" : "not-allowed", fontFamily: "monospace", opacity: canAfford(currentCustomer.askingPrice) ? 1 : 0.5 }}>
                                      ACCEPT ${currentCustomer.askingPrice.toLocaleString()}
                                    </button>
                                    <button onClick={() => startNegotiation(currentCustomer)}
                                      style={{ flex: "1 1 auto", minWidth: "100px", padding: "12px 16px", background: "linear-gradient(145deg, var(--accent), var(--accent-dark))", border: "none", borderRadius: "8px", color: "var(--bg1)", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                      NEGOTIATE
                                    </button>
                                  </>
                                )}
                                <button onClick={handlePass} style={{ flex: "1 1 auto", minWidth: "80px", padding: "12px 16px", background: "transparent", border: "2px solid var(--text-dim)", borderRadius: "8px", color: "var(--text-dim)", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>PASS</button>
                              </div>
                            )}

                            {/* Negotiation UI */}
                            {negotiating && (
                              <div style={{ width: "100%", maxWidth: "460px" }}>
                                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace", textAlign: "center", marginBottom: "6px" }}>
                                  Round {negRound + 1}
                                </div>
                                {negResult === "accepted" ? (
                                  <div style={{ textAlign: "center" }}>
                                    <div style={{ color: "var(--success)", fontSize: "16px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Deal Agreed!</div>
                                    {!canAfford(convoLog[convoLog.length-1]?.amount || 0) ? (
                                      <div style={{ color: "var(--danger)", fontSize: "12px", fontFamily: "monospace", marginBottom: "8px" }}>You can't afford this! (${cash.toLocaleString()} available)</div>
                                    ) : (
                                      <button onClick={finalizeDeal} style={{ ...menuBtnStyle, padding: "10px 20px", fontSize: "13px", background: "linear-gradient(145deg, #22C55E, var(--success))", width: "100%" }}>
                                        CONFIRM — Pay ${(convoLog[convoLog.length-1]?.amount || 0).toLocaleString()}
                                      </button>
                                    )}
                                  </div>
                                ) : negResult === "walked" ? (
                                  <div style={{ textAlign: "center" }}>
                                    <div style={{ color: "var(--danger)", fontSize: "14px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Customer walked away.</div>

                                  </div>
                                ) : (
                                  <>
                                    {((!preTacticUsed && negRound === 0) || (!midTacticUsed && negRound > 0)) && (
                                      <div style={{ textAlign: "center", marginBottom: "10px" }}>
                                        <button onClick={() => setShowTacticsMenu(true)}
                                          style={{ padding: "6px 16px", background: "rgba(255,255,255,0.04)", border: "1px solid var(--accent)", borderRadius: "6px", color: "var(--accent)", fontSize: "11px", cursor: "pointer", fontFamily: "monospace" }}>
                                          TACTICS
                                        </button>
                                      </div>
                                    )}
                                    <div style={{ marginBottom: "10px" }}>
                                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", marginBottom: "4px" }}>
                                        <span>${Math.round(currentCustomer.askingPrice * 0.25).toLocaleString()}</span><span>${playerOffer.toLocaleString()}</span><span>${Math.round(currentCustomer.askingPrice * 1.5).toLocaleString()}</span>
                                      </div>
                                      <input type="range" min={Math.round(currentCustomer.askingPrice * 0.25)} max={Math.round(currentCustomer.askingPrice * 1.5)} step={1} value={playerOffer}
                                        onChange={e => setPlayerOffer(Number(e.target.value))} style={{ width: "100%", accentColor: "var(--accent)", cursor: "pointer" }} />
                                    </div>
                                    <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                                      <button onClick={submitOffer} style={{ flex: "1 1 auto", padding: "10px 12px", background: "linear-gradient(145deg, var(--accent), var(--accent-dark))", border: "none", borderRadius: "8px", color: "var(--bg1)", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                        OFFER ${playerOffer.toLocaleString()}
                                      </button>
                                      {negResult === "countered" && (
                                        <button onClick={acceptCounter} style={{ flex: "1 1 auto", padding: "10px 12px", background: "linear-gradient(145deg, #22C55E, var(--success))", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                          ACCEPT ${customerOffer.toLocaleString()}
                                        </button>
                                      )}
                                      <button onClick={walkAway} style={{ flex: "0 0 auto", padding: "10px 12px", background: "transparent", border: "2px solid var(--text-dim)", borderRadius: "8px", color: "var(--text-dim)", fontSize: "12px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>WALK</button>
                                    </div>
                                  </>
                                )}
                              </div>
                            )}
                          </div>
                        )}

                        {/* ---- DEAL PHASE: BUYER ---- */}
                        {convoPhase === "deal" && currentCustomer.type === "buyer" && (
                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "8px" }}>
                            {currentCustomer.leaving ? (
                              <div style={{ textAlign: "center", padding: "12px" }}>
                                <button onClick={handlePass}
                                  style={{ padding: "10px 24px", background: `linear-gradient(145deg, var(--bg3), var(--bg2))`, border: "1px solid var(--border)", borderRadius: "8px", color: "var(--text-muted)", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                  NEXT CUSTOMER
                                </button>
                              </div>
                            ) : !negotiating && (
                              <>
                                {(() => {
                                  const hasPivoted = currentCustomer.pivoted;
                                  const matching = hasPivoted ? inventory : inventory.filter(currentCustomer.filter);
                                  const nonMatching = hasPivoted ? [] : inventory.filter(b => !currentCustomer.filter(b));
                                  const sorted = [...matching, ...nonMatching];
                                  if (sorted.length === 0) return <div style={{ color: "#5a4a38", fontSize: "13px", padding: "20px" }}>Your shelves are empty.</div>;
                                  return (
                                    <div style={{ width: "100%", maxWidth: "460px" }}>
                                      <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", marginBottom: "4px" }}>
                                        {hasPivoted ? "They're open to suggestions — select a bottle to offer" : `Select a bottle to offer (${matching.length} match${matching.length !== 1 ? "es" : ""})`}
                                      </div>
                                      <div style={{ maxHeight: selectedSellBottle ? "120px" : "220px", overflowY: "auto", border: "1px solid var(--border)", borderRadius: "8px", background: "rgba(255,255,255,0.02)", transition: "max-height 0.3s" }}>
                                        {sorted.map(b => {
                                          const isSelected = selectedSellBottle === b.id;
                                          const isMatch = hasPivoted ? true : currentCustomer.filter(b);
                                          return (
                                            <div key={b.id} onClick={() => { setSelectedSellBottle(b.id); setPlayerOffer(b.purchasePrice != null ? Math.round(b.purchasePrice * 1.5) : 50); }}
                                              style={{ display: "flex", alignItems: "center", gap: "8px", padding: "6px 10px", cursor: "pointer",
                                                background: isSelected ? "rgba(59,130,246,0.15)" : "transparent",
                                                borderBottom: "1px solid rgba(255,255,255,0.04)",
                                                opacity: isMatch ? 1 : 0.45 }}>
                                              <div style={{ flex: 1, minWidth: 0 }}>
                                                <div style={{ fontSize: "11px", color: isSelected ? "var(--buy-accent)" : "var(--text)", fontFamily: "'Inter', sans-serif", fontWeight: isSelected ? "600" : "400", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{b.displayName}</div>
                                                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace" }}>{b.typeName} · {b.ageDisplay || `${b.age}yr`} · {b.proof}pf</div>

                                              <div style={{ fontSize: "10px", color: "var(--text-muted)", fontFamily: "monospace", whiteSpace: "nowrap" }}>
                                                ${(b.purchasePrice ?? 0).toLocaleString()}

                                              {isMatch && <div style={{ width: "4px", height: "4px", borderRadius: "50%", background: "var(--buy-accent)", flexShrink: 0 }} />}

                                    </div>
