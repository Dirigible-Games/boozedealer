                            color: currentCustomer.type === "seller" ? "#D4A017" : "#60A5FA",
                            border: `1px solid ${currentCustomer.type === "seller" ? "#8B451340" : "#3B82F640"}` }}>
                            {currentCustomer.type === "seller" ? "WANTS TO SELL" : "WANTS TO BUY"}
                          </div>
                        </div>

                        {/* --- SELLER INTERACTION --- */}
                        {currentCustomer.type === "seller" && (
                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px" }}>
                            <div style={{ fontSize: "14px", color: "#C4A882", fontStyle: "italic", textAlign: "center" }}>
                              "{currentCustomer.openLine}"
                            </div>
                            <BottleCard bottle={currentCustomer.bottle} showRarity={showRarity} yearEstimate={estimateYear(currentCustomer.bottle)} hideValue={true} />
                            {/* Codex price intel if known */}
                            {(() => {
                              const b = currentCustomer.bottle;
                              const modK = b.modifiers.length > 0 ? b.modifiers.sort().join(" ") + " " : "";
                              const vk = `${modK}${b.typeName}`;
                              const entry = codex[b.brandName]?.[vk];
                              const yearKey = b.yearKnown ? String(b.year) : "unknown";
                              const ph = entry?.priceHistory?.[yearKey];
                              if (!ph) return null;
                              return (
                                <div style={{ fontSize: "11px", fontFamily: "monospace", color: "#8B7355", padding: "6px 12px", background: "#1a151060", borderRadius: "6px", border: "1px solid #2a2218" }}>
                                  <span style={{ color: "#D4AF37" }}>CODEX:</span>{" "}
                                  {ph.minBuy != null && <span style={{ color: "#C0392B" }}>Bought: ${ph.minBuy.toLocaleString()}{ph.maxBuy !== ph.minBuy ? `–$${ph.maxBuy.toLocaleString()}` : ""}</span>}
                                  {ph.minBuy != null && ph.minSell != null && " · "}
                                  {ph.minSell != null && <span style={{ color: "#22C55E" }}>Sold: ${ph.minSell.toLocaleString()}{ph.maxSell !== ph.minSell ? `–$${ph.maxSell.toLocaleString()}` : ""}</span>}
                                </div>
                              );
                            })()}
                            {shelfFull && <div style={{ color: "#C0392B", fontSize: "13px", fontFamily: "monospace", padding: "8px 16px", background: "#C0392B15", borderRadius: "6px", border: "1px solid #C0392B30" }}>SHELF FULL — No room for more bottles. You can still pass.</div>}
                            {!shelfFull && cash < 5 && <div style={{ color: "#C0392B", fontSize: "13px", fontFamily: "monospace", padding: "8px 16px", background: "#C0392B15", borderRadius: "6px", border: "1px solid #C0392B30" }}>LOW FUNDS — Only ${cash.toLocaleString()} available.</div>}

                            {/* Question the Year button — only for unknown year bottles, usable once per customer */}
                            {!currentCustomer.bottle.yearKnown && !yearQuestioned && !negotiating && (
                              <button onClick={() => {
                                setYearQuestioned(true);
                                const c = currentCustomer;
                                const p = c.personality;
                                // Low-info/desperate sellers drop price; shrewd ones get offended
                                if (p.knowledge === "low" || p.id === "desperate") {
                                  const discount = 0.15 + Math.random() * 0.2; // 15-35% drop
                                  const newAsk = Math.max(Math.round(c.askingPrice * (1 - discount)), c.minAccept);
                                  const newMin = Math.max(Math.round(c.minAccept * (1 - discount * 0.5)), 1);
                                  setCurrentCustomer({ ...c, askingPrice: newAsk, minAccept: newMin,
                                    openLine: `"...I don't really know the year on this. I guess I could go a bit lower — how about $${newAsk.toLocaleString()}?"` });
                                } else if (p.knowledge === "medium") {
                                  const discount = Math.random() * 0.1; // 0-10% small drop
                                  const newAsk = Math.max(Math.round(c.askingPrice * (1 - discount)), c.minAccept);
                                  setCurrentCustomer({ ...c, askingPrice: newAsk,
                                    openLine: `"Yeah, I'm not sure of the exact year. I'd still want around $${newAsk.toLocaleString()} though."` });
                                } else {
                                  // High-info seller gets annoyed, might raise price
                                  const raise = 1 + Math.random() * 0.1;
                                  const newAsk = Math.round(c.askingPrice * raise);
                                  setCurrentCustomer({ ...c, askingPrice: newAsk,
                                    openLine: `"I know exactly what this is worth, year or no year. Actually, make it $${newAsk.toLocaleString()}."` });
                                }
                                audio.playSfx("buttonClick");
                              }}
                                style={{ padding: "8px 20px", background: "linear-gradient(145deg, #5B3A29, #3d2518)", border: "1px solid #8B735540", borderRadius: "6px", color: "#D4AF37", fontSize: "12px", cursor: "pointer", fontFamily: "monospace" }}>
                                "You don't know the year on this?"
                              </button>
                            )}
                            {yearQuestioned && !negotiating && (
                              <div style={{ fontSize: "13px", color: "#C4A882", fontStyle: "italic", textAlign: "center" }}>
                                "{currentCustomer.openLine}"
                              </div>
                            )}

                            {!negotiating && (
                              <div style={{ display: "flex", gap: "12px", flexWrap: "wrap", justifyContent: "center" }}>
                                {!shelfFull && (
                                  <>
                                    <button onClick={() => {
                                      // Accept their asking price immediately
                                      if (canAfford(currentCustomer.askingPrice)) {
                                        const boughtBottle = { ...currentCustomer.bottle, purchasePrice: currentCustomer.askingPrice };
                                        setCash(prev => prev - currentCustomer.askingPrice);
                                        setDailyLog(prev => [...prev, { type: "buy", desc: boughtBottle.displayName, amount: -currentCustomer.askingPrice }]);
                                        setInventory(p => [boughtBottle, ...p]);
                                        setReputation(prev => prev + (currentCustomer.askingPrice < currentCustomer.bottle.trueValue * 0.7 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
                                        trackPriceInCodex(boughtBottle, "buy", currentCustomer.askingPrice);
                                        audio.playSfx("buySuccess");
                                        advanceToNextCustomer();
                                      }
                                    }} disabled={!canAfford(currentCustomer.askingPrice)}
                                      style={{ padding: "12px 24px", background: canAfford(currentCustomer.askingPrice) ? "linear-gradient(145deg, #22C55E, #16A34A)" : "#3a3028", border: "none", borderRadius: "8px", color: canAfford(currentCustomer.askingPrice) ? "#fff" : "#8B7355", fontSize: "13px", fontWeight: "bold", cursor: canAfford(currentCustomer.askingPrice) ? "pointer" : "not-allowed", fontFamily: "monospace", opacity: canAfford(currentCustomer.askingPrice) ? 1 : 0.5 }}>
                                      ACCEPT ${currentCustomer.askingPrice.toLocaleString()}
                                    </button>
                                    <button onClick={() => startNegotiation(currentCustomer)}
                                      style={{ padding: "12px 24px", background: "linear-gradient(145deg, #D4AF37, #B8960C)", border: "none", borderRadius: "8px", color: "#1a1a1a", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                      NEGOTIATE
                                    </button>
                                  </>
                                )}
                                <button onClick={handlePass} style={{ padding: "12px 24px", background: "transparent", border: "2px solid #8B735566", borderRadius: "8px", color: "#8B7355", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>PASS</button>
                              </div>
                            )}

                            {/* Negotiation UI */}
                            {negotiating && (
                              <div style={{ width: "100%", maxWidth: "460px", background: "#1a1510", borderRadius: "12px", padding: "20px", border: "1px solid #3a3028" }}>
                                <div style={{ maxHeight: "140px", overflowY: "auto", marginBottom: "16px", display: "flex", flexDirection: "column", gap: "6px" }}>
                                  {negHistory.map((h, i) => (
                                    <div key={i} style={{ display: "flex", justifyContent: h.who === "player" ? "flex-end" : "flex-start" }}>
                                      <div style={{ padding: "6px 12px", borderRadius: "8px", maxWidth: "80%", fontSize: "12px", fontFamily: "monospace",
                                        background: h.who === "player" ? "#D4AF3720" : "#3a302840", color: h.who === "player" ? "#D4AF37" : "#C4A882" }}>

                                      </div>
                                    </div>
                                  ))}
                                </div>
                                <div style={{ fontSize: "10px", color: "#8B7355", fontFamily: "monospace", textAlign: "center", marginBottom: "8px" }}>
                                  Negotiation round {negRound + 1}

                                  <div style={{ textAlign: "center" }}>
                                    <div style={{ color: "#22C55E", fontSize: "16px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Deal Agreed!</div>
                                    {!canAfford(negHistory[negHistory.length-1]?.amount || 0) ? (
                                      <div style={{ color: "#C0392B", fontSize: "12px", fontFamily: "monospace", marginBottom: "8px" }}>You can't afford this! (${cash.toLocaleString()} available)</div>
                                    ) : (
                                      <button onClick={finalizeDeal} style={{ ...menuBtnStyle, padding: "10px 24px", fontSize: "13px", background: "linear-gradient(145deg, #22C55E, #16A34A)" }}>
                                        CONFIRM — Pay ${(negHistory[negHistory.length-1]?.amount || 0).toLocaleString()}
                                      </button>
                                    )}
                                  </div>
                                ) : negResult === "walked" ? (
                                  <div style={{ textAlign: "center" }}>
                                    <div style={{ color: "#C0392B", fontSize: "14px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Customer walked away.</div>
                                    <button onClick={walkAway} style={{ ...menuBtnStyle, padding: "10px 24px", fontSize: "13px", background: "linear-gradient(145deg, #3a3028, #2a2218)", color: "#D4AF37" }}>NEXT</button>
                                  </div>
                                ) : (
                                  <>
                                    <div style={{ marginBottom: "12px" }}>
                                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "#8B7355", fontFamily: "monospace", marginBottom: "4px" }}>
                                        <span>${Math.round(currentCustomer.askingPrice * 0.25).toLocaleString()}</span><span>Your offer: ${playerOffer.toLocaleString()}</span><span>${Math.round(currentCustomer.askingPrice * 1.5).toLocaleString()}</span>
                                      </div>
                                      <input type="range" min={Math.round(currentCustomer.askingPrice * 0.25)} max={Math.round(currentCustomer.askingPrice * 1.5)} step={1} value={playerOffer}
                                        onChange={e => setPlayerOffer(Number(e.target.value))}
                                        style={{ width: "100%", accentColor: "#D4AF37", cursor: "pointer" }} />
                                    </div>
                                    <div style={{ display: "flex", gap: "8px", justifyContent: "center", flexWrap: "wrap" }}>
                                      <button onClick={submitOffer}
                                        style={{ padding: "10px 24px", background: "linear-gradient(145deg, #D4AF37, #B8960C)", border: "none", borderRadius: "8px", color: "#1a1a1a", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                        OFFER ${playerOffer.toLocaleString()}
                                      </button>
                                      {negResult === "countered" && (
                                        <button onClick={acceptCounter}
                                          style={{ padding: "10px 24px", background: "linear-gradient(145deg, #22C55E, #16A34A)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                          ACCEPT ${customerOffer.toLocaleString()}
                                        </button>
                                      )}
                                      <button onClick={walkAway}
                                        style={{ padding: "10px 24px", background: "transparent", border: "2px solid #8B735566", borderRadius: "8px", color: "#8B7355", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                        WALK AWAY
                                      </button>
                                    </div>
                                  </>
                                )}
                              </div>
                            )}
                          </div>
                        )}

                        {/* --- BUYER INTERACTION --- */}
                        {currentCustomer.type === "buyer" && (
                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px" }}>
                            <div style={{ fontSize: "14px", color: "#C4A882", fontStyle: "italic", textAlign: "center" }}>
                              "{currentCustomer.openLine}"
                            </div>

                            {!negotiating && (
                              <>
                                <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>
                                  Select a bottle to offer this customer:
                                </div>
                                {(() => {
                                  const matching = inventory.filter(currentCustomer.filter);
                                  const allBottles = matching.length > 0 ? matching : inventory;
                                  if (allBottles.length === 0) return (
                                    <div style={{ color: "#5a4a38", fontSize: "13px", padding: "20px" }}>Your shelves are empty. Nothing to sell.</div>
                                  );
                                  return (
                                    <div style={{ width: "100%", maxHeight: "300px", overflowY: "auto", display: "flex", flexWrap: "wrap", gap: "10px", justifyContent: "center", padding: "8px 0" }}>
                                      {allBottles.map(b => {
                                        const isSelected = selectedSellBottle === b.id;
                                        const isMatch = currentCustomer.filter(b);
                                        return (
                                          <div key={b.id} onClick={() => setSelectedSellBottle(b.id)}
                                            style={{
                                              padding: "10px", borderRadius: "10px", cursor: "pointer", width: "200px",
                                              background: isSelected ? "#D4AF3715" : "linear-gradient(145deg, #2a2218, #1c1714)",
                                              border: isSelected ? "2px solid #D4AF37" : isMatch ? "1px solid #3a3028" : "1px dashed #3a302860",
                                              opacity: isMatch ? 1 : 0.5, transition: "all 0.2s",
                                            }}>
                                            <div style={{ fontSize: "12px", color: "#F5E6CA", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "4px", lineHeight: 1.3 }}>{b.displayName}</div>
                                            <div style={{ fontSize: "10px", color: "#8B7355", fontFamily: "monospace" }}>{b.typeName} · {b.ageDisplay || `${b.age}yr`} · {b.proof}pf</div>
                                            <div style={{ fontSize: "13px", color: "#C4A882", fontFamily: "monospace", fontWeight: "bold", marginTop: "4px" }}>{b.purchasePrice != null ? `Paid: $${b.purchasePrice.toLocaleString()}` : ""}</div>
                                            {!isMatch && <div style={{ fontSize: "9px", color: "#8B735580", fontFamily: "monospace", marginTop: "2px" }}>Not what they asked for</div>}
                                          </div>
                                        );
                                      })}
                                    </div>
                                  );
                                })()}
                                <div style={{ display: "flex", gap: "12px", flexWrap: "wrap", justifyContent: "center" }}>
                                  {selectedSellBottle && (
                                    <>
                                      <button onClick={() => {
                                        // Accept their opening offer immediately
                                        const bottle = inventory.find(b => b.id === selectedSellBottle);
                                        if (!bottle) return;
                                        const salePrice = currentCustomer.openingOffer;
                                        setCash(prev => prev + salePrice);
                                        setDailyLog(prev => [...prev, { type: "sell", desc: bottle.displayName, amount: salePrice }]);
                                        setInventory(p => p.filter(b => b.id !== selectedSellBottle));
                                        setReputation(prev => prev + (salePrice > (bottle.purchasePrice || 0) * 1.3 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
                                        trackPriceInCodex(bottle, "sell", salePrice);
                                        trackBottleInCodex(bottle);
                                        setSelectedSellBottle(null);
                                        audio.playSfx("sellSuccess");
                                        advanceToNextCustomer();
                                      }}
                                        style={{ padding: "12px 24px", background: "linear-gradient(145deg, #22C55E, #16A34A)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                        ACCEPT ${currentCustomer.openingOffer.toLocaleString()}
                                      </button>
                                      <button onClick={() => startNegotiation(currentCustomer)}
                                        style={{ padding: "12px 24px", background: "linear-gradient(145deg, #3B82F6, #2563EB)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                        NEGOTIATE
                                      </button>
                                    </>
                                  )}
                                  <button onClick={handlePass} style={{ padding: "12px 24px", background: "transparent", border: "2px solid #8B735566", borderRadius: "8px", color: "#8B7355", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>PASS</button>
                                </div>
                              </>
                            )}

                            {/* Negotiation UI for selling */}
                            {negotiating && (() => {
                              const bottle = inventory.find(b => b.id === selectedSellBottle);
                              if (!bottle) return null;
                              const sliderMin = Math.round(currentCustomer.openingOffer * 0.25);
                              const sliderMax = Math.round(currentCustomer.openingOffer * 1.5);
                              return (
                                <div style={{ width: "100%", maxWidth: "460px" }}>
                                  <div style={{ background: "#2a221840", borderRadius: "8px", padding: "10px", marginBottom: "12px", textAlign: "center" }}>
                                    <div style={{ fontSize: "13px", color: "#F5E6CA", fontFamily: "'Playfair Display', Georgia, serif" }}>{bottle.displayName}</div>
                                    <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>Paid: ${(bottle.purchasePrice ?? 0).toLocaleString()}</div>
                                  </div>

                                  <div style={{ background: "#1a1510", borderRadius: "12px", padding: "20px", border: "1px solid #3a3028" }}>
                                    <div style={{ maxHeight: "140px", overflowY: "auto", marginBottom: "16px", display: "flex", flexDirection: "column", gap: "6px" }}>
                                      {negHistory.map((h, i) => (
                                        <div key={i} style={{ display: "flex", justifyContent: h.who === "player" ? "flex-end" : "flex-start" }}>
                                          <div style={{ padding: "6px 12px", borderRadius: "8px", maxWidth: "80%", fontSize: "12px", fontFamily: "monospace",
                                            background: h.who === "player" ? "#3B82F620" : "#3a302840", color: h.who === "player" ? "#60A5FA" : "#C4A882" }}>
                                            {h.text}
                                          </div>
                                        </div>
                                      ))}
                                    </div>

                                    <div style={{ fontSize: "10px", color: "#8B7355", fontFamily: "monospace", textAlign: "center", marginBottom: "8px" }}>
                                      Negotiation round {negRound + 1}
                                    </div>

                                    {negResult === "accepted" ? (
                                      <div style={{ textAlign: "center" }}>
                                        <div style={{ color: "#22C55E", fontSize: "16px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Deal Agreed!</div>
                                        <button onClick={finalizeDeal} style={{ ...menuBtnStyle, padding: "10px 24px", fontSize: "13px", background: "linear-gradient(145deg, #3B82F6, #2563EB)" }}>
                                          CONFIRM SALE — ${(negHistory[negHistory.length-1]?.amount || 0).toLocaleString()}
                                        </button>
                                      </div>
                                    ) : negResult === "walked" ? (
                                      <div style={{ textAlign: "center" }}>
                                        <div style={{ color: "#C0392B", fontSize: "14px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Customer walked away.</div>
                                        <button onClick={walkAway} style={{ ...menuBtnStyle, padding: "10px 24px", fontSize: "13px", background: "linear-gradient(145deg, #3a3028, #2a2218)", color: "#D4AF37" }}>NEXT</button>
                                      </div>
                                    ) : (
                                      <>
                                        <div style={{ marginBottom: "12px" }}>
                                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "#8B7355", fontFamily: "monospace", marginBottom: "4px" }}>
                                            <span>${sliderMin.toLocaleString()}</span><span>Your asking price: ${playerOffer.toLocaleString()}</span><span>${sliderMax.toLocaleString()}</span>
                                          </div>
                                          <input type="range" min={sliderMin} max={sliderMax} step={1} value={playerOffer}
                                            onChange={e => setPlayerOffer(Number(e.target.value))}
                                            style={{ width: "100%", accentColor: "#3B82F6", cursor: "pointer" }} />
                                        </div>
                                        <div style={{ display: "flex", gap: "8px", justifyContent: "center", flexWrap: "wrap" }}>
                                          <button onClick={submitOffer}
                                            style={{ padding: "10px 24px", background: "linear-gradient(145deg, #3B82F6, #2563EB)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                            ASK ${playerOffer.toLocaleString()}
                                          </button>
                                          {negResult === "countered" && (
                                            <button onClick={acceptCounter}
                                              style={{ padding: "10px 24px", background: "linear-gradient(145deg, #22C55E, #16A34A)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                              ACCEPT ${customerOffer.toLocaleString()}
                                            </button>
                                          )}
                                          <button onClick={walkAway}
                                            style={{ padding: "10px 24px", background: "transparent", border: "2px solid #8B735566", borderRadius: "8px", color: "#8B7355", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                            WALK AWAY
                                          </button>
                                        </div>
                                      </>
                                    )}
                                  </div>
                                </div>
                              );
                            })()}
                          </div>
                        )}
                      </div>
                    ) : (
                      /* All customers served */
                      <div style={{ textAlign: "center", padding: "40px 20px" }}>
                        <div style={{ fontSize: "16px", color: "#D4AF37", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "8px" }}>
                          All customers served for today.
                        </div>
                        <p style={{ color: "#8B7355", fontSize: "13px", marginBottom: "20px" }}>
                          {customerQueue.length} customer{customerQueue.length !== 1 ? "s" : ""} visited today.
                        </p>
                        <button onClick={handleEndDay} style={menuBtnStyle}
                          onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 20px rgba(212,175,55,0.5)"; }}
                          onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 12px rgba(212,175,55,0.3)"; }}>
                          END DAY {day}
                        </button>
                      </div>
                    )}
                  </>
                )}
              </div>
            )}
            {activeTab === "inventory" && (
              <div>
                <div style={{ display: "flex", gap: "12px", marginBottom: "20px", flexWrap: "wrap", alignItems: "center" }}>
                  <span style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>FILTER</span>
                  {["All", ...Object.keys(WHISKEY_TYPES)].map(t => (
                    <button key={t} onClick={() => setFilterType(t)} style={{ padding: "6px 14px", border: filterType === t ? "1px solid #D4AF37" : "1px solid #3a3028", borderRadius: "6px", background: filterType === t ? "#D4AF3720" : "transparent", color: filterType === t ? "#D4AF37" : "#8B7355", fontSize: "12px", cursor: "pointer", fontFamily: "monospace" }}>{t}</button>
                  ))}
                  <span style={{ marginLeft: "auto", fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>SORT</span>
                  {[["newest","Newest"],["value","Value"],["age","Age"],["proof","Proof"],["rarity","Rarity"]].map(([k, l]) => (
                    <button key={k} onClick={() => setSortBy(k)} style={{ padding: "6px 14px", border: sortBy === k ? "1px solid #D4AF37" : "1px solid #3a3028", borderRadius: "6px", background: sortBy === k ? "#D4AF3720" : "transparent", color: sortBy === k ? "#D4AF37" : "#8B7355", fontSize: "12px", cursor: "pointer", fontFamily: "monospace" }}>{l}</button>
                  ))}
                </div>
                {filteredInventory.length === 0
                  ? <div style={{ textAlign: "center", padding: "60px 20px", color: "#5a4a38", fontSize: "14px" }}>{inventory.length === 0 ? "Your shelves are empty. Head to the shop to buy some bottles." : "No bottles match this filter."}</div>
                  : <div style={{ display: "flex", flexWrap: "wrap", gap: "16px", justifyContent: "center" }}>{filteredInventory.map(b => <BottleCard key={b.id} bottle={b} showRarity={showRarity} yearEstimate={estimateYear(b)} purchasePrice={b.purchasePrice} />)}</div>
                }
              </div>
            )}
            {activeTab === "skills" && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "20px", padding: "20px 0" }}>
                <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "#D4AF37", fontSize: "22px", margin: 0 }}>Tools & Skills</h2>
                <p style={{ color: "#8B7355", fontSize: "12px", fontFamily: "monospace", textAlign: "center", maxWidth: "450px" }}>
                  Invest in your expertise. Better tools mean better deals.
                </p>
                {/* Skill: Year Estimation */}
                {(() => {
                  const SkillRow = ({ skillKey, label, desc, accuracyFn }) => {
                    const level = playerSkills[skillKey];
                    const nextLevel = level + 1;
                    const maxed = level >= 5;
                    const cost = maxed ? 0 : SKILL_COSTS[nextLevel];
                    const canBuy = !maxed && cash >= cost;
                    return (
                      <div style={{ background: "linear-gradient(145deg, #1c1714, #261f18)", borderRadius: "12px", padding: "16px", border: "1px solid #3a3028", width: "100%", maxWidth: "500px" }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "12px" }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: "14px", color: "#F5E6CA", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "4px" }}>{label}</div>
                            <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>
                              {maxed ? `MASTER — ${desc.master}` : level === 0 ? `Not unlocked — ${desc.none}` : `${SKILL_TIERS_LABEL[level]} — ${accuracyFn(level)}`}
                            </div>
                            {!maxed && (
                              <div style={{ fontSize: "10px", color: "#8B735580", fontFamily: "monospace", marginTop: "4px" }}>
                                Next: {SKILL_TIERS_LABEL[nextLevel]} ({accuracyFn(nextLevel)})
                              </div>
                            )}
                          </div>
                          <div style={{ display: "flex", gap: "3px", marginRight: "8px" }}>
                            {[1,2,3,4,5].map(pip => (
                              <div key={pip} style={{ width: "8px", height: "20px", borderRadius: "2px", background: pip <= level ? "#D4AF37" : "#3a3028", border: "1px solid #3a3028" }} />
                            ))}
                          </div>
                          {!maxed && (
                            <button onClick={() => {
                              if (canBuy) { setCash(prev => prev - cost); setPlayerSkills(prev => ({ ...prev, [skillKey]: nextLevel })); audio.playSfx("storeUpgrade"); }
                            }} disabled={!canBuy}
                              style={{ padding: "8px 16px", background: canBuy ? "linear-gradient(145deg, #D4AF37, #B8960C)" : "#3a3028", border: "none", borderRadius: "6px", color: canBuy ? "#1a1a1a" : "#8B7355", fontSize: "12px", fontWeight: "bold", cursor: canBuy ? "pointer" : "not-allowed", fontFamily: "monospace", opacity: canBuy ? 1 : 0.5, whiteSpace: "nowrap" }}>
                              ${cost.toLocaleString()}
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  };
                  return (
                    <>
                      <SkillRow skillKey="yearEstimation" label="Year Estimation"
                        desc={{ none: "Cannot estimate release years", master: "Exact year identification" }}
                        accuracyFn={(lv) => YEAR_EST_ACCURACY[lv] === 0 ? "Exact" : `±${YEAR_EST_ACCURACY[lv]} year accuracy`} />
                      <SkillRow skillKey="industryKnowledge" label="Industry Knowledge"
                        desc={{ none: "No insight into brand catalogs", master: "Complete brand catalog access" }}
                        accuracyFn={(lv) => ["", "Basic brand awareness", "Common release info", "Detailed catalogs", "Expert-level archives", "Complete mastery"][lv]} />
                    </>
                  );
                })()}
              </div>
            )}
            {activeTab === "codex" && (
              <div>
                <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "#D4AF37", fontSize: "22px", margin: "0 0 8px 0", textAlign: "center" }}>Codex</h2>
                <p style={{ color: "#8B7355", fontSize: "12px", fontFamily: "monospace", textAlign: "center", marginBottom: "20px" }}>
                  Your personal reference of every bottle you've encountered. Knowledge is power.
                </p>
                {Object.keys(codex).length === 0 ? (
                  <div style={{ textAlign: "center", padding: "60px 20px", color: "#5a4a38", fontSize: "14px" }}>
                    No bottles encountered yet. Start trading to fill your codex.
                  </div>
                ) : (() => {
                  const [expandedBrand, setExpandedBrandLocal] = [codexExpandedBrand, setCodexExpandedBrand];
                  const [expandedVariant, setExpandedVariantLocal] = [codexExpandedVariant, setCodexExpandedVariant];
                  const brands = Object.keys(codex).sort();
                  return (
                    <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                      {brands.map(brand => {
                        const variants = codex[brand];
                        const variantKeys = Object.keys(variants).sort();
                        const isExpanded = expandedBrand === brand;
                        return (
                          <div key={brand}>
                            <button onClick={() => setExpandedBrandLocal(isExpanded ? null : brand)}
                              style={{ width: "100%", padding: "12px 16px", background: isExpanded ? "#2a221840" : "#1a1510", border: isExpanded ? "1px solid #D4AF37" : "1px solid #2a2218", borderRadius: isExpanded ? "8px 8px 0 0" : "8px", cursor: "pointer", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                              <span style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "#F5E6CA", fontSize: "15px" }}>{brand}</span>
                              <span style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>{variantKeys.length} variant{variantKeys.length !== 1 ? "s" : ""}</span>
                            </button>
                            {isExpanded && (
                              <div style={{ background: "#1a151080", border: "1px solid #2a2218", borderTop: "none", borderRadius: "0 0 8px 8px", padding: "8px" }}>
                                {variantKeys.map(vk => {
                                  const v = variants[vk];
                                  const isVarExpanded = expandedVariant === `${brand}|${vk}`;
                                  return (
                                    <div key={vk} style={{ marginBottom: "4px" }}>
                                      <button onClick={() => setExpandedVariantLocal(isVarExpanded ? null : `${brand}|${vk}`)}
                                        style={{ width: "100%", padding: "8px 12px", background: isVarExpanded ? "#D4AF3710" : "transparent", border: isVarExpanded ? "1px solid #D4AF3740" : "1px solid #2a221840", borderRadius: "6px", cursor: "pointer", textAlign: "left" }}>
                                        <span style={{ fontSize: "13px", color: "#C4A882", fontFamily: "monospace" }}>{v.variantKey}</span>
                                        <span style={{ fontSize: "10px", color: "#8B7355", marginLeft: "8px" }}>({v.encounters}x seen)</span>
                                      </button>
                                      {isVarExpanded && (
                                        <div style={{ padding: "12px", background: "#120e0a", borderRadius: "0 0 6px 6px", margin: "0 4px", border: "1px solid #2a221840", borderTop: "none" }}>
                                          <div style={{ display: "flex", gap: "16px", alignItems: "flex-start" }}>
                                            <BottleSVG bottle={v} size={100} />
                                            <div style={{ flex: 1 }}>
                                              <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "14px", color: "#F5E6CA", marginBottom: "8px" }}>{v.displayName}</div>
                                              <div style={{ fontSize: "11px", color: "#C4A882", fontFamily: "monospace", display: "flex", flexDirection: "column", gap: "4px" }}>
                                                <div><span style={{ color: "#8B7355" }}>REGION</span> {v.region}</div>
                                                <div><span style={{ color: "#8B7355" }}>RELEASE YEARS</span> {v.minYear && v.maxYear ? (v.minYear === v.maxYear ? `?–${v.maxYear}` : `${v.minYear}–${v.maxYear}`) : "Unknown"}</div>
                                                <div><span style={{ color: "#8B7355" }}>PROOF</span> {v.lastProof}</div>
                                                <div><span style={{ color: "#8B7355" }}>AGE</span> {v.lastAge >= 3 && v.lastAge <= 6 ? "Unstated" : `${v.lastAge}yr`}</div>
                                                <div style={{ marginTop: "4px" }}>
                                                  <span style={{ color: "#8B7355" }}>MASHBILL</span>
                                                  <div style={{ display: "flex", gap: "8px", marginTop: "2px", flexWrap: "wrap" }}>
                                                    {Object.entries(v.lastMashbill || {}).filter(([,val]) => val > 0).sort(([,a],[,b]) => b - a).map(([grain, pct]) => {
                                                      const gc = { Corn: "#D4A017", Rye: "#A0522D", Barley: "#DAA520", Wheat: "#DEB887" };
                                                      return <span key={grain} style={{ color: gc[grain] || "#888" }}>{grain} {pct}%</span>;
                                                    })}
                                                  </div>
                                                </div>
                                                {v.modifiers.length > 0 && (
                                                  <div style={{ marginTop: "4px", display: "flex", gap: "4px", flexWrap: "wrap" }}>
                                                    {v.modifiers.map((m, mi) => <span key={mi} style={tagStyle("#5B3A29")}>{m}</span>)}
                                                  </div>
                                                )}
                                                {/* Price History */}
                                                {v.priceHistory && Object.keys(v.priceHistory).length > 0 && (
                                                  <div style={{ marginTop: "10px", borderTop: "1px solid #2a2218", paddingTop: "8px" }}>
                                                    <div style={{ color: "#8B7355", fontSize: "10px", letterSpacing: "1px", marginBottom: "6px" }}>DEAL HISTORY</div>
                                                    {Object.entries(v.priceHistory).sort(([a],[b]) => a === "unknown" ? 1 : b === "unknown" ? -1 : Number(a) - Number(b)).map(([yearKey, ph]) => (
                                                      <div key={yearKey} style={{ display: "flex", flexWrap: "wrap", gap: "8px", alignItems: "center", padding: "4px 0", borderBottom: "1px solid #2a221830" }}>
                                                        <span style={{ color: "#F5E6CA", minWidth: "60px" }}>{yearKey === "unknown" ? "Unknown Yr" : yearKey}</span>
                                                        {(ph.minBuy != null || ph.maxBuy != null) && (
                                                          <span style={{ color: "#C0392B" }}>
                                                            Buy: ${ph.minBuy?.toLocaleString() ?? "?"}{ph.maxBuy != null && ph.maxBuy !== ph.minBuy ? `–$${ph.maxBuy.toLocaleString()}` : ""}
                                                          </span>
                                                        )}
                                                        {(ph.minSell != null || ph.maxSell != null) && (
                                                          <span style={{ color: "#22C55E" }}>
                                                            Sell: ${ph.minSell?.toLocaleString() ?? "?"}{ph.maxSell != null && ph.maxSell !== ph.minSell ? `–$${ph.maxSell.toLocaleString()}` : ""}
                                                          </span>
                                                        )}
                                                      </div>
                                                    ))}
                                                  </div>
                                                )}
                                              </div>
                                            </div>
                                          </div>
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
              </div>
            )}
          </div>
        </>
      )}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap');
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes titlePulse { 0%, 100% { text-shadow: 0 0 30px rgba(212,175,55,0.3), 0 2px 4px rgba(0,0,0,0.5); } 50% { text-shadow: 0 0 50px rgba(212,175,55,0.5), 0 2px 4px rgba(0,0,0,0.5); } }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1a1510; } ::-webkit-scrollbar-thumb { background: #3a3028; border-radius: 3px; }
        * { box-sizing: border-box; } input::placeholder { color: #5a4a38; }
      `}</style>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(WhiskeyGame));
  </script></body></html>
