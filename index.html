                                      <div style={{ color: "#C0392B", fontSize: "12px", fontFamily: "monospace", marginBottom: "8px" }}>You can't afford this! (${cash.toLocaleString()} available)</div>
                                    ) : (
                                      <button onClick={finalizeDeal} style={{ ...menuBtnStyle, padding: "10px 24px", fontSize: "13px", background: "linear-gradient(145deg, #22C55E, #16A34A)" }}>
                                        CONFIRM — Pay ${(negHistory[negHistory.length-1]?.amount || 0).toLocaleString()}
                                      </button>
                                    )}
                                  </div>
                                ) : negResult === "walked" ? (
                                  <div style={{ textAlign: "center" }}>
                                    <div style={{ color: "#C0392B", fontSize: "14px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Customer walked away.</div>
                                    <button onClick={walkAway} style={{ ...menuBtnStyle, padding: "10px 24px", fontSize: "13px", background: "linear-gradient(145deg, #3a3028, #2a2218)", color: "#D4AF37" }}>NEXT</button>
                                  </div>
                                ) : (
                                  <>
                                    {/* Slider */}
                                    <div style={{ marginBottom: "12px" }}>
                                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "#8B7355", fontFamily: "monospace", marginBottom: "4px" }}>
                                        <span>$0</span><span>Your offer: ${playerOffer.toLocaleString()}</span><span>${Math.round(currentCustomer.askingPrice * 1.3).toLocaleString()}</span>
                                      </div>
                                      <input type="range" min={0} max={Math.round(currentCustomer.askingPrice * 1.3)} step={5} value={playerOffer}
                                        onChange={e => setPlayerOffer(Number(e.target.value))}
                                        style={{ width: "100%", accentColor: "#D4AF37", cursor: "pointer" }} />
                                    </div>
                                    <div style={{ display: "flex", gap: "8px", justifyContent: "center" }}>
                                      <button onClick={submitOffer}
                                        style={{ padding: "10px 24px", background: "linear-gradient(145deg, #D4AF37, #B8960C)", border: "none", borderRadius: "8px", color: "#1a1a1a", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                        OFFER ${playerOffer.toLocaleString()}
                                      </button>
                                      {negResult === "countered" && (
                                        <button onClick={acceptCounter}
                                          style={{ padding: "10px 24px", background: "linear-gradient(145deg, #22C55E, #16A34A)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                          ACCEPT ${customerOffer.toLocaleString()}
                                        </button>
                                      )}
                                      <button onClick={walkAway}
                                        style={{ padding: "10px 24px", background: "transparent", border: "2px solid #8B735566", borderRadius: "8px", color: "#8B7355", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                        WALK AWAY
                                      </button>
                                    </div>
                                  </>
                                )}
                              </div>
                            )}
                          </div>
                        )}

                        {/* --- BUYER INTERACTION --- */}
                        {currentCustomer.type === "buyer" && (
                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px" }}>
                            <div style={{ fontSize: "14px", color: "#C4A882", fontStyle: "italic", textAlign: "center" }}>
                              "{currentCustomer.openLine}"
                            </div>

                            {!negotiating && (
                              <>
                                <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>
                                  Select a bottle to offer this customer:
                                </div>
                                {(() => {
                                  const matching = inventory.filter(currentCustomer.filter);
                                  const allBottles = matching.length > 0 ? matching : inventory;
                                  if (allBottles.length === 0) return (
                                    <div style={{ color: "#5a4a38", fontSize: "13px", padding: "20px" }}>Your shelves are empty. Nothing to sell.</div>
                                  );
                                  return (
                                    <div style={{ width: "100%", maxHeight: "300px", overflowY: "auto", display: "flex", flexWrap: "wrap", gap: "10px", justifyContent: "center", padding: "8px 0" }}>
                                      {allBottles.map(b => {
                                        const isSelected = selectedSellBottle === b.id;
                                        const isMatch = currentCustomer.filter(b);
                                        return (
                                          <div key={b.id} onClick={() => setSelectedSellBottle(b.id)}
                                            style={{
                                              padding: "10px", borderRadius: "10px", cursor: "pointer", width: "200px",
                                              background: isSelected ? "#D4AF3715" : "linear-gradient(145deg, #2a2218, #1c1714)",
                                              border: isSelected ? "2px solid #D4AF37" : isMatch ? "1px solid #3a3028" : "1px dashed #3a302860",
                                              opacity: isMatch ? 1 : 0.5, transition: "all 0.2s",
                                            }}>
                                            <div style={{ fontSize: "12px", color: "#F5E6CA", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "4px", lineHeight: 1.3 }}>{b.displayName}</div>
                                            <div style={{ fontSize: "10px", color: "#8B7355", fontFamily: "monospace" }}>{b.typeName} · {b.age}yr · {b.proof}pf</div>
                                            <div style={{ fontSize: "13px", color: "#D4AF37", fontFamily: "monospace", fontWeight: "bold", marginTop: "4px" }}>${b.value.toLocaleString()}</div>
                                            {!isMatch && <div style={{ fontSize: "9px", color: "#8B735580", fontFamily: "monospace", marginTop: "2px" }}>Not what they asked for</div>}
                                          </div>
                                        );
                                      })}
                                    </div>
                                  );
                                })()}
                                <div style={{ display: "flex", gap: "12px" }}>
                                  <button onClick={() => { if (selectedSellBottle) startNegotiation(currentCustomer); }} disabled={!selectedSellBottle}
                                    style={{ padding: "12px 32px", background: selectedSellBottle ? "linear-gradient(145deg, #3B82F6, #2563EB)" : "#3a3028", border: "none", borderRadius: "8px", color: selectedSellBottle ? "#fff" : "#8B7355", fontSize: "14px", fontWeight: "bold", cursor: selectedSellBottle ? "pointer" : "not-allowed", fontFamily: "monospace", letterSpacing: "1px", opacity: selectedSellBottle ? 1 : 0.5 }}>
                                    {selectedSellBottle ? "NEGOTIATE" : "SELECT A BOTTLE"}
                                  </button>
                                  <button onClick={handlePass} style={{ padding: "12px 32px", background: "transparent", border: "2px solid #8B735566", borderRadius: "8px", color: "#8B7355", fontSize: "14px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace", letterSpacing: "1px" }}>PASS</button>
                                </div>
                              </>
                            )}

                            {/* Negotiation UI for selling */}
                            {negotiating && (() => {
                              const bottle = inventory.find(b => b.id === selectedSellBottle);
                              if (!bottle) return null;
                              const maxSlider = Math.round(bottle.value * 2);
                              return (
                                <div style={{ width: "100%", maxWidth: "460px" }}>
                                  {/* Show the bottle being negotiated */}
                                  <div style={{ background: "#2a221840", borderRadius: "8px", padding: "10px", marginBottom: "12px", textAlign: "center" }}>
                                    <div style={{ fontSize: "13px", color: "#F5E6CA", fontFamily: "'Playfair Display', Georgia, serif" }}>{bottle.displayName}</div>
                                    <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>Value: ${bottle.value.toLocaleString()}</div>
                                  </div>

                                  <div style={{ background: "#1a1510", borderRadius: "12px", padding: "20px", border: "1px solid #3a3028" }}>
                                    {/* Chat history */}
                                    <div style={{ maxHeight: "140px", overflowY: "auto", marginBottom: "16px", display: "flex", flexDirection: "column", gap: "6px" }}>
                                      {negHistory.map((h, i) => (
                                        <div key={i} style={{ display: "flex", justifyContent: h.who === "player" ? "flex-end" : "flex-start" }}>
                                          <div style={{ padding: "6px 12px", borderRadius: "8px", maxWidth: "80%", fontSize: "12px", fontFamily: "monospace",
                                            background: h.who === "player" ? "#3B82F620" : "#3a302840", color: h.who === "player" ? "#60A5FA" : "#C4A882" }}>
                                            {h.text}
                                          </div>
                                        </div>
                                      ))}
                                    </div>

                                    <div style={{ fontSize: "10px", color: "#8B7355", fontFamily: "monospace", textAlign: "center", marginBottom: "8px" }}>
                                      Round {negRound + 1}/{currentCustomer.personality.maxRounds} · {currentCustomer.personality.icon} {currentCustomer.personality.name}
                                    </div>

                                    {negResult === "accepted" ? (
                                      <div style={{ textAlign: "center" }}>
                                        <div style={{ color: "#22C55E", fontSize: "16px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Deal Agreed!</div>
                                        <button onClick={finalizeDeal} style={{ ...menuBtnStyle, padding: "10px 24px", fontSize: "13px", background: "linear-gradient(145deg, #3B82F6, #2563EB)" }}>
                                          CONFIRM SALE — ${(negHistory[negHistory.length-1]?.amount || 0).toLocaleString()}
                                        </button>
                                      </div>
                                    ) : negResult === "walked" ? (
                                      <div style={{ textAlign: "center" }}>
                                        <div style={{ color: "#C0392B", fontSize: "14px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Customer walked away.</div>
                                        <button onClick={walkAway} style={{ ...menuBtnStyle, padding: "10px 24px", fontSize: "13px", background: "linear-gradient(145deg, #3a3028, #2a2218)", color: "#D4AF37" }}>NEXT</button>
                                      </div>
                                    ) : (
                                      <>
                                        <div style={{ marginBottom: "12px" }}>
                                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "#8B7355", fontFamily: "monospace", marginBottom: "4px" }}>
                                            <span>$0</span><span>Your asking price: ${playerOffer.toLocaleString()}</span><span>${maxSlider.toLocaleString()}</span>
                                          </div>
                                          <input type="range" min={0} max={maxSlider} step={5} value={playerOffer}
                                            onChange={e => setPlayerOffer(Number(e.target.value))}
                                            style={{ width: "100%", accentColor: "#3B82F6", cursor: "pointer" }} />
                                        </div>
                                        <div style={{ display: "flex", gap: "8px", justifyContent: "center", flexWrap: "wrap" }}>
                                          <button onClick={submitOffer}
                                            style={{ padding: "10px 24px", background: "linear-gradient(145deg, #3B82F6, #2563EB)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                            ASK ${playerOffer.toLocaleString()}
                                          </button>
                                          {negResult === "countered" && (
                                            <button onClick={acceptCounter}
                                              style={{ padding: "10px 24px", background: "linear-gradient(145deg, #22C55E, #16A34A)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                              ACCEPT ${customerOffer.toLocaleString()}
                                            </button>
                                          )}
                                          <button onClick={walkAway}
                                            style={{ padding: "10px 24px", background: "transparent", border: "2px solid #8B735566", borderRadius: "8px", color: "#8B7355", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                            WALK AWAY
                                          </button>
                                        </div>
                                      </>
                                    )}
                                  </div>
                                </div>
                              );
                            })()}
                          </div>
                        )}
                      </div>
                    ) : (
                      /* All customers served */
                      <div style={{ textAlign: "center", padding: "40px 20px" }}>
                        <div style={{ fontSize: "16px", color: "#D4AF37", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "8px" }}>
                          All customers served for today.
                        </div>
                        <p style={{ color: "#8B7355", fontSize: "13px", marginBottom: "20px" }}>
                          {customerQueue.length} customer{customerQueue.length !== 1 ? "s" : ""} visited today.
                        </p>
                        <button onClick={handleEndDay} style={menuBtnStyle}
                          onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 20px rgba(212,175,55,0.5)"; }}
                          onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 12px rgba(212,175,55,0.3)"; }}>
                          END DAY {day}
                        </button>
                      </div>
                    )}
                  </>
                )}
              </div>
            )}
            {activeTab === "inventory" && (
              <div>
                <div style={{ display: "flex", gap: "12px", marginBottom: "20px", flexWrap: "wrap", alignItems: "center" }}>
                  <span style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>FILTER</span>
                  {["All", ...Object.keys(WHISKEY_TYPES)].map(t => (
                    <button key={t} onClick={() => setFilterType(t)} style={{ padding: "6px 14px", border: filterType === t ? "1px solid #D4AF37" : "1px solid #3a3028", borderRadius: "6px", background: filterType === t ? "#D4AF3720" : "transparent", color: filterType === t ? "#D4AF37" : "#8B7355", fontSize: "12px", cursor: "pointer", fontFamily: "monospace" }}>{t}</button>
                  ))}
                  <span style={{ marginLeft: "auto", fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>SORT</span>
                  {[["newest","Newest"],["value","Value"],["age","Age"],["proof","Proof"],["rarity","Rarity"]].map(([k, l]) => (
                    <button key={k} onClick={() => setSortBy(k)} style={{ padding: "6px 14px", border: sortBy === k ? "1px solid #D4AF37" : "1px solid #3a3028", borderRadius: "6px", background: sortBy === k ? "#D4AF3720" : "transparent", color: sortBy === k ? "#D4AF37" : "#8B7355", fontSize: "12px", cursor: "pointer", fontFamily: "monospace" }}>{l}</button>
                  ))}
                </div>
                {filteredInventory.length === 0
                  ? <div style={{ textAlign: "center", padding: "60px 20px", color: "#5a4a38", fontSize: "14px" }}>{inventory.length === 0 ? "Your shelves are empty. Head to the shop to buy some bottles." : "No bottles match this filter."}</div>
                  : <div style={{ display: "flex", flexWrap: "wrap", gap: "16px", justifyContent: "center" }}>{filteredInventory.map(b => <BottleCard key={b.id} bottle={b} showRarity={showRarity} />)}</div>
                }
              </div>
            )}
            {activeTab === "brands" && <BrandPanel engine={engine} />}
          </div>
        </>
      )}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap');
        @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes titlePulse { 0%, 100% { text-shadow: 0 0 30px rgba(212,175,55,0.3), 0 2px 4px rgba(0,0,0,0.5); } 50% { text-shadow: 0 0 50px rgba(212,175,55,0.5), 0 2px 4px rgba(0,0,0,0.5); } }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1a1510; } ::-webkit-scrollbar-thumb { background: #3a3028; border-radius: 3px; }
        * { box-sizing: border-box; } input::placeholder { color: #5a4a38; }
      `}</style>
    </div>
  );
}
// Mount the app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(WhiskeyGame));
  </script>
</body>
</html>
