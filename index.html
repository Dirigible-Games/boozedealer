function generateBrandName(rng, region) {
  const naming = REGIONAL_NAMES[region] || REGIONAL_NAMES.American;
  const patterns = Object.entries(naming);
  const totalWeight = patterns.reduce((s, [,p]) => s + p.weight, 0);
  let roll = rng() * totalWeight;
  let patternKey = patterns[0][0], pattern = patterns[0][1];
  for (const [key, p] of patterns) { roll -= p.weight; if (roll <= 0) { patternKey = key; pattern = p; break; } }

  if (patternKey === "person") {
    const first = pattern.firsts[Math.floor(rng() * pattern.firsts.length)];
    const pool = rng() < 0.75 ? pattern.lasts : pattern.suffixes;
    return `${first} ${pool[Math.floor(rng() * pool.length)]}`;
  } else if (patternKey === "titled") {
    return `${pattern.titles[Math.floor(rng() * pattern.titles.length)]} ${pattern.lasts[Math.floor(rng() * pattern.lasts.length)]}`;
  } else if (patternKey === "animal") {
    return `${pattern.animals[Math.floor(rng() * pattern.animals.length)]} ${pattern.suffixes[Math.floor(rng() * pattern.suffixes.length)]}`;
  } else if (patternKey === "character") {
    return `${pattern.traits[Math.floor(rng() * pattern.traits.length)]} ${pattern.suffixes[Math.floor(rng() * pattern.suffixes.length)]}`;
  } else {
    return `${pattern.prefixes[Math.floor(rng() * pattern.prefixes.length)]} ${pattern.suffixes[Math.floor(rng() * pattern.suffixes.length)]}`;
  }
}

function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}
function hashString(str) {
  let hash = 5381;
  for (let i = 0; i < str.length; i++) hash = ((hash << 5) + hash + str.charCodeAt(i)) & 0xffffffff;
  return hash >>> 0;
}

class AudioManager {
  constructor() { this.sfxVolume = 0.75; this.musicVolume = 0.50; this.currentMusic = null; this.musicAudio = null; }
  setSfxVolume(vol) { this.sfxVolume = Math.max(0, Math.min(1, vol)); }
  setMusicVolume(vol) {
    this.musicVolume = Math.max(0, Math.min(1, vol));
    if (this.musicAudio) this.musicAudio.volume = this.musicVolume;
  }
  playSfx(sfxKey) {
    const src = SOUND_EFFECTS[sfxKey];
    if (!src || this.sfxVolume === 0) return;
    try { const a = new Audio(src); a.volume = this.sfxVolume; a.play().catch(() => {}); } catch (e) {}
  }
  playMusic(trackKey) {
    const src = MUSIC_TRACKS[trackKey];
    if (this.currentMusic === trackKey) return;
    this.stopMusic(); this.currentMusic = trackKey;
    if (!src || this.musicVolume === 0) return;
    try { this.musicAudio = new Audio(src); this.musicAudio.loop = true; this.musicAudio.volume = this.musicVolume; this.musicAudio.play().catch(() => {}); } catch (e) {}
  }
  stopMusic() { if (this.musicAudio) { this.musicAudio.pause(); this.musicAudio = null; } this.currentMusic = null; }
  getState() { return { sfxVolume: this.sfxVolume, musicVolume: this.musicVolume }; }
  loadState(s) { if (s) { this.setSfxVolume(s.sfxVolume ?? 0.75); this.setMusicVolume(s.musicVolume ?? 0.50); } }
}

// ============================================================================
// RARITY DERIVATION — Pure function, easy to modify
// ============================================================================
const RARITY_ORDER = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Unicorn"];

function deriveRarity(baseRarity, product, releaseYear, brand) {
  const currentYear = 2026;
  const yearDistance = currentYear - releaseYear;
  let rarity = baseRarity;

  // If baseRarity is "auto_age", derive from age tiers in region config
  if (rarity === "auto_age") {
    const regionConfig = REGION_CONFIG[brand.region];
    const age = product.age || (product.ageRange ? product.ageRange[0] : 4);
    rarity = "Common";
    if (regionConfig?.ageRules?.ageTiers) {
      for (const tier of regionConfig.ageRules.ageTiers) {
        if (age >= tier.min) rarity = tier.rarity;
      }
    }
  }

  let rarityIdx = RARITY_ORDER.indexOf(rarity);
  if (rarityIdx < 0) rarityIdx = 0;

  // Year distance bumps for core/annual products
  if (product.frequency === "core") {
    if (yearDistance >= 60) rarityIdx = Math.max(rarityIdx, 5); // Unicorn
    else if (yearDistance >= 40) rarityIdx = Math.max(rarityIdx, 4); // Legendary
    else if (yearDistance >= 20) rarityIdx = Math.max(rarityIdx, 3); // Epic... wait, spec says 20+ = Rare
    // Correcting to match spec:
    // 10-20yr old core = Uncommon bump
    // 20-40yr old core = Rare bump
    // 40-60yr old core = Epic bump
    // 60+ = Unicorn
    if (yearDistance >= 60) rarityIdx = Math.max(rarityIdx, 5);
    else if (yearDistance >= 40) rarityIdx = Math.max(rarityIdx, 4);
    else if (yearDistance >= 20) rarityIdx = Math.max(rarityIdx, 2);
    else if (yearDistance >= 10) rarityIdx = Math.max(rarityIdx, 1);
  } else if (product.frequency === "annual") {
    // Annual releases age faster in rarity
    if (yearDistance >= 30) rarityIdx = Math.max(rarityIdx, 4);
    else if (yearDistance >= 15) rarityIdx = Math.max(rarityIdx, 3);
    else if (yearDistance >= 8) rarityIdx = Math.max(rarityIdx, 2);
  } else if (product.frequency === "limited" || product.frequency === "once") {
    // Limited releases start at least Rare and scale up fast
    rarityIdx = Math.max(rarityIdx, 2);
    if (yearDistance >= 15) rarityIdx = Math.max(rarityIdx, 4);
    else if (yearDistance >= 8) rarityIdx = Math.max(rarityIdx, 3);
  }

  // Standout vintage years get a tier bump
  if (product.standoutYears?.includes(releaseYear)) {
    rarityIdx = Math.min(rarityIdx + 1, 5);
  }

  // Defunct brand bump
  if (brand.defunct && brand.defunct <= currentYear) {
    rarityIdx = Math.min(rarityIdx + 1, 5);
  }

  return RARITY_ORDER[Math.min(rarityIdx, 5)];
}

// ============================================================================
// VALUE CALCULATION — Derived from rarity, age, proof, modifiers
// ============================================================================
const RARITY_VALUE_MULTIPLIERS = { Common: 1, Uncommon: 1.8, Rare: 3.5, Epic: 7, Legendary: 18, Unicorn: 45 };

function calculateBottleValue(bottle) {
  let v = 15 + (bottle.age || 4) * 5 + ((bottle.proof || 80) - 80) * 0.3;
  v *= RARITY_VALUE_MULTIPLIERS[bottle.rarity] || 1;
  if (bottle.modifiers?.length > 0) v *= 1 + bottle.modifiers.length * 0.15;
  if (bottle.modifiers?.includes("Cask Strength")) v *= 1.2;
  if (bottle.modifiers?.includes("Single Barrel")) v *= 1.2;
  if (bottle.modifiers?.includes("Bottled-in-Bond")) v *= 1.1;
  if (bottle.modifiers?.includes("Mizunara Oak")) v *= 1.3;
  if (bottle.modifiers?.some(m => m.startsWith("Finished in") || m.endsWith("Finish") || m.endsWith("Cask"))) v *= 1.15;
  return Math.round(v);
}

// ============================================================================
// BRAND HISTORY GENERATION
// ============================================================================
function generateBrandHistory(rng, brandName, region) {
  const config = REGION_CONFIG[region];
  if (!config) return null;

  const currentYear = 2026;

  // Determine brand age category
  const ageRoll = rng();
  const { young, established } = config.brandAgeDistribution;
  let ageCategory;
  if (ageRoll < young) ageCategory = "young";
  else if (ageRoll < young + established) ageCategory = "established";
  else ageCategory = "legacy";

  // Founded year
  let founded;
  if (ageCategory === "young") founded = currentYear - 2 - Math.floor(rng() * 13); // 2-15 years ago
  else if (ageCategory === "established") founded = currentYear - 16 - Math.floor(rng() * 34); // 16-50 years ago
  else founded = currentYear - 51 - Math.floor(rng() * 85); // 51-136 years ago (as early as 1890)

  // Defunct? Small chance for established/legacy
  let defunct = null;
  if (ageCategory !== "young" && rng() < 0.12) {
    defunct = founded + 20 + Math.floor(rng() * (currentYear - founded - 20));
    defunct = Math.min(defunct, currentYear - 3); // closed at least 3 years ago
  }

  const operatingEnd = defunct || currentYear;

  // Determine whiskey types for this brand
  const types = [config.whiskyTypes[Math.floor(rng() * config.whiskyTypes.length)]];
  if (config.whiskyTypes.length > 1 && rng() < config.multiTypeChance) {
    const secondType = config.whiskyTypes.find(t => t !== types[0]);
    if (secondType) types.push(secondType);
  }

  // Generate mashbill per type (fixed for the brand's lifetime)
  const mashbills = {};
  for (const typeName of types) {
    const typeDef = WHISKEY_TYPES[typeName];
    if (!typeDef) continue;
    const primaryPct = typeDef.mashbill.primary.min + Math.floor(rng() * (typeDef.mashbill.primary.max - typeDef.mashbill.primary.min + 1));
    let remaining = 100 - primaryPct;
    const mashbill = { [typeDef.mashbill.primary.grain]: primaryPct };
    const secondaryGrains = [...(typeDef.mashbill.secondary || [])];
    for (let i = 0; i < secondaryGrains.length && remaining > 0; i++) {
      const pct = i === secondaryGrains.length - 1 ? remaining : Math.floor(rng() * (remaining + 1));
      if (pct > 0) mashbill[secondaryGrains[i]] = pct;
      remaining -= pct;
    }
    mashbills[typeName] = mashbill;
  }

  // Build product catalog
  const [catalogMin, catalogMax] = config.catalogSize[ageCategory];
  const targetProducts = catalogMin + Math.floor(rng() * (catalogMax - catalogMin + 1));
  const coreMax = config.coreMax[ageCategory];

  const catalog = [];
  let coreCount = 0;

  // Sort templates by weight for weighted selection
  const templates = config.productTemplates;

  // First, add core products
  const coreTemplates = templates.filter(t => t.category === "core");
  const shuffledCore = [...coreTemplates].sort(() => rng() - 0.5);
  for (const tmpl of shuffledCore) {
    if (coreCount >= coreMax || catalog.length >= targetProducts) break;

    // Pick which type this product is for
    const productType = types[Math.floor(rng() * types.length)];

    const product = buildProduct(tmpl, productType, rng, founded, operatingEnd, mashbills[productType], config);
    if (product) {
      catalog.push(product);
      coreCount++;
    }
  }

  // Then add special products
  const specialTemplates = templates.filter(t => t.category === "special");
  const shuffledSpecial = [...specialTemplates].sort(() => rng() - 0.5);
  for (const tmpl of shuffledSpecial) {
    if (catalog.length >= targetProducts) break;
    if (rng() > tmpl.weight / 10) continue; // weight-based chance of inclusion

    const productType = types[Math.floor(rng() * types.length)];

    const product = buildProduct(tmpl, productType, rng, founded, operatingEnd, mashbills[productType], config);
    if (product) {
      catalog.push(product);
    }
  }

  // Ensure active (non-defunct) brands have at least one currently-produced core product
  if (!defunct) {
    const currentYear = 2026;
    const hasCurrentCore = catalog.some(p => p.category === "core" && (!p.discontinued || p.discontinued >= currentYear));
    if (!hasCurrentCore && catalog.length > 0) {
      // Find the first core product and un-discontinue it
      const coreProduct = catalog.find(p => p.category === "core");
      if (coreProduct) {
        coreProduct.discontinued = null;
      } else {
        // No core products at all — un-discontinue the first product
        catalog[0].discontinued = null;
      }
    }
  }

  return {
    name: brandName,
    region,
    founded,
    defunct,
    ageCategory,
    types,
    mashbills,
    catalog,
  };
}

function buildProduct(template, typeName, rng, brandFounded, brandEnd, mashbill, regionConfig) {
  const currentYear = 2026;

  // When was this product introduced?
  let introduced;
  if (template.frequency === "core") {
    // Core products introduced early in brand's life
    introduced = brandFounded + Math.floor(rng() * Math.min(20, brandEnd - brandFounded));
  } else if (template.frequency === "once") {
    // One-time releases happen somewhere in the brand's later years
    const lateStart = brandFounded + Math.floor((brandEnd - brandFounded) * 0.5);
    introduced = lateStart + Math.floor(rng() * (brandEnd - lateStart));
  } else {
    // Annual/limited releases introduced later
    const midpoint = brandFounded + Math.floor((brandEnd - brandFounded) * 0.3);
    introduced = midpoint + Math.floor(rng() * (brandEnd - midpoint));
  }
  introduced = Math.max(brandFounded, Math.min(introduced, brandEnd));

  // Discontinued?
  let discontinued = null;
  if (template.frequency !== "once" && rng() < 0.15 && introduced < brandEnd - 5) {
    discontinued = introduced + 5 + Math.floor(rng() * (brandEnd - introduced - 5));
  }
  if (template.frequency === "once") {
    discontinued = introduced; // one-time = one year only
  }

  const productionEnd = discontinued || brandEnd;

  // Proof
  let proof;
  if (template.proof) {
    proof = template.proof;
  } else if (template.proofRange) {
    proof = template.proofRange[0] + Math.floor(rng() * (template.proofRange[1] - template.proofRange[0] + 1));
  } else {
    proof = 80;
  }

  // Age
  let age;
  if (template.age) {
    age = template.age;
  } else if (template.ageRange) {
    age = template.ageRange[0] + Math.floor(rng() * (template.ageRange[1] - template.ageRange[0] + 1));
  } else {
    age = regionConfig.ageRules.coreAge;
  }

  // Modifiers
  let modifiers = [...(template.modifiers || [])];
  if (template.modifierPool) {
    const pick = template.modifierPool[Math.floor(rng() * template.modifierPool.length)];
    modifiers.push(pick);
  }

  // Proof varies per batch?
  const proofVaries = template.proofRange && (modifiers.includes("Cask Strength") || modifiers.includes("Single Barrel"));

  // Standout years
  let standoutYears = null;
  if (template.hasStandoutYears) {
    standoutYears = [];
    const numStandouts = 1 + Math.floor(rng() * 3);
    for (let i = 0; i < numStandouts; i++) {
      const y = introduced + Math.floor(rng() * (productionEnd - introduced + 1));
      if (!standoutYears.includes(y)) standoutYears.push(y);
    }
  }

  // Build name from pattern
  let productName = template.namePattern;
  productName = productName.replace("{type}", typeName);
  productName = productName.replace("{age}", String(age));
  // For BiB with age > 4, prepend age statement to name
  if (modifiers.includes("Bottled-in-Bond") && age > 4 && !productName.includes(String(age))) {
    productName = `${age} Year ${productName}`;
  }
  if (template.modifierPool && modifiers.length > 0) {
    const finishName = modifiers[modifiers.length - 1].replace("Finished in ", "").replace(" Barrels", "").replace(" Finish", "");
    productName = productName.replace("{finish}", finishName);
  }
  // Append whiskey type if not already in the name
  if (!productName.includes(typeName)) {
    // Use friendly short names for display
    const typeDisplayName = { "Single Malt Scotch": "Single Malt Scotch Whisky", "Blended Scotch": "Blended Scotch Whisky", "Irish Whiskey": "Irish Whiskey", "Japanese Whisky": "Japanese Whisky", "Bourbon": "Bourbon", "Rye": "Rye" };
    productName = `${productName} ${typeDisplayName[typeName] || typeName}`;
  }

  return {
    id: `${template.id}_${typeName}_${introduced}`,
    templateId: template.id,
    name: productName,
    typeName,
    category: template.category,
    frequency: template.frequency,
    introduced,
    discontinued,
    proof,
    proofVaries: proofVaries || false,
    proofRange: template.proofRange || null,
    age,
    ageStated: template.ageStated !== undefined ? template.ageStated : false,
    ageRange: template.ageRange || null,
    ageVaries: template.ageVaries || false,
    mashbill: mashbill || {},
    modifiers,
    baseRarity: template.baseRarity,
    standoutYears,
  };
}


class WhiskeyEngine {
  constructor(gameSeed = Date.now()) {
    this.gameSeed = gameSeed;
    this.brands = {};
    this.brandNames = [];
    this.bottleCache = {};
    this._initBrands();
  }

  _initBrands() {
    const rng = seededRandom(this.gameSeed);
    const numBrands = 16 + Math.floor(rng() * 10);

    // Assign regions first with guaranteed minimums
    const allRegions = ["American", "Canadian", "Scottish", "Irish", "Japanese"];
    const minPerRegion = { American: Math.max(3, Math.ceil(numBrands * 0.25)), Canadian: 1, Scottish: Math.max(2, Math.ceil(numBrands * 0.15)), Irish: 1, Japanese: 1 };
    const regionSlots = [];
    for (const reg of allRegions) { for (let j = 0; j < minPerRegion[reg]; j++) regionSlots.push(reg); }
    const regionWeights = [["American", 0.30], ["Canadian", 0.10], ["Scottish", 0.25], ["Irish", 0.15], ["Japanese", 0.20]];
    while (regionSlots.length < numBrands) {
      let roll = rng(), pick = "American";
      for (const [reg, w] of regionWeights) { roll -= w; if (roll <= 0) { pick = reg; break; } }
      regionSlots.push(pick);
    }
    for (let i = regionSlots.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [regionSlots[i], regionSlots[j]] = [regionSlots[j], regionSlots[i]]; }

    const usedNames = new Set();
    for (let i = 0; i < regionSlots.length; i++) {
      const region = regionSlots[i];
      let name, attempts = 0;
      do { name = generateBrandName(rng, region); attempts++; } while (usedNames.has(name) && attempts < 50);
      if (usedNames.has(name)) continue;
      usedNames.add(name);

      // Generate brand history with catalog
      const history = generateBrandHistory(rng, name, region);
      if (!history) continue;

      this.brands[name] = {
        region,
        founded: history.founded,
        defunct: history.defunct,
        ageCategory: history.ageCategory,
        types: history.types,
        mashbills: history.mashbills,
        catalog: history.catalog,
        // Visual properties
        bottleShapeIdx: Math.floor(rng() * BOTTLE_SHAPES.length),
        bottleColor: BOTTLE_COLORS[Math.floor(rng() * BOTTLE_COLORS.length)],
        capColor: CAP_COLORS[Math.floor(rng() * CAP_COLORS.length)],
        labelColor: LABEL_COLORS[Math.floor(rng() * LABEL_COLORS.length)],
        labelAccent: LABEL_ACCENT_COLORS[Math.floor(rng() * LABEL_ACCENT_COLORS.length)],
      };
      this.brandNames.push(name);
    }
  }

  generateBottle(tierLevel = 1, rep = 0) {
    const rng = seededRandom(Date.now() + Math.random() * 100000);
    const currentYear = 2026;

    // ---- STEP 1: Roll the tier table to determine target rarity ----
    const TIER_RARITY_WEIGHTS = {
      //          Common    Uncommon  Rare      Epic      Legendary Unicorn
      1: [0.7815, 0.9714, 0.9984, 0.99940, 0.99990, 1.0],
      2: [0.6503, 0.8304, 0.9805, 0.99850, 0.99950, 1.0],
      3: [0.5000, 0.6800, 0.8800, 0.96000, 0.99500, 1.0],
      4: [0.3500, 0.5500, 0.8000, 0.93000, 0.99000, 1.0],
      5: [0.2250, 0.4050, 0.7050, 0.88500, 0.98500, 1.0],
      6: [0.1550, 0.3050, 0.6550, 0.90500, 0.98000, 1.0],
    };
    const rarityWeights = TIER_RARITY_WEIGHTS[Math.min(tierLevel, 6)] || TIER_RARITY_WEIGHTS[6];
    const rarityRoll = rng();
    let targetRarityIdx = 0;
    for (let ri = 0; ri < rarityWeights.length; ri++) {
      if (rarityRoll < rarityWeights[ri]) { targetRarityIdx = ri; break; }
    }
    const targetRarity = RARITY_ORDER[targetRarityIdx];

    // ---- STEP 2: Find a bottle (brand + product + year) that matches target rarity ----
    // Try multiple attempts; if we can't match exactly, fall to closest lower rarity
    let bestMatch = null;
    let bestMatchDist = 999;
    const maxAttempts = 20;

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const brandName = this.brandNames[Math.floor(rng() * this.brandNames.length)];
      const brand = this.brands[brandName];
      if (!brand || !brand.catalog || brand.catalog.length === 0) continue;

      // Filter products by tier
      const availableProducts = brand.catalog.filter(p => {
        if (p.introduced > currentYear) return false;
        return true;
      });
      if (availableProducts.length === 0) continue;

      // Pick a product (weighted — core still more common in general selection)
      const weights = availableProducts.map(p => {
        if (p.frequency === "core") return 8;
        if (p.frequency === "annual") return 4;
        if (p.frequency === "limited") return 2;
        if (p.frequency === "once") return 1;
        return 5;
      });
      const totalWeight = weights.reduce((s, w) => s + w, 0);
      let roll = rng() * totalWeight;
      let product = availableProducts[0];
      for (let i = 0; i < availableProducts.length; i++) {
        roll -= weights[i];
        if (roll <= 0) { product = availableProducts[i]; break; }
      }

      // Pick a release year
      const prodStart = product.introduced;
      const prodEnd = product.discontinued || (brand.defunct || currentYear);
      let releaseYear;
      if (product.frequency === "once") {
        releaseYear = prodStart;
      } else {
        const yearSpan = prodEnd - prodStart;
        if (yearSpan <= 0) {
          releaseYear = prodStart;
        } else {
          const recencyBias = tierLevel <= 1 ? 8.0 : tierLevel <= 2 ? 5.0 : tierLevel <= 3 ? 3.0 : tierLevel <= 4 ? 1.8 : tierLevel <= 5 ? 1.0 : 0.6;
          const yearRoll = 1 - Math.pow(rng(), recencyBias);
          releaseYear = prodStart + Math.floor(yearRoll * yearSpan);
        }
      }
      releaseYear = Math.max(prodStart, Math.min(releaseYear, prodEnd));

      // Derive rarity for this combination
      const derivedRarity = deriveRarity(product.baseRarity, product, releaseYear, brand);
      const derivedIdx = RARITY_ORDER.indexOf(derivedRarity);

      // How close is this to our target?
      const dist = targetRarityIdx - derivedIdx; // positive = we need higher, negative = derived is too high

      if (dist === 0) {
        // Exact match — use this bottle
        bestMatch = { brandName, brand, product, releaseYear, rarity: targetRarity };
        break;
      }

      // Track closest match that is AT or BELOW target (fail downward)
      if (derivedIdx <= targetRarityIdx) {
        const gap = targetRarityIdx - derivedIdx;
        if (gap < bestMatchDist) {
          bestMatchDist = gap;
          bestMatch = { brandName, brand, product, releaseYear, rarity: derivedRarity };
        }
      }
    }

    // If no match at or below target found at all, take any match and clamp down
    if (!bestMatch) {
      // Last resort: generate any bottle and assign Common
      const brandName = this.brandNames[Math.floor(rng() * this.brandNames.length)];
      const brand = this.brands[brandName];
      if (!brand || !brand.catalog || brand.catalog.length === 0) return null;
      const coreProducts = brand.catalog.filter(p => p.frequency === "core" && p.introduced <= currentYear);
      const product = coreProducts.length > 0 ? coreProducts[Math.floor(rng() * coreProducts.length)] : brand.catalog[0];
      const prodEnd = product.discontinued || (brand.defunct || currentYear);
      const releaseYear = Math.max(product.introduced, currentYear - 5);
      bestMatch = { brandName, brand, product, releaseYear: Math.min(releaseYear, prodEnd), rarity: "Common" };
    }

    // ---- STEP 3: Build the bottle from the matched product + year ----
    const { brandName, brand, product, releaseYear, rarity } = bestMatch;

    let proof = product.proof;
    if (product.proofVaries && product.proofRange) {
      proof = product.proofRange[0] + Math.floor(rng() * (product.proofRange[1] - product.proofRange[0] + 1));
    }

    let age = product.age;
    if (product.ageVaries && product.ageRange) {
      age = product.ageRange[0] + Math.floor(rng() * (product.ageRange[1] - product.ageRange[0] + 1));
    }

    const ageStated = product.ageStated;
    const ageDisplay = ageStated ? `${age}yr` : "Unstated";

    const modifiers = [...(product.modifiers || [])];
    const trueValue = calculateBottleValue({ age, proof, rarity, modifiers });

    const typeName = product.typeName;
    let productDisplayName = product.name;
    if (product.ageVaries && product.ageRange && ageStated) {
      productDisplayName = `${age} Year ${productDisplayName.replace(/\d+ Year /, "")}`;
    }
    const baseDisplayName = `${brandName} ${productDisplayName}`;
    const displayName = `${releaseYear} ${baseDisplayName}`;

    const bottle = {
      id: `b_${Date.now()}_${Math.floor(Math.random() * 10000)}`,
      brandName,
      typeName,
      productName: product.name,
      productId: product.id,
      year: releaseYear,
      age,
      proof,
      ageDisplay,
      ageStated,
      mashbill: product.mashbill || brand.mashbills[typeName] || {},
      region: brand.region,
      modifiers,
      rarity,
      trueValue,
      value: trueValue,
      yearKnown: true,
      // Visual
      bottleShapeIdx: brand.bottleShapeIdx,
      bottleColor: brand.bottleColor,
      capColor: brand.capColor,
      labelColor: brand.labelColor,
      labelAccent: brand.labelAccent,
      // Display
      baseDisplayName,
      displayName,
      // Catalog reference
      frequency: product.frequency,
      standoutYear: product.standoutYears?.includes(releaseYear) || false,
    };

    return bottle;
  }

  _calculateBaseValue(age, proof, rarity, modifiers, yearKnown = true) {
    let v = calculateBottleValue({ age, proof, rarity, modifiers });
    if (!yearKnown) v = Math.round(v * 0.55);
    return v;
  }

  getEngineStats() {
    return {
      totalBrands: this.brandNames.length,
      cachedBottles: Object.keys(this.bottleCache).length,
      brandDetails: Object.entries(this.brands).map(([name, b]) => ({
        name, region: b.region, founded: b.founded, defunct: b.defunct,
        types: b.types, products: b.catalog?.length || 0,
      })),
    };
  }
}

function BottleSVG({ bottle, size = 160 }) {

      <rect x="33" y="72" width="34" height="40" rx="2" fill={bottle.labelColor} stroke={bottle.labelAccent} strokeWidth="1" />
      {labelLines.slice(0, 3).map((line, i) => (
        <text key={i} x="50" y={82 + i * 11} textAnchor="middle" fill={bottle.labelAccent} fontSize="6" fontFamily="serif" fontWeight={i === 0 ? "bold" : "normal"}>

function BottleCard({ bottle, showRarity = false, onClick, yearEstimate = null, hideValue = false, purchasePrice = null, inspectHighlight = null, rarityRevealPhase = null, rarityRevealProgress = 0, rarityRevealColor = null }) {
  const rarityDef = RARITIES.find(r => r.name === bottle.rarity);
  let borderStyle;
  let unicornGlowWrap = null;
  let cardTransform = ""; // zoom + shake transform
  if (rarityRevealPhase === "breathe" && rarityRevealColor) {
    // Decode: progress = intensity + dramaLevel * 10
    const rawProgress = rarityRevealProgress;
    const dramaLevel = Math.floor(rawProgress / 10) / 10; // 0, 0.033, 0.066, 0.1 → scaled
    const drama = Math.min(rawProgress >= 10 ? (rawProgress - Math.floor(rawProgress / 10) * 10) >= 0 ? Math.floor(rawProgress / 10) * 10 / 10 : 0 : 0, 1);
    const p = rawProgress % 10; // intensity 0-1
    // Simpler decode
    const dramaRaw = Math.floor(rawProgress * 10) >= 10 ? rawProgress - (rawProgress % 1 < 1 ? 0 : 0) : 0;
    // Let me just do this properly:
    const intensityPart = rawProgress - Math.floor(rawProgress);
    const dramaPart = Math.floor(rawProgress) / 10; // 0, 0.33, 0.66, 1.0
    // But rawProgress is intensity + drama*10, so:
    // if rawProgress = 0.85 + 0.33*10 = 3.85 → drama = floor(3.85)/10 won't work
    // Actually: drama*10 is 0, 3.3, 6.6, 10 → floor gives 0,3,6,10
    // intensity is the fractional-ish part but it can be > 1... 
    // Let's use modulo: intensity = rawProgress % 2 if drama is encoded as multiples of 10
    // rawProgress = intensity + dramaLevel * 10 where intensity is 0-1 and drama is 0,3.3,6.6,10
    const dramaDecoded = rawProgress >= 10 ? 1.0 : rawProgress >= 6 ? 0.66 : rawProgress >= 3 ? 0.33 : 0;
    const intensityDecoded = rawProgress - dramaDecoded * 10;

    const hexToRgba = (hex, alpha) => {
      const r = parseInt(hex.slice(1, 3), 16) || 0;
      const g = parseInt(hex.slice(3, 5), 16) || 0;
      const b = parseInt(hex.slice(5, 7), 16) || 0;
      return `rgba(${r},${g},${b},${alpha})`;
    };

    // Apply zoom and shake based on drama level
    if (dramaDecoded > 0) {
      const scale = 1 + dramaDecoded * 0.06; // max 1.06 at Unicorn
      const shakeAmount = dramaDecoded * 2.5; // max 2.5px at Unicorn
      const shakeX = (Math.sin(Date.now() * 0.025) * shakeAmount).toFixed(1);
      const shakeY = (Math.cos(Date.now() * 0.031) * shakeAmount * 0.6).toFixed(1);
      cardTransform = `scale(${scale}) translate(${shakeX}px, ${shakeY}px)`;
    }

    if (rarityRevealColor === "unicorn") {
      borderStyle = {
        border: `3px solid rgba(236,72,153,${0.15 + intensityDecoded * 0.85})`,
        boxShadow: "0 4px 12px rgba(0,0,0,0.4)",
      };
      unicornGlowWrap = {
        background: `linear-gradient(135deg, rgba(59,130,246,${intensityDecoded * 0.6}), rgba(236,72,153,${intensityDecoded * 0.6}))`,
        padding: `${Math.round(3 + intensityDecoded * 8)}px`,
        borderRadius: "20px",
        boxShadow: intensityDecoded > 0.05 ? `0 0 ${Math.round(35 * intensityDecoded)}px rgba(59,130,246,${intensityDecoded * 0.4}), 0 0 ${Math.round(35 * intensityDecoded)}px rgba(236,72,153,${intensityDecoded * 0.4})` : "none",
      };
    } else {
      const outerGlow = Math.round(30 * intensityDecoded);
      const innerGlow = Math.round(22 * intensityDecoded);
      const borderColor = hexToRgba(rarityRevealColor, 0.2 + intensityDecoded * 0.8);
      const outerShadow = hexToRgba(rarityRevealColor, intensityDecoded * 0.5);
      const innerShadow = hexToRgba(rarityRevealColor, intensityDecoded * 0.15);
      borderStyle = {
        border: `3px solid ${borderColor}`,
        boxShadow: intensityDecoded > 0.05 ? `0 0 ${outerGlow}px ${outerShadow}, inset 0 0 ${innerGlow}px ${innerShadow}` : "0 4px 12px rgba(0,0,0,0.4)",
      };
    }
  } else if (rarityRevealPhase === "flash") {
    const isSuccess = rarityRevealColor === "success";
    const flashColor = isSuccess ? "rgba(34,197,94,1)" : "rgba(239,68,68,1)";
    const flashGlow = isSuccess
      ? "0 0 35px rgba(34,197,94,0.8), inset 0 0 25px rgba(34,197,94,0.15)"
      : "0 0 35px rgba(239,68,68,0.8), inset 0 0 25px rgba(239,68,68,0.15)";
    borderStyle = { border: `3px solid ${flashColor}`, boxShadow: flashGlow, transition: "border-color 0.15s, box-shadow 0.15s" };
  } else if (rarityRevealPhase === "resolve" && rarityRevealColor) {
    borderStyle = { border: `3px solid ${rarityRevealColor}`, boxShadow: `0 0 24px ${rarityRevealColor}45, inset 0 0 16px ${rarityRevealColor}10`, transition: "border-color 0.4s ease, box-shadow 0.4s ease" };
  } else if (showRarity) {
    borderStyle = rarityDef?.gradient ? { borderImage: `${rarityDef.gradient} 1`, borderWidth: "3px", borderStyle: "solid", boxShadow: "0 4px 12px rgba(0,0,0,0.4)" } : { border: `3px solid ${rarityDef?.color || "#6B7280"}`, boxShadow: `0 4px 12px rgba(0,0,0,0.4), 0 0 12px ${rarityDef?.color || "#6B7280"}30` };
  } else {
    borderStyle = { border: "2px solid var(--border)", boxShadow: "0 4px 12px rgba(0,0,0,0.4)" };
  }
  const hl = (field) => inspectHighlight?.field === field ? { boxShadow: inspectHighlight.success ? "0 0 12px rgba(34,197,94,0.7), inset 0 0 8px rgba(34,197,94,0.15)" : "0 0 12px rgba(239,68,68,0.7), inset 0 0 8px rgba(239,68,68,0.15)", borderRadius: "4px", transition: "box-shadow 0.2s", padding: "1px 3px", background: inspectHighlight.success ? "rgba(34,197,94,0.08)" : "rgba(239,68,68,0.08)" } : {};
  const cardEl = (
    <div onClick={onClick} style={{ ...borderStyle, borderRadius: "16px", background: `linear-gradient(145deg, var(--bg3), var(--bg2))`, padding: "16px", cursor: onClick ? "pointer" : "default", width: "280px", maxWidth: "90vw", flexShrink: 0,
      transform: cardTransform || "none", zIndex: cardTransform ? 10 : "auto", position: "relative",
    }}
      onMouseEnter={e => { if (!rarityRevealPhase) { e.currentTarget.style.transform = "translateY(-4px)"; e.currentTarget.style.boxShadow = "0 8px 24px rgba(0,0,0,0.6)"; } }}
      onMouseLeave={e => { if (!rarityRevealPhase) { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = ""; } }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: "12px", background: "radial-gradient(ellipse at center, rgba(255,248,230,0.08) 0%, transparent 70%)", borderRadius: "8px", padding: "8px 0" }}>
        <BottleSVG bottle={bottle} size={140} />
      </div>
      <h3 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "15px", color: "var(--text)", margin: "0 0 10px 0", lineHeight: 1.3, textAlign: "center", minHeight: "40px" }}>{bottle.displayName}</h3>

        <span style={tagStyle("#8B4513")}>{bottle.region}</span>
        <span style={tagStyle("#704214")}>{bottle.typeName}</span>
        <span style={{ ...hl("modifiers") }}>{bottle.modifiers.map((m, i) => <span key={i} style={tagStyle("#5B3A29")}>{m}</span>)}</span>
        {showRarity && <span style={{ ...tagStyle(rarityDef?.color || "#6B7280"), ...(rarityDef?.gradient ? { background: rarityDef.gradient, color: "#fff" } : {}), ...hl("rarity") }}>{bottle.rarity}</span>}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px", fontSize: "12px", color: "var(--text-muted)", fontFamily: "'JetBrains Mono', 'Courier New', monospace" }}>
        <div style={hl("proof")}><span style={{ color: "var(--text-dim)" }}>PROOF</span> {bottle.proof}</div>
        <div><span style={{ color: "var(--text-dim)" }}>AGE</span> {bottle.ageDisplay || `${bottle.age}yr`}</div>
        <div style={{ gridColumn: "1 / -1", ...hl("year") }}>
          <span style={{ color: "var(--text-dim)" }}>YEAR</span>{" "}
          {bottle.yearKnown ? bottle.year : yearEstimate ? (
            yearEstimate.exact ? <span style={{ color: "var(--accent)" }}>{yearEstimate.min} (verified)</span> : <span style={{ color: "var(--accent-dark)" }}>~{yearEstimate.min}–{yearEstimate.max}</span>
          ) : "Unknown"}
        </div>
      </div>
      {!hideValue && (
        <div style={{ marginTop: "12px", textAlign: "center", fontSize: "18px", fontFamily: "'Playfair Display', Georgia, serif", fontWeight: "bold", color: purchasePrice != null ? "var(--text-muted)" : "var(--accent)" }}>
          {purchasePrice != null ? `Paid: $${purchasePrice.toLocaleString()}` : `$${bottle.value.toLocaleString()}`}
        </div>
      )}
    </div>
  );
  if (unicornGlowWrap) {
    return <div style={{ ...unicornGlowWrap, display: "inline-block", transform: cardTransform || "none", zIndex: cardTransform ? 10 : "auto", position: "relative" }}>{cardEl}</div>;
  }
  return cardEl;
}

function BrandPanel({ engine }) {
  const stats = engine.getEngineStats();
  const [expanded, setExpanded] = useState(null);
  return (
    <div style={{ background: `linear-gradient(145deg, var(--bg2), var(--bg3))`, borderRadius: "12px", padding: "20px", border: "1px solid var(--border)" }}>
      <h3 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "var(--accent)", margin: "0 0 16px 0", fontSize: "18px" }}>Registered Brands ({stats.totalBrands})</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: "6px", maxHeight: "400px", overflowY: "auto" }}>
        {stats.brandDetails.map(b => {
          const brand = engine.brands[b.name];
          return (
            <div key={b.name} onClick={() => setExpanded(expanded === b.name ? null : b.name)}
              style={{ background: "var(--surface)", borderRadius: "8px", padding: "10px 14px", cursor: "pointer", border: expanded === b.name ? "1px solid var(--accent)" : "1px solid var(--border)", transition: "border-color 0.2s" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "var(--text)", fontSize: "14px" }}>{b.name}</span>
                <span style={tagStyle("#8B4513")}>{b.region}</span>
              </div>
              {expanded === b.name && (
                <div style={{ marginTop: "10px", fontSize: "12px", color: "var(--text-muted)", fontFamily: "monospace" }}>
                  <div style={{ marginBottom: "4px" }}>Types: {b.types.length > 0 ? b.types.join(", ") : "None yet"}</div>

}

function TitleShelfDisplay() {
  const bottles = useRef(null);
  if (!bottles.current) {
    const rng = seededRandom(777);
    bottles.current = Array.from({ length: 24 }, (_, i) => ({
      shapeIdx: Math.floor(rng() * BOTTLE_SHAPES.length),
      color: BOTTLE_COLORS[Math.floor(rng() * BOTTLE_COLORS.length)],
      capColor: CAP_COLORS[Math.floor(rng() * CAP_COLORS.length)],
      x: (i % 8) * 72 + 20 + (rng() * 12 - 6),
      row: Math.floor(i / 8),
    }));
  }
  const bs = bottles.current;
  const shelfY = [90, 210, 330];
  return (
    <svg viewBox="0 0 620 420" style={{ width: "100%", maxWidth: "620px" }}>
      <rect x="0" y="0" width="620" height="420" rx="8" fill="var(--surface)" />

        <linearGradient id="shF" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#6a4a28" /><stop offset="100%" stopColor="#4a3018" /></linearGradient>
        <filter id="bSh"><feDropShadow dx="1" dy="2" stdDeviation="2" floodOpacity="0.5" /></filter>

      {shelfY.map((sy, row) => (
        <g key={row}>

          <rect x="8" y={sy + 8} width="604" height="6" rx="1" fill="url(#shF)" />
          <rect x="30" y={sy + 8} width="8" height="16" rx="1" fill="#3d2810" />
          <rect x="582" y={sy + 8} width="8" height="16" rx="1" fill="#3d2810" />
          {bs.filter(b => b.row === row).map((b, i) => (
            <g key={i} transform={`translate(${b.x}, ${sy - 68}) scale(0.42)`} filter="url(#bSh)">
              <g dangerouslySetInnerHTML={{ __html: (BOTTLE_SHAPES[b.shapeIdx] || BOTTLE_SHAPES[0])(b.color, b.capColor) }} />

function themeToCSS(t) {
  // Parse hex to get RGB values for alpha variants
  const hexToRGB = (hex) => { const h = hex.replace('#',''); return `${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)}`; };
  return `--accent: ${t.accent}; --accent-dark: ${t.accentDark}; --bg1: ${t.bg1}; --bg2: ${t.bg2}; --bg3: ${t.bg3}; --surface: ${t.surface}; --border: ${t.border}; --text: ${t.text}; --text-muted: ${t.textMuted}; --text-dim: ${t.textDim}; --success: ${t.success}; --danger: ${t.danger}; --buy-accent: ${t.buyAccent}; --accent-rgb: ${hexToRGB(t.accent)}; --border-rgb: ${hexToRGB(t.border)}; --success-rgb: ${hexToRGB(t.success)}; --danger-rgb: ${hexToRGB(t.danger)}; --buy-accent-rgb: ${hexToRGB(t.buyAccent)}; --text-dim-rgb: ${hexToRGB(t.textDim)}; --bg3-rgb: ${hexToRGB(t.bg3)};`;
}

const volBtnStyle = { width: "32px", height: "32px", border: "1px solid var(--border)", borderRadius: "8px", background: "var(--surface)", color: "var(--accent)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 };
const menuBtnStyle = { padding: "14px 32px", background: "linear-gradient(145deg, var(--accent), var(--accent-dark))", border: "none", borderRadius: "12px", color: "var(--bg1)", fontSize: "14px", fontWeight: "700", fontFamily: "'Inter', 'SF Pro Display', -apple-system, sans-serif", cursor: "pointer", letterSpacing: "0.5px", boxShadow: "0 4px 16px rgba(212,175,55,0.15), inset 0 1px 0 rgba(255,255,255,0.15)", transition: "all 0.15s ease" };

function OptionsMenu({ audio, onClose, onSfxChange, onMusicChange, currentTheme, onThemeChange, onDevTools }) {
  const steps = [0, 0.25, 0.50, 0.75, 1.0];
  const [sfxVol, setSfxVol] = useState(audio.sfxVolume);
  const [musVol, setMusVol] = useState(audio.musicVolume);
  const handleSfx = (v) => { setSfxVol(v); onSfxChange(v); };
  const handleMus = (v) => { setMusVol(v); onMusicChange(v); };
  const VolControl = ({ label, value, onChange }) => (
    <div style={{ marginBottom: "20px" }}>
      <div style={{ fontFamily: "'Inter', sans-serif", fontSize: "11px", color: "var(--text-dim)", letterSpacing: "1px", marginBottom: "10px", fontWeight: "600" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
        <button onClick={() => { const i = steps.indexOf(value); if (i > 0) onChange(steps[i - 1]); }} style={volBtnStyle} disabled={value <= 0}>
          <svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="2" fill="currentColor" /></svg>
        </button>
        <div style={{ flex: 1, height: "6px", background: "var(--surface)", borderRadius: "3px", overflow: "hidden" }}>
          <div style={{ width: `${value * 100}%`, height: "100%", background: `linear-gradient(90deg, var(--accent), var(--accent-dark))`, borderRadius: "3px", transition: "width 0.2s" }} />
        </div>
        <button onClick={() => { const i = steps.indexOf(value); if (i < steps.length - 1) onChange(steps[i + 1]); }} style={volBtnStyle} disabled={value >= 1}>
          <svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="2" fill="currentColor" /><rect x="7" y="3" width="2" height="10" fill="currentColor" /></svg>
        </button>
        <span style={{ fontFamily: "'Inter', sans-serif", fontSize: "13px", color: "var(--accent)", width: "40px", textAlign: "right", fontWeight: "600" }}>{Math.round(value * 100)}%</span>
      </div>
    </div>
  );
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: "16px" }}
      onClick={onClose}>
      <div style={{ background: `linear-gradient(145deg, var(--bg3), var(--bg2))`, borderRadius: "16px", padding: "28px", border: "1px solid var(--border)", width: "400px", maxWidth: "90vw", animation: "fadeIn 0.3s ease-out" }}
        onClick={e => e.stopPropagation()}>
        <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "var(--accent)", margin: "0 0 24px 0", fontSize: "22px", textAlign: "center" }}>Options</h2>
        <VolControl label="SOUND EFFECTS" value={sfxVol} onChange={handleSfx} />
        <VolControl label="MUSIC" value={musVol} onChange={handleMus} />
        {/* Theme picker */}
        <div style={{ marginBottom: "20px" }}>
          <div style={{ fontFamily: "'Inter', sans-serif", fontSize: "11px", color: "var(--text-dim)", letterSpacing: "1px", marginBottom: "10px", fontWeight: "600" }}>COLOR THEME</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "8px" }}>
            {Object.entries(THEMES).map(([key, theme]) => (
              <button key={key} onClick={() => onThemeChange(key)}
                style={{ padding: "8px", background: theme.bg1, border: currentTheme === key ? `2px solid ${theme.accent}` : `1px solid ${theme.border}`, borderRadius: "10px", cursor: "pointer", textAlign: "center", transition: "all 0.15s" }}>
                <div style={{ display: "flex", gap: "2px", justifyContent: "center", marginBottom: "4px", padding: "4px 6px", background: theme.bg2, borderRadius: "6px" }}>
                  <div style={{ width: "14px", height: "14px", borderRadius: "50%", background: theme.accent, border: `1px solid ${theme.border}` }} />
                  <div style={{ width: "14px", height: "14px", borderRadius: "50%", background: theme.buyAccent, border: `1px solid ${theme.border}` }} />
                  <div style={{ width: "14px", height: "14px", borderRadius: "50%", background: theme.success, border: `1px solid ${theme.border}` }} />
                  <div style={{ width: "14px", height: "14px", borderRadius: "50%", background: theme.danger, border: `1px solid ${theme.border}` }} />
                  <div style={{ width: "14px", height: "14px", borderRadius: "50%", background: theme.text, border: `1px solid ${theme.border}` }} />
                </div>
                <div style={{ fontSize: "9px", color: theme.text, fontFamily: "'Inter', sans-serif", fontWeight: "500" }}>{theme.name}</div>
              </button>
            ))}
          </div>
        </div>
        <div style={{ textAlign: "center", marginTop: "20px", display: "flex", flexDirection: "column", gap: "8px", alignItems: "center" }}>
          <button onClick={onClose} style={menuBtnStyle}>BACK</button>
          {onDevTools && <button onClick={() => { onClose(); onDevTools(); }} style={{ ...menuBtnStyle, background: "transparent", border: "1px solid var(--danger)", color: "var(--danger)", fontSize: "10px", padding: "6px 16px" }}>DEV TOOLS</button>}
        </div>
      </div>
    </div>
  );
}

                    <path d="M3 6h18" /><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2" /><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" />
                  </svg>

      <button onClick={onBack} style={{ ...menuBtnStyle, marginTop: "16px", background: "transparent", border: "2px solid #3a302860", color: "var(--text-dim)" }}>BACK</button>

  );
}

    } else {
      setActiveSlot(i); initEngine(); setInventory([]); setCash(STARTING_CASH); setReputation(0); setDay(1); setMissedRent(0); setGameOver(false); setStoreTier(1);
      setPlayerSkills({ appraisal: { Bourbon: 0, Rye: 0, Scotch: 0, Irish: 0, Japanese: 0 }, industryKnowledge: 0, peopleReader: 0, salesmanship: 0 });
      setCodex({}); setScreen("nameStore");
    }
    audio.playSfx("buttonClick");
  }, [saves, initEngine, audio, resetActiveState]);

  const handleDeleteSlot = useCallback((i) => { setSaves(p => { const n = [...p]; n[i] = null; return n; }); audio.playSfx("buttonClick"); }, [audio]);
  const handleNameSubmit = useCallback((name) => {
    setStoreName(name);
    // Seed codex with known brands and their currently-produced products
    if (engineRef.current) {
      const engine = engineRef.current;
      const seedCodex = {};
      const currentYear = 2026;
      for (const brandName of engine.brandNames) {
        const brand = engine.brands[brandName];
        seedCodex[brandName] = { __brandKnown: true, __region: brand.region, __founded: brand.founded, __defunct: brand.defunct, __ageCategory: brand.ageCategory, __types: brand.types, __totalProducts: brand.catalog.length };
        // Add currently produced core and annual products to codex
        const catalog = brand.catalog || [];
        for (const product of catalog) {
          const prodEnd = product.discontinued || (brand.defunct || currentYear);
          const isCurrentlyProduced = prodEnd >= currentYear && (product.frequency === "core" || product.frequency === "annual");
          if (!isCurrentlyProduced) continue;
          const variantKey = product.name;
          seedCodex[brandName][variantKey] = {
            brandName, typeName: product.typeName, modifiers: [...(product.modifiers || [])], variantKey,
            displayName: `${brandName} ${product.name}`,
            minYear: null, maxYear: null,
            lastProof: product.proof, lastAge: product.age, lastMashbill: product.mashbill || brand.mashbills[product.typeName] || {},
            region: brand.region, encounters: 0,
            frequency: product.frequency, ageStated: product.ageStated,
            bottleShapeIdx: brand.bottleShapeIdx, bottleColor: brand.bottleColor,
            capColor: brand.capColor, labelColor: brand.labelColor, labelAccent: brand.labelAccent,
          };
        }
      }
      setCodex(seedCodex);
    }
    setActiveTab("shop"); setScreen("game"); audio.playSfx("buttonClick");
  }, [audio]);

  useEffect(() => {
    if (screen === "game" && activeSlot !== null && engineRef.current) {
      setSaves(p => { const n = [...p]; n[activeSlot] = { storeName, storeTier, inventory, cash, reputation, day, missedRent, playerSkills, codex, gameSeed: engineRef.current.gameSeed, engineBrands: engineRef.current.brands, engineBrandNames: engineRef.current.brandNames, engineBottleCache: engineRef.current.bottleCache }; return n; });
    }
  }, [screen, activeSlot, storeName, storeTier, inventory, cash, reputation, day, missedRent, playerSkills, codex]);

  const engine = engineRef.current;
  const tierData = ECONOMY_TIERS[storeTier - 1];
  const shelfLimit = tierData.shelfLimit;
  const canAfford = (price) => cash >= price;
  const shelfFull = inventory.length >= shelfLimit;

  // ---- PLAYER SKILLS ----
  const SKILL_TIERS_LABEL = ["None", "Novice", "Apprentice", "Journeyman", "Expert", "Master"];
  const SKILL_COSTS = [0, 200, 800, 2500, 8000, 25000];
  // Appraisal costs are lower since there are 5 tracks
  const APPRAISAL_COSTS = [0, 150, 500, 1500];
  const APPRAISAL_LABELS = ["Untrained", "Familiar", "Knowledgeable", "Expert"];

  // Map whiskey type names to appraisal skill keys
  const TYPE_TO_APPRAISAL_KEY = {
    "Bourbon": "Bourbon", "Rye": "Rye",
    "Single Malt Scotch": "Scotch", "Blended Scotch": "Scotch",
    "Irish Whiskey": "Irish", "Japanese Whisky": "Japanese",
  };

  // ---- INSPECT SYSTEM ----
  // Inspect state: tracks what's been revealed for the current seller's bottle
  const [inspectResult, setInspectResult] = useState(null);
  // { typeRevealed, proofRevealed, modifiersRevealed, yearRevealed, rarityRevealed, mysteryFlag, counterfeitDetected }

  const getAppraisalLevel = useCallback((typeName) => {
    const key = TYPE_TO_APPRAISAL_KEY[typeName] || "Bourbon";
    return (playerSkills.appraisal || {})[key] || 0;
  }, [playerSkills]);

  const [inspectAnimating, setInspectAnimating] = useState(false);
  const [inspectHighlight, setInspectHighlight] = useState(null); // { field, success } for current highlight
  const [rarityRevealPhase, setRarityRevealPhase] = useState(null); // null | "cycle" | "flash" | "resolve"
  const [rarityRevealProgress, setRarityRevealProgress] = useState(0);
  const [rarityRevealColor, setRarityRevealColor] = useState(null);
  const [mysteryGlowing, setMysteryGlowing] = useState(false);
  const [showMysteryModal, setShowMysteryModal] = useState(false);

  const handleInspect = useCallback((bottle, customerKnowledge) => {
    if (!bottle || inspectResult || inspectAnimating) return;
    const level = getAppraisalLevel(bottle.typeName);
    const appraisalKey = TYPE_TO_APPRAISAL_KEY[bottle.typeName] || bottle.typeName;

    // Conversation entry
    const levelDescs = [
      `You turn the bottle over in your hands. It's a ${bottle.typeName}... you're not very familiar with ${appraisalKey} at all.`,
      `You examine the bottle with a practiced eye. A ${bottle.typeName} — you know the basics of ${appraisalKey}.`,
      `You inspect the bottle carefully, drawing on your solid knowledge of ${appraisalKey}.`,
      `You study every detail of this ${bottle.typeName} with expert-level ${appraisalKey} knowledge.`,
    ];
    setConvoLog(prev => [...prev, { who: "narrator", text: levelDescs[Math.min(level, 3)] }]);

    // Calculate results
    const modChance = level >= 1 ? 1.0 : 0.75;
    const yearChance = [0.05, 0.25, 0.50, 1.0][level];
    const rarityChance = [0.05, 0.25, 0.50, 1.0][level];
    const mysteryChance = [0, 0.50, 0.75, 0][level];
    const counterfeitChance = [0, 0.25, 0.50, 0.90][level];

    const rng = Math.random;
    const typeRevealed = true;
    const proofRevealed = true;
    const modifiersRevealed = rng() < modChance;
    const yearRevealed = rng() < yearChance;
    const rarityRevealed = rng() < rarityChance;

    let mysteryFlag = false;
    let mysteryHint = null;
    const rarityIdx = RARITY_ORDER.indexOf(bottle.rarity);
    const isCounterfeit = bottle.isCounterfeit || false;
    const counterfeitDetected = isCounterfeit && rng() < counterfeitChance;

    // Mystery flag logic: only triggers when inspection MISSED something significant
    // Level 3: special case — 10% false positive on Legendary/Unicorn for intrigue
    if (level === 3) {
      if (rarityIdx >= 4 && rng() < 0.10) {
        mysteryFlag = true;
        mysteryHint = "Something about this bottle gives you pause... but you can't quite place why.";
      }
    } else {
      // For levels 0-2: mystery flag is determined AFTER inspection results
      // We'll compute it later in the animation timeline, but pre-calculate the conditions here
      // Store what we need for post-inspection mystery evaluation
    }

    // Build the mystery evaluation data for post-inspection
    const mysteryEvalData = {
      level, rarityIdx, bottle,
      yearRevealed, rarityRevealed, modifiersRevealed,
      isCounterfeit, counterfeitDetected,
    };

    // Determine what's already visible from customer knowledge
    const knowledge = customerKnowledge || 50;
    const alreadyVisible = {
      type: knowledge >= 20,
      proof: knowledge >= 20,
      modifiers: knowledge >= 45,
      year: knowledge >= 70 && bottle.yearKnown,
    };

    // Build steps — skip already-visible fields, rarity always last
    const steps = [];
    if (!alreadyVisible.type) steps.push({ field: "type", success: typeRevealed, key: "typeRevealed" });
    if (!alreadyVisible.proof) steps.push({ field: "proof", success: proofRevealed, key: "proofRevealed" });
    if (!alreadyVisible.modifiers) steps.push({ field: "modifiers", success: modifiersRevealed, key: "modifiersRevealed" });
    if (!alreadyVisible.year) steps.push({ field: "year", success: yearRevealed, key: "yearRevealed" });
    // Rarity is ALWAYS unknown before inspect, always animate it last
    // But we handle it separately with the border sweep

    setInspectAnimating(true);
    audio.playSfx("buttonClick");

    // Start with already-known fields pre-revealed
    let accumulated = {
      inspected: true,
      typeRevealed: alreadyVisible.type || false,
      proofRevealed: alreadyVisible.proof || false,
      modifiersRevealed: alreadyVisible.modifiers || false,
      yearRevealed: alreadyVisible.year || false,
      rarityRevealed: false, mysteryFlag: false, counterfeitDetected: false,
    };
    setInspectResult({ ...accumulated });

    const STEP_DELAY = 700;

    // Animate non-rarity steps
    steps.forEach((step, i) => {
      setTimeout(() => {
        setInspectHighlight({ field: step.field, success: step.success });
        if (step.success) accumulated = { ...accumulated, [step.key]: true };
        setInspectResult({ ...accumulated });
        setTimeout(() => setInspectHighlight(null), 400);
      }, (i + 1) * STEP_DELAY);
    });

    // After all non-rarity steps: rarity border animation
    const rarityStart = (steps.length + 1) * STEP_DELAY + 300;

    // Phase 1: Breathing color cycle — each rarity color fades in then out
    // Per-color durations: Common/Uncommon/Rare = 700ms, Epic = 800ms, Legendary = 900ms, Unicorn = 1100ms
    const rarityColors = ["#6B7280", "#22C55E", "#3B82F6", "#A855F7", "#EAB308", "unicorn"];
    const breathDurations = [700, 700, 700, 800, 900, 1100];
    // Cumulative start times for each color
    const breathStarts = [];
    let cumTime = 0;
    for (let i = 0; i < breathDurations.length; i++) { breathStarts.push(cumTime); cumTime += breathDurations[i]; }
    const totalBreathTime = cumTime;
    setTimeout(() => {
      setRarityRevealPhase("breathe");
      const breathStartTime = Date.now();
      const breathInterval = setInterval(() => {
        const elapsed = Date.now() - breathStartTime;
        if (elapsed >= totalBreathTime) {
          clearInterval(breathInterval);
          setRarityRevealColor(null);
          setRarityRevealProgress(0);
          return;
        }
        // Find which color we're in based on cumulative times
        let colorIdx = 0;
        for (let i = breathDurations.length - 1; i >= 0; i--) {
          if (elapsed >= breathStarts[i]) { colorIdx = i; break; }
        }
        const withinColor = (elapsed - breathStarts[colorIdx]) / breathDurations[colorIdx];
        // Sine wave: 0→1→0 for smooth breathe
        const intensity = Math.sin(withinColor * Math.PI);
        setRarityRevealColor(rarityColors[colorIdx]);
        // Encode both intensity and drama level into progress
        // Drama: 0 for Common-Rare, ramps up for Epic(0.33), Legendary(0.66), Unicorn(1.0)
        const dramaLevel = colorIdx <= 2 ? 0 : colorIdx === 3 ? 0.33 : colorIdx === 4 ? 0.66 : 1.0;
        // Pack intensity in lower bits and drama in upper: progress = intensity, separate state for drama
        setRarityRevealProgress(intensity);
        // Use rarityRevealProgress for intensity, encode drama into the color string
        // Actually, simpler: pass drama as a fractional addition > 1 that BottleCard can decode
        // progress = intensity + dramaLevel * 10 (drama is in the tens digit)
        setRarityRevealProgress(intensity + dramaLevel * 10);
      }, 25);
    }, rarityStart);

    // Phase 2: Green/red flash on the border
    const flashStart = rarityStart + totalBreathTime + 300;
    setTimeout(() => {
      setRarityRevealPhase("flash");
      setRarityRevealColor(rarityRevealed ? "success" : "fail");
    }, flashStart);

    // Phase 3: Resolve — settle to actual rarity color or fade back
    const resolveStart = flashStart + 500;
    setTimeout(() => {
      setRarityRevealPhase("resolve");
      if (rarityRevealed) {
        const actualColor = RARITIES.find(r => r.name === bottle.rarity)?.color || "#6B7280";
        setRarityRevealColor(actualColor);
        accumulated = { ...accumulated, rarityRevealed: true };
      } else {
        setRarityRevealColor(null);
        setRarityRevealPhase(null);
      }
      setInspectResult({ ...accumulated });
    }, resolveStart);

    // Phase 4: Evaluate mystery flag based on what FAILED to reveal
    const mysteryStart = resolveStart + 800;
    setTimeout(() => {
      setInspectHighlight(null);
      setRarityRevealPhase(null);
      setRarityRevealProgress(0);
      setRarityRevealColor(null);

      // Post-inspection mystery evaluation (levels 0-2 only; level 3 was handled above)
      const ed = mysteryEvalData;
      let finalMysteryFlag = mysteryFlag; // already set for level 3
      let finalMysteryHint = mysteryHint;

      if (ed.level < 3) {
        // Check what failed to reveal and whether hidden info is significant
        const hiddenReasons = [];

        // Unrevealed year on an old bottle = significant hidden value
        if (!ed.yearRevealed && ed.bottle.year && (2026 - ed.bottle.year) >= 15) {
          hiddenReasons.push({ weight: 3, hint: "The label on this bottle has a noticeably faded coloration to it." });
        } else if (!ed.yearRevealed && ed.bottle.year && (2026 - ed.bottle.year) >= 8) {
          hiddenReasons.push({ weight: 1.5, hint: "There's some subtle wear on the label that suggests this isn't recent." });
        }

        // Unrevealed rarity on a genuinely rare+ bottle
        if (!ed.rarityRevealed && ed.rarityIdx >= 3) { // Epic+
          hiddenReasons.push({ weight: 4, hint: "Something about this bottle just feels... different. You can't explain it." });
        } else if (!ed.rarityRevealed && ed.rarityIdx >= 2) { // Rare
          hiddenReasons.push({ weight: 2, hint: "You get a sense that this one might be worth a closer look." });
        }

        // Unrevealed modifiers on a bottle that has them
        if (!ed.modifiersRevealed && ed.bottle.modifiers && ed.bottle.modifiers.length > 0) {
          hiddenReasons.push({ weight: 1.5, hint: "There seems to be some fine print on the label you can't quite make out." });
        }

        // Counterfeit that wasn't detected
        if (ed.isCounterfeit && !ed.counterfeitDetected) {
          hiddenReasons.push({ weight: 2, hint: "The seal on this bottle looks slightly off, but you're not sure why." });
        }

        if (hiddenReasons.length > 0) {
          // Pick the highest-weight reason
          hiddenReasons.sort((a, b) => b.weight - a.weight);
          const bestReason = hiddenReasons[0];

          // Chance scales with weight and level: higher weight = more likely to trigger gut feeling
          // Level 0: 8-15%, Level 1: 12-20%, Level 2: 15-25%
          const baseChance = [0.08, 0.12, 0.15][ed.level] || 0.08;

  const trackBottleInCodex = useCallback((bottle, knownYear = null) => {
    if (!bottle) return;

    const variantKey = bottle.productName || `${(bottle.modifiers || []).sort().join(" ")}${bottle.modifiers?.length ? " " : ""}${bottle.typeName}`;
    // Only record year if explicitly passed as known, or if bottle.yearKnown is true AND knownYear is not explicitly false
    const yearIsKnown = knownYear === true ? true : knownYear === false ? false : (bottle.yearKnown === true);
    setCodex(prev => {
      const next = { ...prev };
      if (!next[brand]) next[brand] = {};
      if (!next[brand].__brandKnown) next[brand].__brandKnown = true;
      const existing = next[brand][variantKey];
      if (existing) {
        if (yearIsKnown) {
          existing.minYear = Math.min(existing.minYear ?? bottle.year, bottle.year);
          existing.maxYear = Math.max(existing.maxYear ?? bottle.year, bottle.year);
        }
        existing.encounters = (existing.encounters || 0) + 1;
        existing.lastProof = bottle.proof;
        existing.lastAge = bottle.age;
        existing.lastMashbill = bottle.mashbill;
      } else {
        next[brand][variantKey] = {
          brandName: brand, typeName: bottle.typeName, modifiers: [...(bottle.modifiers || [])], variantKey,
          displayName: bottle.baseDisplayName || `${brand} ${variantKey}`,
          minYear: yearIsKnown ? bottle.year : null, maxYear: yearIsKnown ? bottle.year : null,
          lastProof: bottle.proof, lastAge: bottle.age, lastMashbill: bottle.mashbill, region: bottle.region, encounters: 1,

        };
      }
      return next;
    });
  }, []);

  const trackPriceInCodex = useCallback((bottle, dealType, price) => {
    if (!bottle) return;
    const brand = bottle.brandName;
    const variantKey = bottle.productName || `${(bottle.modifiers || []).sort().join(" ")}${bottle.modifiers?.length ? " " : ""}${bottle.typeName}`;
    const yearKey = bottle.yearKnown ? String(bottle.year) : "unknown";

      const next = { ...prev };
      if (!next[brand] || !next[brand][variantKey]) return next;
      const entry = next[brand][variantKey];
      if (!entry.priceHistory) entry.priceHistory = {};
      if (!entry.priceHistory[yearKey]) entry.priceHistory[yearKey] = {};
      const yh = entry.priceHistory[yearKey];
      if (dealType === "buy") { yh.minBuy = yh.minBuy != null ? Math.min(yh.minBuy, price) : price; yh.maxBuy = yh.maxBuy != null ? Math.max(yh.maxBuy, price) : price; }

  const getOfferForBottle = useCallback((customer, bottle) => {
    if (!customer || !bottle || customer.type !== "buyer") return { offer: 0, maxPay: 0 };
    const t = customer.traits;
    const flexibility = (t.sociability * 0.3 + (100 - t.confidence) * 0.3 + t.patience * 0.2 + (100 - t.knowledge) * 0.2) / 100;
    const trueVal = bottle.trueValue || bottle.value;

      const effectiveBudget = Math.round(base * (1 + appealBonus) * dispMod * matchMult);
      const maxPay = Math.max(Math.round(effectiveBudget * (1 + flexibility * 0.2)), 10);

      return { offer, maxPay, budget: effectiveBudget };

      const flatBase = customer.flatBudget || 50;
      const knowledgeBlend = (t.knowledge - 35) / 30;
      valueBasis = Math.round(flatBase * (1 - knowledgeBlend) + trueVal * 0.75 * knowledgeBlend);
      valueBasis = Math.max(valueBasis, Math.round(flatBase * 0.7));
    } else {
      // High knowledge: value-based
      const knowledgePremium = 0.8 + ((t.knowledge - 65) / 35) * 0.3;
      valueBasis = Math.round(trueVal * knowledgePremium);
    }

    // If customer has pivoted (no matching stock existed), treat everything as matching
    const isMatch = customer.pivoted ? true : (customer.filter ? customer.filter(bottle) : true);
    let matchMult = 1.0;
    if (!isMatch) {
      matchMult = t.knowledge < 65 ? 0.7 : 0.6;
    }

    const budget = Math.round(valueBasis * bRatio * dispMod * matchMult);
    const maxPay = Math.max(Math.round(budget * (1 + flexibility * 0.5)), 10);
    const offer = Math.max(Math.round(budget * (customer.offerRatio || 0.6)), 5);
    return { offer, maxPay, budget };
  }, []);

    else playerText = isSeller ? tactic.sellerText : tactic.buyerText;

    const responsePool = tactic.responses[effect]?.[isSeller ? "seller" : "buyer"] || tactic.responses[effect]?.seller || ['"..."'];
    const response = responsePool[Math.floor(Math.random() * responsePool.length)];

    if (phase === "pre") setPreTacticUsed(tacticId);
    else setMidTacticUsed(tacticId);

    if (mult === null) {
      setTacticResult({ text: response, effect: "terrible" });
      setShowTacticsMenu(false);
      if (negotiating) {
        setNegResult("walked");

      }

    setTacticResult({ text: response, effect });

    if (tactic.tacticType === "rapport") {
      // Rapport tactics: shift acceptance likelihood, don't change prices
      // acceptBonus is a cumulative modifier on accept chance in submitOffer
      const rapportShift = { great: 0.25, good: 0.12, neutral: 0, bad: -0.12, terrible: -0.25 }[effect] || 0;

      }

      // Price-shift tactics: directly change offer values
      if (isSeller) {
        const newAsk = Math.max(Math.round(c.askingPrice * mult), c.minAccept);

        if (negotiating) {
          setCustomerOffer(newAsk);
          setConvoLog(prev => [...prev, { who: "player", amount: null, text: playerText }, { who: "customer", amount: newAsk, text: response, effect }]);
        }
      } else {
        const newMax = Math.round(c.maxPay * (mult < 1 ? 1 + (1 - mult) : mult));
        const newOffer = Math.round(c.openingOffer * (mult < 1 ? 1 + (1 - mult) * 0.5 : mult));

    setTimeout(() => setTacticResult(null), 2500);
