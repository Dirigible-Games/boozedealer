                                          </div>
                                          <input type="range" min={sliderMin} max={sliderMax} step={1} value={playerOffer}
                                            onChange={e => setPlayerOffer(Number(e.target.value))} style={{ width: "100%", accentColor: "var(--buy-accent)", cursor: "pointer" }} />
                                        </div>
                                        <div style={{ display: "flex", gap: "8px", flexWrap: "wrap" }}>
                                          <button onClick={submitOffer} style={{ flex: "1 1 auto", padding: "10px 12px", background: "linear-gradient(145deg, #3B82F6, #2563EB)", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                            ASK ${playerOffer.toLocaleString()}
                                          </button>
                                          {negResult === "countered" && (
                                            <button onClick={acceptCounter} style={{ flex: "1 1 auto", padding: "10px 12px", background: "linear-gradient(145deg, #22C55E, var(--success))", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>
                                              ACCEPT ${customerOffer.toLocaleString()}
                                            </button>
                                          )}
                                          <button onClick={walkAway} style={{ flex: "0 0 auto", padding: "10px 12px", background: "transparent", border: "2px solid var(--text-dim)", borderRadius: "8px", color: "var(--text-dim)", fontSize: "12px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>WALK</button>
                                        </div>
                                      </>
                                    )}
                                  </div>
                                </div>
                              );
                            })()}
                          </div>
                        )}
                      </div>
                    ) : (
                      /* All customers served */
                      <div style={{ textAlign: "center", padding: "30px 16px", animation: "fadeIn 0.4s ease-out" }}>
                        <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "2px", marginBottom: "8px" }}>DAY {day} COMPLETE</div>
                        <div style={{ fontSize: "18px", color: "var(--accent)", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "16px" }}>
                          All customers served.
                        </div>
                        {/* Quick stats before ending */}
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", maxWidth: "280px", margin: "0 auto 16px" }}>
                          <div style={{ background: "var(--surface)", borderRadius: "6px", padding: "8px", border: "1px solid var(--border)" }}>
                            <div style={{ fontSize: "8px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px" }}>DEALS</div>
                            <div style={{ fontSize: "16px", color: "var(--text)", fontFamily: "monospace" }}>{dailyLog.filter(l => l.type === "buy" || l.type === "sell").length}</div>
                          </div>
                          <div style={{ background: "var(--surface)", borderRadius: "6px", padding: "8px", border: "1px solid var(--border)" }}>
                            <div style={{ fontSize: "8px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px" }}>NET</div>
                            <div style={{ fontSize: "16px", color: dailyLog.reduce((s, l) => s + l.amount, 0) >= 0 ? "var(--success)" : "var(--danger)", fontFamily: "monospace" }}>
                              {dailyLog.reduce((s, l) => s + l.amount, 0) >= 0 ? "+" : ""}${dailyLog.reduce((s, l) => s + l.amount, 0).toLocaleString()}
                            </div>
                          </div>
                        </div>
                        <button onClick={handleEndDay} style={{ ...menuBtnStyle, width: "100%", maxWidth: "280px" }}
                          onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 20px rgba(212,175,55,0.5)"; }}
                          onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 12px rgba(212,175,55,0.3)"; }}>
                          CLOSE UP SHOP
                        </button>
                      </div>
                    )}
                  </>
                )}
              </div>
            )}
            {activeTab === "inventory" && (
              <div>
                <div style={{ display: "flex", gap: "12px", marginBottom: "20px", flexWrap: "wrap", alignItems: "center" }}>
                  <span style={{ fontSize: "11px", color: "var(--text-dim)", fontFamily: "monospace" }}>FILTER</span>
                  {["All", ...Object.keys(WHISKEY_TYPES)].map(t => (
                    <button key={t} onClick={() => setFilterType(t)} style={{ padding: "6px 14px", border: filterType === t ? "1px solid #D4AF37" : "1px solid #3a3028", borderRadius: "6px", background: filterType === t ? "var(--accent)" : "transparent", color: filterType === t ? "var(--accent)" : "var(--text-dim)", fontSize: "12px", cursor: "pointer", fontFamily: "monospace" }}>{t}</button>
                  ))}
                  <span style={{ marginLeft: "auto", fontSize: "11px", color: "var(--text-dim)", fontFamily: "monospace" }}>SORT</span>
                  {[["newest","Newest"],["value","Value"],["age","Age"],["proof","Proof"],["rarity","Rarity"]].map(([k, l]) => (
                    <button key={k} onClick={() => setSortBy(k)} style={{ padding: "6px 14px", border: sortBy === k ? "1px solid #D4AF37" : "1px solid #3a3028", borderRadius: "6px", background: sortBy === k ? "var(--accent)" : "transparent", color: sortBy === k ? "var(--accent)" : "var(--text-dim)", fontSize: "12px", cursor: "pointer", fontFamily: "monospace" }}>{l}</button>
                  ))}
                </div>
                {filteredInventory.length === 0
                  ? <div style={{ textAlign: "center", padding: "60px 20px", color: "#5a4a38", fontSize: "14px" }}>{inventory.length === 0 ? "Your shelves are empty. Head to the shop to buy some bottles." : "No bottles match this filter."}</div>
                  : <div style={{ display: "flex", flexWrap: "wrap", gap: "16px", justifyContent: "center" }}>{filteredInventory.map(b => <BottleCard key={b.id} bottle={b} showRarity={showRarity} yearEstimate={estimateYear(b)} purchasePrice={b.purchasePrice} />)}</div>
                }
              </div>
            )}
            {activeTab === "skills" && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "20px", padding: "20px 0" }}>
                <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "var(--accent)", fontSize: "22px", margin: 0 }}>Tools & Skills</h2>
                <p style={{ color: "var(--text-dim)", fontSize: "12px", fontFamily: "monospace", textAlign: "center", maxWidth: "450px" }}>
                  Invest in your expertise. Better tools mean better deals.
                </p>
                {/* Skill: Year Estimation */}
                {(() => {
                  const SkillRow = ({ skillKey, label, desc, accuracyFn }) => {
                    const level = playerSkills[skillKey];
                    const nextLevel = level + 1;
                    const maxed = level >= 5;
                    const cost = maxed ? 0 : SKILL_COSTS[nextLevel];
                    const canBuy = !maxed && cash >= cost;
                    return (
                      <div style={{ background: `linear-gradient(145deg, var(--bg2), var(--bg3))`, borderRadius: "12px", padding: "16px", border: "1px solid var(--border)", width: "100%", maxWidth: "500px" }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "12px" }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: "14px", color: "var(--text)", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "4px" }}>{label}</div>
                            <div style={{ fontSize: "11px", color: "var(--text-dim)", fontFamily: "monospace" }}>
                              {maxed ? `MASTER — ${desc.master}` : level === 0 ? `Not unlocked — ${desc.none}` : `${SKILL_TIERS_LABEL[level]} — ${accuracyFn(level)}`}
                            </div>
                            {!maxed && (
                              <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", marginTop: "4px" }}>
                                Next: {SKILL_TIERS_LABEL[nextLevel]} ({accuracyFn(nextLevel)})
                              </div>
                            )}
                          </div>
                          <div style={{ display: "flex", gap: "3px", marginRight: "8px" }}>
                            {[1,2,3,4,5].map(pip => (
                              <div key={pip} style={{ width: "8px", height: "20px", borderRadius: "2px", background: pip <= level ? "var(--accent)" : "var(--border)", border: "1px solid var(--border)" }} />
                            ))}
                          </div>
                          {!maxed && (
                            <button onClick={() => {
                              if (canBuy) { setCash(prev => prev - cost); setPlayerSkills(prev => ({ ...prev, [skillKey]: nextLevel })); audio.playSfx("storeUpgrade"); }
                            }} disabled={!canBuy}
                              style={{ padding: "8px 16px", background: canBuy ? "linear-gradient(145deg, var(--accent), var(--accent-dark))" : "var(--border)", border: "none", borderRadius: "6px", color: canBuy ? "var(--bg1)" : "var(--text-dim)", fontSize: "12px", fontWeight: "bold", cursor: canBuy ? "pointer" : "not-allowed", fontFamily: "monospace", opacity: canBuy ? 1 : 0.5, whiteSpace: "nowrap" }}>
                              ${cost.toLocaleString()}
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  };
                  return (
                    <>
                      <SkillRow skillKey="yearEstimation" label="Year Estimation"
                        desc={{ none: "Cannot estimate release years", master: "Exact year identification" }}
                        accuracyFn={(lv) => YEAR_EST_ACCURACY[lv] === 0 ? "Exact" : `±${YEAR_EST_ACCURACY[lv]} year accuracy`} />
                      <SkillRow skillKey="industryKnowledge" label="Industry Knowledge"
                        desc={{ none: "No insight into brand catalogs", master: "Complete brand catalog access" }}
                        accuracyFn={(lv) => ["", "Basic brand awareness", "Common release info", "Detailed catalogs", "Expert-level archives", "Complete mastery"][lv]} />
                      <SkillRow skillKey="peopleReader" label="People Reader"
                        desc={{ none: "No read on customer traits", master: "Full customer profiling" }}
                        accuracyFn={(lv) => ["", "Sense sociability", "Read patience", "Gauge knowledge", "Judge confidence", "Full disposition read"][lv]} />
                    </>
                  );
                })()}
              </div>
            )}
            {activeTab === "codex" && (
              <div>
                <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "var(--accent)", fontSize: "22px", margin: "0 0 8px 0", textAlign: "center" }}>Codex</h2>
                <p style={{ color: "var(--text-dim)", fontSize: "12px", fontFamily: "monospace", textAlign: "center", marginBottom: "20px" }}>
                  Your personal reference of every bottle you've encountered. Knowledge is power.
                </p>
                {Object.keys(codex).length === 0 ? (
                  <div style={{ textAlign: "center", padding: "60px 20px", color: "#5a4a38", fontSize: "14px" }}>
                    No bottles encountered yet. Start trading to fill your codex.
                  </div>
                ) : (() => {
                  const [expandedBrand, setExpandedBrandLocal] = [codexExpandedBrand, setCodexExpandedBrand];
                  const [expandedVariant, setExpandedVariantLocal] = [codexExpandedVariant, setCodexExpandedVariant];
                  const brands = Object.keys(codex).sort();
                  return (
                    <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                      {brands.map(brand => {
                        const variants = codex[brand];
                        const variantKeys = Object.keys(variants).sort();
                        const isExpanded = expandedBrand === brand;
                        return (
                          <div key={brand}>
                            <button onClick={() => setExpandedBrandLocal(isExpanded ? null : brand)}
                              style={{ width: "100%", padding: "12px 16px", background: isExpanded ? "rgba(255,255,255,0.05)" : "var(--surface)", border: isExpanded ? "1px solid var(--accent)" : "1px solid var(--border)", borderRadius: isExpanded ? "8px 8px 0 0" : "8px", cursor: "pointer", textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                              <span style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "var(--text)", fontSize: "15px" }}>{brand}</span>
                              <span style={{ fontSize: "11px", color: "var(--text-dim)", fontFamily: "monospace" }}>{variantKeys.length} variant{variantKeys.length !== 1 ? "s" : ""}</span>
                            </button>
                            {isExpanded && (
                              <div style={{ background: "rgba(255,255,255,0.05)", border: "1px solid var(--border)", borderTop: "none", borderRadius: "0 0 8px 8px", padding: "8px" }}>
                                {variantKeys.map(vk => {
                                  const v = variants[vk];
                                  const isVarExpanded = expandedVariant === `${brand}|${vk}`;
                                  return (
                                    <div key={vk} style={{ marginBottom: "4px" }}>
                                      <button onClick={() => setExpandedVariantLocal(isVarExpanded ? null : `${brand}|${vk}`)}
                                        style={{ width: "100%", padding: "8px 12px", background: isVarExpanded ? "rgba(255,255,255,0.04)" : "transparent", border: isVarExpanded ? "1px solid var(--accent)" : "1px solid rgba(255,255,255,0.05)", borderRadius: "6px", cursor: "pointer", textAlign: "left" }}>
                                        <span style={{ fontSize: "13px", color: "var(--text-muted)", fontFamily: "monospace" }}>{v.variantKey}</span>
                                        <span style={{ fontSize: "10px", color: "var(--text-dim)", marginLeft: "8px" }}>({v.encounters}x seen)</span>
                                      </button>
                                      {isVarExpanded && (
                                        <div style={{ padding: "12px", background: "var(--bg1)", borderRadius: "0 0 6px 6px", margin: "0 4px", border: "1px solid #2a221840", borderTop: "none" }}>
                                          <div style={{ display: "flex", gap: "16px", alignItems: "flex-start" }}>
                                            <BottleSVG bottle={v} size={100} />
                                            <div style={{ flex: 1 }}>
                                              <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "14px", color: "var(--text)", marginBottom: "8px" }}>{v.displayName}</div>
                                              <div style={{ fontSize: "11px", color: "var(--text-muted)", fontFamily: "monospace", display: "flex", flexDirection: "column", gap: "4px" }}>
                                                <div><span style={{ color: "var(--text-dim)" }}>REGION</span> {v.region}</div>
                                                <div><span style={{ color: "var(--text-dim)" }}>RELEASE YEARS</span> {v.minYear && v.maxYear ? (v.minYear === v.maxYear ? `?–${v.maxYear}` : `${v.minYear}–${v.maxYear}`) : "Unknown"}</div>
                                                <div><span style={{ color: "var(--text-dim)" }}>PROOF</span> {v.lastProof}</div>
                                                <div><span style={{ color: "var(--text-dim)" }}>AGE</span> {v.lastAge >= 3 && v.lastAge <= 6 ? "Unstated" : `${v.lastAge}yr`}</div>
                                                <div style={{ marginTop: "4px" }}>
                                                  <span style={{ color: "var(--text-dim)" }}>MASHBILL</span>
                                                  <div style={{ display: "flex", gap: "8px", marginTop: "2px", flexWrap: "wrap" }}>
                                                    {Object.entries(v.lastMashbill || {}).filter(([,val]) => val > 0).sort(([,a],[,b]) => b - a).map(([grain, pct]) => {
                                                      const gc = { Corn: "var(--accent)", Rye: "#A0522D", Barley: "#DAA520", Wheat: "#DEB887" };
                                                      return <span key={grain} style={{ color: gc[grain] || "#888" }}>{grain} {pct}%</span>;
                                                    })}
                                                  </div>
                                                </div>
                                                {v.modifiers.length > 0 && (
                                                  <div style={{ marginTop: "4px", display: "flex", gap: "4px", flexWrap: "wrap" }}>
                                                    {v.modifiers.map((m, mi) => <span key={mi} style={tagStyle("#5B3A29")}>{m}</span>)}
                                                  </div>
                                                )}
                                                {/* Price History */}
                                                {v.priceHistory && Object.keys(v.priceHistory).length > 0 && (
                                                  <div style={{ marginTop: "10px", borderTop: "1px solid #2a2218", paddingTop: "8px" }}>
                                                    <div style={{ color: "var(--text-dim)", fontSize: "10px", letterSpacing: "1px", marginBottom: "6px" }}>DEAL HISTORY</div>
                                                    {Object.entries(v.priceHistory).sort(([a],[b]) => a === "unknown" ? 1 : b === "unknown" ? -1 : Number(a) - Number(b)).map(([yearKey, ph]) => (
                                                      <div key={yearKey} style={{ display: "flex", flexWrap: "wrap", gap: "8px", alignItems: "center", padding: "4px 0", borderBottom: "1px solid #2a221830" }}>
                                                        <span style={{ color: "var(--text)", minWidth: "60px" }}>{yearKey === "unknown" ? "Unknown Yr" : yearKey}</span>
                                                        {(ph.minBuy != null || ph.maxBuy != null) && (
                                                          <span style={{ color: "var(--danger)" }}>
                                                            Buy: ${ph.minBuy?.toLocaleString() ?? "?"}{ph.maxBuy != null && ph.maxBuy !== ph.minBuy ? `–$${ph.maxBuy.toLocaleString()}` : ""}
                                                          </span>
                                                        )}
                                                        {(ph.minSell != null || ph.maxSell != null) && (
                                                          <span style={{ color: "var(--success)" }}>
                                                            Sell: ${ph.minSell?.toLocaleString() ?? "?"}{ph.maxSell != null && ph.maxSell !== ph.minSell ? `–$${ph.maxSell.toLocaleString()}` : ""}
                                                          </span>
                                                        )}
                                                      </div>
                                                    ))}
                                                  </div>
                                                )}
                                              </div>
                                            </div>
                                          </div>
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
              </div>
            )}
          </div>

          {/* Tactics Modal Dialog */}
          {showTacticsMenu && (
            <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.7)", zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", padding: "20px" }}
              onClick={() => setShowTacticsMenu(false)}>
              <div style={{ background: `linear-gradient(145deg, var(--bg2), var(--bg3))`, border: "1px solid var(--accent)", borderRadius: "12px", padding: "20px", width: "100%", maxWidth: "320px", display: "flex", flexDirection: "column", gap: "8px" }}
                onClick={e => e.stopPropagation()}>
                <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "16px", color: "var(--accent)", textAlign: "center", marginBottom: "4px" }}>
                  Choose a Tactic
                </div>
                <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", textAlign: "center", marginBottom: "8px" }}>
                  {negRound === 0 ? "Opening move — sets the tone" : "Mid-negotiation — shift momentum"}
                </div>
                {Object.values(TACTICS).filter(t => (negRound === 0 ? true : t.id !== preTacticUsed) && (!t.requiresSkill || (playerSkills[t.requiresSkill] || 0) >= t.minLevel) && (!t.sellerOnly || currentCustomer?.type === "seller") && (!t.requiresUnknownYear || !currentCustomer?.bottle?.yearKnown)).map(t => (
                  <button key={t.id} onClick={() => applyTactic(t.id, negRound === 0 ? "pre" : "mid")}
                    style={{ padding: "12px 16px", background: "rgba(255,255,255,0.04)", border: "1px solid var(--text-dim)", borderRadius: "8px", color: "var(--text)", fontSize: "14px", cursor: "pointer", fontFamily: "monospace", width: "100%", transition: "border-color 0.2s" }}>
                    {t.label}
                  </button>
                ))}
                <button onClick={() => setShowTacticsMenu(false)}
                  style={{ padding: "10px 16px", background: "transparent", border: "2px solid var(--text-dim)", borderRadius: "8px", color: "var(--text-dim)", fontSize: "13px", cursor: "pointer", fontFamily: "monospace", marginTop: "4px", width: "100%" }}>
                  CANCEL
                </button>
              </div>
            </div>
          )}
        </>
      )}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes msgFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes titlePulse { 0%, 100% { text-shadow: 0 0 30px rgba(212,175,55,0.3), 0 2px 4px rgba(0,0,0,0.5); } 50% { text-shadow: 0 0 50px rgba(212,175,55,0.5), 0 2px 4px rgba(0,0,0,0.5); } }
        @keyframes subtleGlow { 0%, 100% { box-shadow: 0 0 8px rgba(212,175,55,0.1); } 50% { box-shadow: 0 0 16px rgba(212,175,55,0.2); } }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #3a302860; border-radius: 4px; }
        * { box-sizing: border-box; } input::placeholder { color: #5a4a38; }
        button { transition: all 0.15s ease !important; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.07); }
        button:active { transform: scale(0.97) !important; }
        input[type="range"] { -webkit-appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-track { height: 6px; background: #2a2218; border-radius: 3px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(145deg, var(--accent), var(--accent-dark)); border: 2px solid #1a1510; box-shadow: 0 2px 8px rgba(0,0,0,0.4); cursor: pointer; margin-top: -9px; }
        input[type="range"]::-moz-range-track { height: 6px; background: #2a2218; border-radius: 3px; border: none; }
        input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(145deg, var(--accent), var(--accent-dark)); border: 2px solid #1a1510; box-shadow: 0 2px 8px rgba(0,0,0,0.4); cursor: pointer; }
      `}</style>
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(WhiskeyGame));
  </script></body></html>
