// ============================================================================
// SEEDED RANDOM
// ============================================================================
function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}
function hashString(str) {
  let hash = 5381;
  for (let i = 0; i < str.length; i++) hash = ((hash << 5) + hash + str.charCodeAt(i)) & 0xffffffff;
  return hash >>> 0;
}

class AudioManager {
  constructor() { this.sfxVolume = 0.75; this.musicVolume = 0.50; this.currentMusic = null; this.musicAudio = null; }
  setSfxVolume(vol) { this.sfxVolume = Math.max(0, Math.min(1, vol)); }
  setMusicVolume(vol) {
    this.musicVolume = Math.max(0, Math.min(1, vol));
    if (this.musicAudio) this.musicAudio.volume = this.musicVolume;
  }
  playSfx(sfxKey) {
    const src = SOUND_EFFECTS[sfxKey];
    if (!src || this.sfxVolume === 0) return;
    try { const a = new Audio(src); a.volume = this.sfxVolume; a.play().catch(() => {}); } catch (e) {}
  }
  playMusic(trackKey) {
    const src = MUSIC_TRACKS[trackKey];
    if (this.currentMusic === trackKey) return;
    this.stopMusic(); this.currentMusic = trackKey;
    if (!src || this.musicVolume === 0) return;
    try { this.musicAudio = new Audio(src); this.musicAudio.loop = true; this.musicAudio.volume = this.musicVolume; this.musicAudio.play().catch(() => {}); } catch (e) {}
  }
  stopMusic() { if (this.musicAudio) { this.musicAudio.pause(); this.musicAudio = null; } this.currentMusic = null; }
  getState() { return { sfxVolume: this.sfxVolume, musicVolume: this.musicVolume }; }
  loadState(s) { if (s) { this.setSfxVolume(s.sfxVolume ?? 0.75); this.setMusicVolume(s.musicVolume ?? 0.50); } }
}

// ============================================================================
// PROCEDURAL GENERATION ENGINE
// ============================================================================
class WhiskeyEngine {
  constructor(gameSeed = Date.now()) {
    this.gameSeed = gameSeed; this.brands = {}; this.bottleCache = {}; this.brandNames = []; this._initBrands();
  }
  _initBrands() {
    const rng = seededRandom(this.gameSeed);
    const numBrands = 8 + Math.floor(rng() * 8);
    const usedNames = new Set();
    for (let i = 0; i < numBrands; i++) {
      let name, attempts = 0;
      do { name = `${BRAND_PREFIXES[Math.floor(rng() * BRAND_PREFIXES.length)]} ${BRAND_SUFFIXES[Math.floor(rng() * BRAND_SUFFIXES.length)]}`; attempts++; } while (usedNames.has(name) && attempts < 50);
      if (usedNames.has(name)) continue;
      usedNames.add(name);
      const allRegions = ["American", "Canadian"];
      this.brands[name] = {
        region: allRegions[Math.floor(rng() * allRegions.length)], types: {},
        bottleShapeIdx: Math.floor(rng() * BOTTLE_SHAPES.length),
        bottleColor: BOTTLE_COLORS[Math.floor(rng() * BOTTLE_COLORS.length)],
        capColor: CAP_COLORS[Math.floor(rng() * CAP_COLORS.length)],
        labelColor: LABEL_COLORS[Math.floor(rng() * LABEL_COLORS.length)],
        labelAccent: LABEL_ACCENT_COLORS[Math.floor(rng() * LABEL_ACCENT_COLORS.length)],
      };
      this.brandNames.push(name);
    }
  }
  _getBrandRng(brandName, extra = "") { return seededRandom(hashString(brandName + extra + this.gameSeed)); }
  _generateMashbill(typeDef, rng) {
    const primaryPct = typeDef.mashbill.primary.min + Math.floor(rng() * (typeDef.mashbill.primary.max - typeDef.mashbill.primary.min + 1));
    let remaining = 100 - primaryPct;
    const secondaryGrains = [...typeDef.mashbill.secondary];
    const mashbill = { [typeDef.mashbill.primary.grain]: primaryPct };
    for (let i = 0; i < secondaryGrains.length; i++) {
      if (i === secondaryGrains.length - 1) { if (remaining > 0) mashbill[secondaryGrains[i]] = remaining; }
      else { const portion = Math.floor(rng() * (remaining + 1)); if (portion > 0) mashbill[secondaryGrains[i]] = portion; remaining -= portion; }
    }
    return mashbill;
  }
  _getOrCreateBrandType(brandName, typeName) {
    const brand = this.brands[brandName]; if (!brand) return null;
    if (brand.types[typeName]) return brand.types[typeName];
    const typeDef = WHISKEY_TYPES[typeName]; if (!typeDef || !typeDef.regionTags.includes(brand.region)) return null;
    brand.types[typeName] = { mashbill: this._generateMashbill(typeDef, this._getBrandRng(brandName, typeName)) };
    return brand.types[typeName];
  }
  _selectModifiers(typeDef, proof, age, rng) {
    const modifiers = []; if (rng() > 0.55) return modifiers;
    const available = typeDef.modifiers.filter(m => {
      if (m.requirements.minAge && age < m.requirements.minAge) return false;
      if (m.requirements.minProof && proof < m.requirements.minProof) return false;
      // Don't filter by exactProof here — BiB will force proof after selection
      if (m.requirements.specialMashbill) return false; return true;
    });
    if (available.length === 0) return modifiers;
    const first = available[Math.floor(rng() * available.length)]; modifiers.push(first.name);
    if (first.combinable && rng() > 0.7) {
      const second = available.filter(m => m.combinable && m.name !== first.name);
      if (second.length > 0) modifiers.push(second[Math.floor(rng() * second.length)].name);
    }
    return modifiers;
  }
  _selectRarity(age, year, rng, tierLevel = 1, rep = 0) {
    // Rarity influenced by age, release year, and store progression
    const currentYear = 2026;
    const yearsOld = currentYear - year; // how long ago it was released
    
    // Base score from age and release year
    let rarityScore = 0;
    rarityScore += Math.min(age, 20) * 2; // age contributes up to 40 points
    rarityScore += Math.min(yearsOld, 30) * 1.5; // older release years add up to 45 points
    rarityScore += rng() * 20; // random variance
    
    // Tier/rep gating: cap the max achievable rarity at lower tiers
    const tierCap = [30, 50, 70, 85, 95, 120][Math.min(tierLevel - 1, 5)]; // tier 1 caps low
    const repBonus = Math.min(rep / 100, 10); // small rep bonus
    rarityScore = Math.min(rarityScore, tierCap + repBonus);
    
    // Map score to rarity
    if (rarityScore >= 90) return "Unicorn";
    if (rarityScore >= 75) return "Legendary";
    if (rarityScore >= 55) return "Epic";
    if (rarityScore >= 38) return "Rare";
    if (rarityScore >= 22) return "Uncommon";
    return "Common";
  }
  _calculateBaseValue(age, proof, rarity, modifiers, yearKnown = true) {
    // Base value from characteristics
    let v = 15 + age * 5 + (proof - 80) * 0.3;
    // Rarity multiplier
    v *= ({ Common: 1, Uncommon: 1.8, Rare: 3.5, Epic: 7, Legendary: 18, Unicorn: 45 })[rarity] || 1;
    // Modifier bonuses
    if (modifiers.length > 0) v *= 1 + modifiers.length * 0.15;
    if (modifiers.includes("Barrel Proof")) v *= 1.25;
    if (modifiers.includes("Bottled-in-Bond")) v *= 1.1;
    if (modifiers.includes("Single Barrel")) v *= 1.2;
    if (modifiers.some(m => m.startsWith("Finished in"))) v *= 1.15;
    // Unknown year penalty: bottles with unknown year are worth less on the surface
    if (!yearKnown) v *= 0.55;
    return Math.round(v);
  }
  generateBottle(tierLevel = 1, rep = 0) {
    const rng = seededRandom(Date.now() + Math.random() * 100000);
    const brandName = this.brandNames[Math.floor(rng() * this.brandNames.length)];
    const brand = this.brands[brandName];
    const compatibleTypes = Object.keys(WHISKEY_TYPES).filter(t => WHISKEY_TYPES[t].regionTags.includes(brand.region));
    const typeName = compatibleTypes[Math.floor(rng() * compatibleTypes.length)];
    const typeDef = WHISKEY_TYPES[typeName];
    this._getOrCreateBrandType(brandName, typeName);
    const mashbill = { ...brand.types[typeName].mashbill };
    
    // Age is influenced by tier: lower tiers skew toward younger bottles
    const maxAgeForTier = Math.min(typeDef.age.max, typeDef.age.min + Math.floor((typeDef.age.max - typeDef.age.min) * (0.3 + tierLevel * 0.12)));
    const age = typeDef.age.min + Math.floor(rng() * (maxAgeForTier - typeDef.age.min + 1));
    const year = 2026 - age - Math.floor(rng() * 5);
    
    // Proof: lower tiers skew toward standard proofs
    const proofRange = typeDef.proof.max - typeDef.proof.min;
    const maxProofForTier = typeDef.proof.min + Math.floor(proofRange * (0.4 + tierLevel * 0.1));
    let proof = typeDef.proof.min + Math.floor(rng() * (Math.min(maxProofForTier, typeDef.proof.max) - typeDef.proof.min + 1));
    
    // Modifiers: lower tiers have fewer modifiers
    const modifierChance = 0.15 + tierLevel * 0.07; // tier 1: ~22%, tier 6: ~57%
    let modifiers = rng() < modifierChance ? this._selectModifiers(typeDef, proof, age, rng) : [];
    if (modifiers.includes("Bottled-in-Bond")) proof = 100;
    
    const modKey = modifiers.length > 0 ? modifiers.sort().join("|") : "base";
    const cacheKey = `${brandName}|${typeName}|${year}|${modKey}`;
    
    // Rarity based on age, year, tier
    const rarity = this._selectRarity(age, year, rng, tierLevel, rep);
    // True value (with year known)
    const trueValue = this._calculateBaseValue(age, proof, rarity, modifiers, true);
    
    const isSpecial = rng() > 0.95;
    let displayMashbill = mashbill;
    if (isSpecial) {
      displayMashbill = this._generateMashbill(typeDef, seededRandom(hashString(cacheKey + "special")));
      if (JSON.stringify(displayMashbill) !== JSON.stringify(mashbill) && !modifiers.some(m => !WHISKEY_TYPES[typeName].modifiers.find(md => md.name === m)?.combinable))
        modifiers = ["Special Release"];
    }
    const finishMods = modifiers.filter(m => m.startsWith("Finished in"));
    const otherMods = modifiers.filter(m => !m.startsWith("Finished in"));
    // Age statement: 3-6 is "Unstated", >6 gets added to name, <=2 shown on card only
    const ageStated = age > 6;
    const ageHidden = age >= 3 && age <= 6;
    const ageDisplay = ageHidden ? "Unstated" : `${age}yr`;
    const ageSuffix = ageStated ? ` ${age} Year` : "";
    const bottle = {
      id: `b_${Date.now()}_${Math.floor(Math.random()*10000)}`, brandName, typeName, year, age, proof,
      ageDisplay, ageStated,
      mashbill: displayMashbill, region: brand.region, modifiers, rarity, trueValue,
      value: trueValue,
      yearKnown: true,
      bottleShapeIdx: brand.bottleShapeIdx, bottleColor: brand.bottleColor, capColor: brand.capColor, labelColor: brand.labelColor, labelAccent: brand.labelAccent,
    };
    bottle.baseDisplayName = `${brandName} ${otherMods.length ? otherMods.join(" ") + " " : ""}${typeName}${finishMods.length ? " " + finishMods.join(" ") : ""}${ageSuffix}`;
    bottle.displayName = `${year} ${bottle.baseDisplayName}`;
    return bottle;
  }
  getEngineStats() {
    return { totalBrands: this.brandNames.length, cachedBottles: Object.keys(this.bottleCache).length,
      brandDetails: Object.entries(this.brands).map(([name, b]) => ({ name, region: b.region, types: Object.keys(b.types) })) };
  }
}

function BottleSVG({ bottle, size = 160 }) {
  const shapeFn = BOTTLE_SHAPES[bottle.bottleShapeIdx] || BOTTLE_SHAPES[0];
  const labelLines = [...bottle.brandName.split(" "), bottle.typeName];
  return (
    <svg width={size} height={size} viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg" style={{ filter: "drop-shadow(2px 4px 8px rgba(0,0,0,0.5))" }}>
      <g dangerouslySetInnerHTML={{ __html: shapeFn(bottle.bottleColor, bottle.capColor) }} />
      <rect x="33" y="72" width="34" height="40" rx="2" fill={bottle.labelColor} stroke={bottle.labelAccent} strokeWidth="1" />
      {labelLines.slice(0, 3).map((line, i) => (
        <text key={i} x="50" y={82 + i * 11} textAnchor="middle" fill={bottle.labelAccent} fontSize="6" fontFamily="serif" fontWeight={i === 0 ? "bold" : "normal"}>
          {line.length > 8 ? line.slice(0, 8) + "." : line}
        </text>
      ))}
      <rect x="34" y="110" width="32" height="36" rx="1" fill={bottle.bottleColor} opacity="0.15" />
    </svg>
  );
}

function tagStyle(bg) {
  return { display: "inline-block", padding: "2px 8px", borderRadius: "4px", fontSize: "10px", fontFamily: "monospace", letterSpacing: "0.5px", background: bg + "33", color: "#C4A882", border: `1px solid ${bg}66` };
}

function BottleCard({ bottle, showRarity = false, onClick, yearEstimate = null, hideValue = false, purchasePrice = null }) {
  const rarityDef = RARITIES.find(r => r.name === bottle.rarity);
  const borderStyle = showRarity
    ? rarityDef?.gradient ? { borderImage: `${rarityDef.gradient} 1`, borderWidth: "3px", borderStyle: "solid" } : { border: `3px solid ${rarityDef?.color || "#6B7280"}` }
    : { border: "2px solid #3a3028" };
  return (
    <div onClick={onClick} style={{ ...borderStyle, borderRadius: "12px", background: "linear-gradient(145deg, #3d3229, #4a3f33)", padding: "16px", cursor: onClick ? "pointer" : "default", width: "280px", transition: "transform 0.2s, box-shadow 0.2s", boxShadow: "0 4px 12px rgba(0,0,0,0.4)", flexShrink: 0 }}
      onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-4px)"; e.currentTarget.style.boxShadow = "0 8px 24px rgba(0,0,0,0.6)"; }}
      onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 12px rgba(0,0,0,0.4)"; }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: "12px", background: "radial-gradient(ellipse at center, rgba(255,248,230,0.08) 0%, transparent 70%)", borderRadius: "8px", padding: "8px 0" }}>
        <BottleSVG bottle={bottle} size={140} />
      </div>
      <h3 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "15px", color: "#F5E6CA", margin: "0 0 10px 0", lineHeight: 1.3, textAlign: "center", minHeight: "40px" }}>{bottle.displayName}</h3>
      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px", marginBottom: "10px", justifyContent: "center" }}>
        <span style={tagStyle("#8B4513")}>{bottle.region}</span>
        <span style={tagStyle("#704214")}>{bottle.typeName}</span>
        {bottle.modifiers.map((m, i) => <span key={i} style={tagStyle("#5B3A29")}>{m}</span>)}
        {showRarity && <span style={{ ...tagStyle(rarityDef?.color || "#6B7280"), ...(rarityDef?.gradient ? { background: rarityDef.gradient, color: "#fff" } : {}) }}>{bottle.rarity}</span>}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px", fontSize: "12px", color: "#C4A882", fontFamily: "'JetBrains Mono', 'Courier New', monospace" }}>
        <div><span style={{ color: "#8B7355" }}>PROOF</span> {bottle.proof}</div>
        <div><span style={{ color: "#8B7355" }}>AGE</span> {bottle.ageDisplay || `${bottle.age}yr`}</div>
        <div style={{ gridColumn: "1 / -1" }}>
          <span style={{ color: "#8B7355" }}>YEAR</span>{" "}
          {bottle.yearKnown ? bottle.year : yearEstimate ? (
            yearEstimate.exact ? <span style={{ color: "#D4AF37" }}>{yearEstimate.min} (verified)</span> : <span style={{ color: "#B8860B" }}>~{yearEstimate.min}–{yearEstimate.max}</span>
          ) : "Unknown"}
        </div>
      </div>
      <div style={{ marginTop: "10px" }}>
        <div style={{ fontSize: "10px", color: "#8B7355", marginBottom: "4px", fontFamily: "monospace", letterSpacing: "1px" }}>MASHBILL</div>
        <div style={{ display: "flex", borderRadius: "4px", overflow: "hidden", height: "16px" }}>
          {Object.entries(bottle.mashbill).filter(([,v]) => v > 0).sort(([,a],[,b]) => b - a).map(([grain, pct]) => {
            const gc = { Corn: "#D4A017", Rye: "#A0522D", Barley: "#DAA520", Wheat: "#DEB887" };
            return <div key={grain} style={{ width: `${pct}%`, background: gc[grain] || "#888", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "8px", color: "#1a1a1a", fontWeight: "bold", fontFamily: "monospace", whiteSpace: "nowrap", overflow: "hidden" }} title={`${grain}: ${pct}%`}>{pct >= 15 ? `${grain.slice(0,3)} ${pct}%` : pct >= 8 ? `${pct}` : ""}</div>;
          })}
        </div>
        <div style={{ display: "flex", gap: "8px", marginTop: "4px", flexWrap: "wrap" }}>
          {Object.entries(bottle.mashbill).filter(([,v]) => v > 0).sort(([,a],[,b]) => b - a).map(([grain, pct]) => {
            const gc = { Corn: "#D4A017", Rye: "#A0522D", Barley: "#DAA520", Wheat: "#DEB887" };
            return <span key={grain} style={{ fontSize: "9px", color: gc[grain] || "#888", fontFamily: "monospace" }}>{grain} {pct}%</span>;

      </div>

        <div style={{ marginTop: "12px", textAlign: "center", fontSize: "18px", fontFamily: "'Playfair Display', Georgia, serif", fontWeight: "bold", color: purchasePrice != null ? "#C4A882" : "#D4AF37" }}>
          {purchasePrice != null ? `Paid: $${purchasePrice.toLocaleString()}` : `$${bottle.value.toLocaleString()}`}
        </div>
      )}
    </div>
  );
}

function BrandPanel({ engine }) {

              style={{ background: "#1a1510", borderRadius: "8px", padding: "10px 14px", cursor: "pointer", border: expanded === b.name ? "1px solid #D4AF37" : "1px solid #2a2218", transition: "border-color 0.2s" }}>

// ============================================================================
// OPTIONS MENU
// ============================================================================
const volBtnStyle = { width: "32px", height: "32px", border: "1px solid #3a3028", borderRadius: "6px", background: "#1a1510", color: "#D4AF37", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", padding: 0 };
const menuBtnStyle = { padding: "14px 32px", background: "linear-gradient(145deg, #D4AF37, #B8960C)", border: "none", borderRadius: "8px", color: "#1a1a1a", fontSize: "14px", fontWeight: "bold", fontFamily: "'Playfair Display', Georgia, serif", cursor: "pointer", letterSpacing: "1px", boxShadow: "0 4px 12px rgba(212,175,55,0.3)", transition: "all 0.2s" };

function OptionsMenu({ audio, onClose, onSfxChange, onMusicChange }) {
  const steps = [0, 0.25, 0.50, 0.75, 1.0];
  const [sfxVol, setSfxVol] = useState(audio.sfxVolume);
  const [musVol, setMusVol] = useState(audio.musicVolume);
  const handleSfx = (v) => { setSfxVol(v); onSfxChange(v); };
  const handleMus = (v) => { setMusVol(v); onMusicChange(v); };
  const VolControl = ({ label, value, onChange }) => (
    <div style={{ marginBottom: "20px" }}>
      <div style={{ fontFamily: "monospace", fontSize: "12px", color: "#8B7355", letterSpacing: "1px", marginBottom: "10px" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
        <button onClick={() => { const i = steps.indexOf(value); if (i > 0) onChange(steps[i - 1]); }} style={volBtnStyle} disabled={value <= 0}>
          <svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="2" fill="currentColor" /></svg>
        </button>
        <div style={{ flex: 1, height: "8px", background: "#1a1510", borderRadius: "4px", overflow: "hidden" }}>
          <div style={{ width: `${value * 100}%`, height: "100%", background: "linear-gradient(90deg, #D4AF37, #B8960C)", borderRadius: "4px", transition: "width 0.2s" }} />
        </div>
        <button onClick={() => { const i = steps.indexOf(value); if (i < steps.length - 1) onChange(steps[i + 1]); }} style={volBtnStyle} disabled={value >= 1}>
          <svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="2" fill="currentColor" /><rect x="7" y="3" width="2" height="10" fill="currentColor" /></svg>
        </button>
        <span style={{ fontFamily: "monospace", fontSize: "14px", color: "#D4AF37", width: "40px", textAlign: "right" }}>{Math.round(value * 100)}%</span>
      </div>
    </div>
  );
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
      <div style={{ background: "linear-gradient(145deg, #261f18, #1c1714)", borderRadius: "16px", padding: "32px", border: "2px solid #3a3028", width: "400px", maxWidth: "90vw" }}>
        <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "#D4AF37", margin: "0 0 24px 0", fontSize: "24px", textAlign: "center" }}>Options</h2>
        <VolControl label="SOUND EFFECTS" value={sfxVol} onChange={handleSfx} />
        <VolControl label="MUSIC" value={musVol} onChange={handleMus} />
        <div style={{ textAlign: "center", marginTop: "24px" }}><button onClick={onClose} style={menuBtnStyle}>BACK</button></div>
      </div>
    </div>
  );
}

// SAVE SLOT SCREEN
// ============================================================================
function SaveSlotScreen({ saves, onSelectSlot, onDeleteSlot, onBack }) {
  const [confirmDelete, setConfirmDelete] = useState(null);
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "16px", padding: "40px 20px" }}>
      <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "#D4AF37", fontSize: "28px", margin: "0 0 8px 0" }}>Save Files</h2>
      <p style={{ color: "#8B7355", fontSize: "13px", marginBottom: "16px", fontFamily: "monospace" }}>Select a slot to continue or start a new game</p>
      {saves.map((save, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: "12px", width: "100%", maxWidth: "460px" }}>
          <button onClick={() => onSelectSlot(i)}
            style={{ flex: 1, padding: "16px 20px", background: save ? "linear-gradient(145deg, #2a2218, #1a1510)" : "linear-gradient(145deg, #1a1510, #120e0a)",
              border: save ? "2px solid #3a3028" : "2px dashed #3a302860", borderRadius: "12px", cursor: "pointer", textAlign: "left", color: "#C4A882", transition: "border-color 0.2s" }}
            onMouseEnter={e => e.currentTarget.style.borderColor = "#D4AF37"}
            onMouseLeave={e => e.currentTarget.style.borderColor = save ? "#3a3028" : "#3a302860"}>
            <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "16px", color: "#F5E6CA", marginBottom: "4px" }}>
              {save ? save.storeName : `— Empty Slot ${i + 1} —`}
            </div>
            {save && <div style={{ fontFamily: "monospace", fontSize: "11px", color: "#8B7355" }}>
              Day {save.day || 1} · {STORE_TIERS[(save.storeTier || 1) - 1].name} · Cash: ${(save.cash ?? 0).toLocaleString()} · Bottles: {save.inventory.length}
            </div>}
          </button>
          {save && (
            <div>
              {confirmDelete === i ? (
                <div style={{ display: "flex", gap: "6px" }}>

                  onMouseEnter={e => e.currentTarget.style.color = "#C0392B"} onMouseLeave={e => e.currentTarget.style.color = "#8B7355"} title="Delete save">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                    <path d="M3 6h18" /><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2" /><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" />
                  </svg>
                </button>
              )}
            </div>
          )}
        </div>
      ))}
      <button onClick={onBack} style={{ ...menuBtnStyle, marginTop: "16px", background: "transparent", border: "2px solid #3a302860", color: "#8B7355" }}>BACK</button>
    </div>
  );
}

  useEffect(() => {

      setSaves(p => { const n = [...p]; n[activeSlot] = { storeName, storeTier, inventory, cash, reputation, day, missedRent, playerSkills, codex, gameSeed: engineRef.current.gameSeed, engineBrands: engineRef.current.brands, engineBrandNames: engineRef.current.brandNames, engineBottleCache: engineRef.current.bottleCache }; return n; });

  }, [screen, activeSlot, storeName, storeTier, inventory, cash, reputation, day, missedRent, playerSkills, codex]);

  const engine = engineRef.current;
  const tierData = ECONOMY_TIERS[storeTier - 1];
  const shelfLimit = tierData.shelfLimit;
  const canAfford = (price) => cash >= price;
  const shelfFull = inventory.length >= shelfLimit;

  // ---- PLAYER SKILLS ----
  const SKILL_TIERS_LABEL = ["None", "Novice", "Apprentice", "Journeyman", "Expert", "Master"];
  const SKILL_COSTS = [0, 200, 800, 2500, 8000, 25000];
  const YEAR_EST_ACCURACY = [null, 12, 7, 4, 2, 0];

  const estimateYear = useCallback((bottle) => {
    const level = playerSkills.yearEstimation;
    if (level === 0 || bottle.yearKnown) return null;
    const accuracy = YEAR_EST_ACCURACY[level];
    if (accuracy === 0) return { min: bottle.year, max: bottle.year, exact: true };
    return { min: bottle.year - accuracy, max: Math.min(bottle.year + accuracy, 2026), exact: false };
  }, [playerSkills]);

  // ---- CUSTOMER PERSONALITY SYSTEM (hidden from player) ----
  const PERSONALITIES = [
    { id: "desperate", maxRounds: 2, flexibility: 0.35, knowledge: "low",
      descriptors: ["A nervous-looking person fidgeting with their coat", "Someone who seems to be in a rush, glancing at the door", "A jittery individual clutching the bottle tightly"],
      sellerLines: ["I, uh... I need to move this quickly.", "Look, just make me an offer.", "I don't really know much about this one, but I need the cash."],

      descriptors: ["A relaxed person browsing casually", "Someone in jeans and a flannel, looking around with mild curiosity", "A friendly face who wandered in off the street"],
      sellerLines: ["Found this cleaning out the attic — any idea what it's worth?", "My uncle left me a bunch of these. Interested?", "Honestly, I'm not sure what I've got here."],
      buyerLines: ["That looks nice, what are you asking?", "Hmm, I could see that on my shelf.", "What kind of deal can you give me?"],

    { id: "shrewd", maxRounds: 4, flexibility: 0.15, knowledge: "high",
      descriptors: ["A sharp-eyed individual who examined your shelves before approaching", "Someone in a well-pressed shirt who seems to know their way around", "A deliberate person who has been studying the bottle carefully"],
      sellerLines: ["I've been holding onto this one for the right buyer.", "I know the going rate on these.", "This is a solid bottle — I'm looking for a fair price.", "Thought you might want this for your collection.", "I picked this up a while back. Interested?"],
      buyerLines: ["I've done my homework on this one.", "I know what these go for.", "That's a bit steep for what it is.", "What can you tell me about this bottle?", "I've been looking around for one of these."],
      counterLines: ["The market says it's closer to", "We both know the fair price is around", "I'd say"],
      walkLine: "Not at that price. I'll find a better deal." },
    { id: "collector", maxRounds: 5, flexibility: 0.20, knowledge: "high",
      descriptors: ["A well-dressed individual carrying a leather notebook", "Someone who carefully inspected the label with a practiced eye", "A distinguished person who asked very specific questions about your stock"],
      sellerLines: ["This has been in my personal collection. I know its provenance.", "I'm thinning the collection — only parting with select bottles.", "I acquired this at auction years ago.", "I've enjoyed having this on my shelf, but it's time.", "This one's been sitting in my cabinet for a while."],
      buyerLines: ["I've been searching for exactly this expression.", "This would fill a gap in my collection nicely.", "I appreciate what you have here.", "I'm always on the lookout for interesting bottles.", "Mind if I take a closer look?"],
      counterLines: ["For a bottle of this caliber, I'd suggest", "I think a fair meeting point would be", "Considering the provenance,"],
      walkLine: "I'll keep looking. The right deal will come along." },
    { id: "impatient", maxRounds: 2, flexibility: 0.20, knowledge: "medium",
      descriptors: ["Someone tapping their foot impatiently at the counter", "A person who glanced at their phone twice before speaking", "A hurried individual who barely looked around before approaching you"],
      sellerLines: ["Quick — you want this or not?", "I've got places to be. What'll you give me?", "Don't have time to shop this around."],
      buyerLines: ["How much? I'm in a hurry.", "Give me a price, I don't have all day.", "Wrap it up quick."],
      counterLines: ["Last chance —", "Final offer:", "Take it or leave it —"],
      walkLine: "Too slow. I'm out." },
    { id: "friendly", maxRounds: 4, flexibility: 0.30, knowledge: "medium",
      descriptors: ["A warm, smiling person who complimented your shop on the way in", "Someone who shook your hand and introduced themselves", "A cheerful person who seems genuinely happy to be here"],
      sellerLines: ["Heard great things about your shop! Thought you'd appreciate this.", "A friend recommended I come here with this.", "I'd love to find this a good home.", "Just picked this up and thought of you.", "Wondering if this might interest you."],
      buyerLines: ["I trust your judgment on this.", "What would you recommend for someone like me?", "I'm happy to pay a fair price.", "I've been meaning to stop by here.", "Looking for something nice — what catches your eye?"],
      counterLines: ["You're good people — how about", "I think we can find a fair number around", "What about"],
      walkLine: "Maybe next time, friend." },
  ];

  // ---- CUSTOMER QUEUE SYSTEM ----
  const [customerQueue, setCustomerQueue] = useState([]);
  const [customerIndex, setCustomerIndex] = useState(0);
  const [currentCustomer, setCurrentCustomer] = useState(null);
  const [dayStarted, setDayStarted] = useState(false);
  const [selectedSellBottle, setSelectedSellBottle] = useState(null);

  // ---- NEGOTIATION STATE ----
  const [negotiating, setNegotiating] = useState(false);
  const [negRound, setNegRound] = useState(0);
  const [playerOffer, setPlayerOffer] = useState(0);
  const [customerOffer, setCustomerOffer] = useState(0); // their current counter
  const [negResult, setNegResult] = useState(null); // null | "accepted" | "rejected" | "countered" | "walked"
  const [negHistory, setNegHistory] = useState([]);
  const [yearQuestioned, setYearQuestioned] = useState(false); // per-customer flag // [{who, amount, text}]

  const FIRST_NAMES = ["James","Mary","Robert","Linda","Michael","Sarah","William","Karen","David","Lisa","Thomas","Nancy","John","Betty","Daniel","Sandra","Paul","Ruth","Mark","Helen","George","Laura","Frank","Anna","Ed","Carol","Tony","Marie","Victor","Grace"];
  const LAST_NAMES = ["Smith","Johnson","Brown","Davis","Wilson","Moore","Taylor","Anderson","Thomas","Harris","Martin","Garcia","Lee","Clark","Lewis","Hall","Young","King","Wright","Hill","Scott","Green","Baker","Adams","Reed","Cook","Morgan","Bell","Ross","Wood"];

  const generateCustomerName = useCallback((rng) => {
    return `${FIRST_NAMES[Math.floor(rng() * FIRST_NAMES.length)]} ${LAST_NAMES[Math.floor(rng() * LAST_NAMES.length)]}`;
  }, []);

  const BUYER_REQUESTS = [
    { text: "I'm looking for a good Bourbon.", filter: b => b.typeName === "Bourbon" },
    { text: "Got any Rye whiskey?", filter: b => b.typeName === "Rye" },
    { text: "I want something aged at least 10 years.", filter: b => b.age >= 10 },
    { text: "Looking for something high proof.", filter: b => b.proof >= 110 },
    { text: "I need a gift — something special.", filter: b => b.modifiers.length > 0 },
    { text: "What's the oldest bottle you have?", filter: b => b.age >= 8 },
    { text: "I'm after anything Bottled-in-Bond.", filter: b => b.modifiers.includes("Bottled-in-Bond") },
    { text: "Show me what you've got — I'm open to anything.", filter: () => true },
    { text: "I'm a barrel proof fanatic. Got any?", filter: b => b.modifiers.includes("Barrel Proof") },
    { text: "Something smooth — nothing too hot.", filter: b => b.proof <= 100 },
    { text: "I'm looking for a Single Barrel.", filter: b => b.modifiers.includes("Single Barrel") },
    { text: "Any barrel-finished whiskeys in stock?", filter: b => b.modifiers.some(m => m.startsWith("Finished in")) },
  ];

  const [dayEvent, setDayEvent] = useState(null); // null | { type, desc, ... }

  const DAY_EVENTS = [
    { type: "hotTip", chance: 0.08, label: "HOT TIP",
      descs: ["Word on the street: a serious collector is hunting for a specific bottle today.", "A wealthy client called ahead — they're willing to pay top dollar for the right bottle.", "A private auction fell through. The buyer is coming to you instead."] },
    { type: "estateSale", chance: 0.06, label: "ESTATE SALE",
      descs: ["A local estate is being liquidated — expect sellers with bottles priced to move.", "A family clearing out a collection is sending people your way today.", "An old bar closed down — their backstock is hitting the streets."] },
  ];

  const generateDayQueue = useCallback(() => {
    if (!engine) return [];
    const rng = seededRandom(Date.now() + day * 777);
    const [minC, maxC] = tierData.customersPerDay;
    let numCustomers = minC + Math.floor(rng() * (maxC - minC + 1));
    const queue = [];

    // Roll for day event
    let event = null;
    for (const evt of DAY_EVENTS) {
      if (rng() < evt.chance) {
        event = { ...evt, desc: evt.descs[Math.floor(rng() * evt.descs.length)] };
        break;
      }
    }
    if (event?.type === "estateSale") numCustomers += 2; // more customers on estate sale days

    for (let i = 0; i < numCustomers; i++) {
      const name = generateCustomerName(rng);
      const personality = PERSONALITIES[Math.floor(rng() * PERSONALITIES.length)];
      const descriptor = personality.descriptors[Math.floor(rng() * personality.descriptors.length)];
      // Estate sale days skew heavily toward sellers
      const sellerChance = event?.type === "estateSale" ? 0.80 : 0.55;
      const isSeller = inventory.length === 0 ? true : rng() < sellerChance;

      if (isSeller) {
        const bottle = engine.generateBottle(storeTier, reputation);
        const yearKnownChance = personality.knowledge === "low" ? 0.15 : personality.knowledge === "medium" ? 0.55 : 0.85;
        const yearKnown = rng() < yearKnownChance;
        bottle.yearKnown = yearKnown;
        if (!yearKnown) {
          bottle.value = engine._calculateBaseValue(bottle.age, bottle.proof, bottle.rarity, bottle.modifiers, false);
          bottle.displayName = bottle.baseDisplayName;
        } else {
          bottle.displayName = `${bottle.year} ${bottle.baseDisplayName}`;
        }

        // Hidden gem: low-info sellers sometimes don't know what they have
        // Their asking price can be dramatically lower than true value
        let isHiddenGem = false;
        if (personality.knowledge === "low" && rng() < 0.18) {
          isHiddenGem = true;
        }
        // Estate sale: sellers ask even lower
        const estateMult = event?.type === "estateSale" ? 0.6 + rng() * 0.2 : 1;
        const gemMult = isHiddenGem ? 0.25 + rng() * 0.25 : 1; // 25-50% of value

        const effectiveValue = bottle.value * estateMult * gemMult;
        const minAccept = Math.round(effectiveValue * (0.35 + personality.flexibility * 0.4 + rng() * 0.2));
        const askingPrice = Math.max(Math.round(effectiveValue * (0.75 + rng() * 0.35)), Math.round(minAccept * 1.1));
        const openLine = personality.sellerLines[Math.floor(rng() * personality.sellerLines.length)];
        queue.push({ type: "seller", name, personality, descriptor, bottle, minAccept, askingPrice, openLine, isHiddenGem });
      } else {
        const validRequests = BUYER_REQUESTS.filter(r => inventory.some(r.filter));
        const request = validRequests.length > 0
          ? validRequests[Math.floor(rng() * validRequests.length)]
          : BUYER_REQUESTS[BUYER_REQUESTS.length - 1];
        const matching = inventory.filter(request.filter);
        const avgValue = matching.length > 0 ? matching.reduce((s, b) => s + b.value, 0) / matching.length : 50;
        const avgTrueValue = matching.length > 0 ? matching.reduce((s, b) => s + (b.trueValue || b.value), 0) / matching.length : 50;
        const valueBasis = personality.knowledge === "high" ? avgTrueValue : avgValue;
        // Hot tip: buyer pays 2-3x
        const hotTipMult = event?.type === "hotTip" && rng() < 0.35 ? 2 + rng() : 1;
        const budget = Math.round(valueBasis * (0.7 + rng() * 0.8) * hotTipMult);
        const maxPay = Math.round(budget * (1 + personality.flexibility * 0.5));
        const openingOffer = Math.round(budget * (0.5 + rng() * 0.3));
        const openLine = personality.buyerLines[Math.floor(rng() * personality.buyerLines.length)];
        const isHotTipBuyer = hotTipMult > 1;
        queue.push({ type: "buyer", name, personality, descriptor, request: request.text, filter: request.filter, budget, maxPay, openingOffer, openLine, knowsYear: personality.knowledge === "high", isHotTipBuyer });
      }
    }
    return { queue, event };
  }, [engine, day, tierData, inventory, generateCustomerName, storeTier, reputation]);

  // --- Negotiation logic ---
  const startNegotiation = useCallback((customer, targetPrice) => {
    setNegotiating(true);
    setNegRound(0);
    setNegResult(null);
    setNegHistory([]);
    if (customer.type === "seller") {
      setCustomerOffer(customer.askingPrice);
      // Default slider at ~60% of asking (within 25%-150% range)
      setPlayerOffer(Math.round(customer.askingPrice * 0.6));
      setNegHistory([{ who: "customer", amount: customer.askingPrice, text: `"I'm looking to get $${customer.askingPrice.toLocaleString()} for this."` }]);
    } else {
      setCustomerOffer(customer.openingOffer);
      // Default slider at ~130% of their opening offer
      setPlayerOffer(Math.round(customer.openingOffer * 1.3));
      setNegHistory([{ who: "customer", amount: customer.openingOffer, text: `"I'd offer $${customer.openingOffer.toLocaleString()} for that."` }]);
    }
  }, [inventory, selectedSellBottle]);

  // ---- CODEX TRACKING ----
  const trackBottleInCodex = useCallback((bottle) => {
    if (!bottle) return;
    const brand = bottle.brandName;
    // Build a key from type + modifiers to distinguish variants
    const modKey = bottle.modifiers.length > 0 ? bottle.modifiers.sort().join(" ") + " " : "";
    const variantKey = `${modKey}${bottle.typeName}`;

    setCodex(prev => {
      const next = { ...prev };
      if (!next[brand]) next[brand] = {};
      const existing = next[brand][variantKey];
      if (existing) {
        // Update year range if year is known
        if (bottle.yearKnown) {
          existing.minYear = Math.min(existing.minYear ?? bottle.year, bottle.year);
          existing.maxYear = Math.max(existing.maxYear ?? bottle.year, bottle.year);
        }
        // Track encounters
        existing.encounters = (existing.encounters || 1) + 1;
        // Keep latest stats (proof/age/mashbill from most recent encounter)
        existing.lastProof = bottle.proof;
        existing.lastAge = bottle.age;
        existing.lastMashbill = bottle.mashbill;
      } else {
        next[brand][variantKey] = {
          brandName: brand,
          typeName: bottle.typeName,
          modifiers: [...bottle.modifiers],
          variantKey,
          displayName: `${brand} ${variantKey}`,
          minYear: bottle.yearKnown ? bottle.year : null,
          maxYear: bottle.yearKnown ? bottle.year : null,
          lastProof: bottle.proof,
          lastAge: bottle.age,
          lastMashbill: bottle.mashbill,
          region: bottle.region,
          encounters: 1,
          // Visual identity
          bottleShapeIdx: bottle.bottleShapeIdx,
          bottleColor: bottle.bottleColor,
          capColor: bottle.capColor,
          labelColor: bottle.labelColor,
          labelAccent: bottle.labelAccent,
        };
      }
      return next;
    });
  }, []);

  const trackPriceInCodex = useCallback((bottle, dealType, price) => {
    if (!bottle) return;
    const brand = bottle.brandName;
    const modKey = bottle.modifiers.length > 0 ? bottle.modifiers.sort().join(" ") + " " : "";
    const variantKey = `${modKey}${bottle.typeName}`;
    const yearKey = bottle.yearKnown ? String(bottle.year) : "unknown";

    setCodex(prev => {
      const next = { ...prev };
      if (!next[brand] || !next[brand][variantKey]) return next; // must already be tracked
      const entry = next[brand][variantKey];
      if (!entry.priceHistory) entry.priceHistory = {};
      if (!entry.priceHistory[yearKey]) entry.priceHistory[yearKey] = {};
      const yh = entry.priceHistory[yearKey];

      if (dealType === "buy") {
        yh.minBuy = yh.minBuy != null ? Math.min(yh.minBuy, price) : price;
        yh.maxBuy = yh.maxBuy != null ? Math.max(yh.maxBuy, price) : price;
      } else {
        yh.minSell = yh.minSell != null ? Math.min(yh.minSell, price) : price;
        yh.maxSell = yh.maxSell != null ? Math.max(yh.maxSell, price) : price;
      }
      return next;
    });
  }, []);

  const submitOffer = useCallback(() => {
    if (!currentCustomer || !negotiating) return;
    const c = currentCustomer;
    const p = c.personality;
    const round = negRound + 1;

    if (c.type === "seller") {
      // Player is offering to BUY at playerOffer. Seller wants at least minAccept.
      if (playerOffer >= c.askingPrice) {
        // Accepted immediately — overpaid
        setNegResult("accepted");
        setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"Deal! Pleasure doing business."` }]);
      } else if (playerOffer >= c.minAccept) {
        // In acceptable range — chance of accept scales with how close to asking
        const ratio = (playerOffer - c.minAccept) / (c.askingPrice - c.minAccept);
        const acceptChance = 0.2 + ratio * 0.7;
        if (Math.random() < acceptChance || round >= p.maxRounds) {
          setNegResult("accepted");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"...Alright, you've got a deal."` }]);
        } else {
          // Counter: move toward player's offer
          const newCounter = Math.round(customerOffer - (customerOffer - playerOffer) * (0.3 + p.flexibility * 0.3));
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${p.counterLines[Math.floor(Math.random() * p.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      } else {
        // Below minimum
        if (round >= p.maxRounds) {
          setNegResult("walked");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: null, text: `"${p.walkLine}"` }]);
        } else {
          // Counter more firmly
          const newCounter = Math.round(customerOffer - (customerOffer - c.minAccept) * 0.2);
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${p.counterLines[Math.floor(Math.random() * p.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      }
    } else {
      // Player is SELLING at playerOffer. Buyer will pay up to maxPay.
      if (playerOffer <= c.openingOffer) {
        // Accepted immediately — undersold
        setNegResult("accepted");
        setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"Sold! That's a great price."` }]);
      } else if (playerOffer <= c.maxPay) {
        const ratio = (c.maxPay - playerOffer) / (c.maxPay - c.openingOffer);
        const acceptChance = 0.15 + ratio * 0.7;
        if (Math.random() < acceptChance || round >= p.maxRounds) {
          setNegResult("accepted");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"...Fine, I'll take it."` }]);
        } else {
          const newCounter = Math.round(customerOffer + (playerOffer - customerOffer) * (0.3 + p.flexibility * 0.3));
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${p.counterLines[Math.floor(Math.random() * p.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      } else {
        if (round >= p.maxRounds) {
          setNegResult("walked");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: null, text: `"${p.walkLine}"` }]);
        } else {
          const newCounter = Math.round(customerOffer + (c.maxPay - customerOffer) * 0.25);
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${p.counterLines[Math.floor(Math.random() * p.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      }
    }
    setNegRound(round);
  }, [currentCustomer, negotiating, negRound, playerOffer, customerOffer, inventory, selectedSellBottle]);

  const acceptCounter = useCallback(() => {
    if (!currentCustomer) return;
    setPlayerOffer(customerOffer);
    setNegResult("accepted");
    setNegHistory(prev => [...prev, { who: "player", amount: customerOffer, text: `You accept $${customerOffer.toLocaleString()}` }, { who: "customer", amount: customerOffer, text: `"Deal!"` }]);
  }, [currentCustomer, customerOffer]);

  const advanceToNextCustomer = useCallback(() => {
    const nextIdx = customerIndex + 1;
    setNegotiating(false); setNegResult(null); setSelectedSellBottle(null); setYearQuestioned(false);
    if (nextIdx < customerQueue.length) {
      const nextCustomer = customerQueue[nextIdx];
      setCustomerIndex(nextIdx);
      setCurrentCustomer(nextCustomer);
      // Track seller bottles in codex when encountered
      if (nextCustomer.type === "seller" && nextCustomer.bottle) trackBottleInCodex(nextCustomer.bottle);
      audio.playSfx("customerEnter");
    } else {
      setCurrentCustomer(null);
    }
  }, [customerIndex, customerQueue, audio, trackBottleInCodex]);

  const finalizeDeal = useCallback(() => {
    if (!currentCustomer || negResult !== "accepted") return;
    const finalPrice = negHistory[negHistory.length - 1]?.amount || playerOffer;
    if (currentCustomer.type === "seller") {
      if (!canAfford(finalPrice) || shelfFull) return;
      const boughtBottle = { ...currentCustomer.bottle, purchasePrice: finalPrice };
      setCash(prev => prev - finalPrice);
      setDailyLog(prev => [...prev, { type: "buy", desc: boughtBottle.displayName, amount: -finalPrice }]);
      setInventory(p => [boughtBottle, ...p]);
      setReputation(prev => prev + (finalPrice < currentCustomer.bottle.trueValue * 0.7 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
      // Track buy price in codex
      trackPriceInCodex(boughtBottle, "buy", finalPrice);
      audio.playSfx("buySuccess");
    } else {
      const bottle = inventory.find(b => b.id === selectedSellBottle);
      if (!bottle) return;
      setCash(prev => prev + finalPrice);
      setDailyLog(prev => [...prev, { type: "sell", desc: bottle.displayName, amount: finalPrice }]);
      setInventory(p => p.filter(b => b.id !== selectedSellBottle));
      setReputation(prev => prev + (finalPrice > (bottle.purchasePrice || 0) * 1.3 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
      // Track sell price in codex
      trackPriceInCodex(bottle, "sell", finalPrice);
      // Also track encounter for buyer-side bottles
      trackBottleInCodex(bottle);
      audio.playSfx("sellSuccess");
    }
    setNegotiating(false);
    setNegResult(null);
    setSelectedSellBottle(null);
    advanceToNextCustomer();
  }, [currentCustomer, negResult, negHistory, playerOffer, shelfFull, inventory, selectedSellBottle, audio, advanceToNextCustomer, trackBottleInCodex]);

  const walkAway = useCallback(() => {
    setNegotiating(false);
    setNegResult(null);
    audio.playSfx("pass");
    advanceToNextCustomer();
  }, [audio, advanceToNextCustomer]);

  const handleStartDay = useCallback(() => {
    const { queue, event } = generateDayQueue();
    setDayEvent(event);
    setCustomerQueue(queue);
    setCustomerIndex(0);
    const first = queue.length > 0 ? queue[0] : null;
    setCurrentCustomer(first);
    if (first && first.type === "seller" && first.bottle) trackBottleInCodex(first.bottle);
    setDayStarted(true);
    setSelectedSellBottle(null);
    setNegotiating(false);
    setNegResult(null);
    audio.playSfx("buttonClick");
  }, [generateDayQueue, audio, trackBottleInCodex]);

  const handlePass = useCallback(() => {
    audio.playSfx("pass");
    setNegotiating(false); setNegResult(null);
    advanceToNextCustomer();
  }, [audio, advanceToNextCustomer]);

  // Upgrade store
  const handleUpgrade = useCallback(() => {
    if (storeTier >= 6) return;
    const nextTier = ECONOMY_TIERS[storeTier];
    if (cash < nextTier.upgradeCost || reputation < nextTier.repRequired) return;
    setCash(prev => prev - nextTier.upgradeCost);
    setStoreTier(prev => prev + 1);
    setDailyLog(prev => [...prev, { type: "upgrade", desc: `Upgraded to ${STORE_TIERS[storeTier].name}`, amount: -nextTier.upgradeCost }]);
    audio.playSfx("storeUpgrade");
  }, [storeTier, cash, reputation, audio]);

  // End of day / Rent system
  const handleEndDay = useCallback(() => {
    const revenue = dailyLog.filter(l => l.amount > 0).reduce((s, l) => s + l.amount, 0);
    const expenses = dailyLog.filter(l => l.amount < 0).reduce((s, l) => s + Math.abs(l.amount), 0);
    const deals = dailyLog.filter(l => l.type === "buy" || l.type === "sell").length;
    const summary = { revenue, expenses, profit: revenue - expenses, deals, dayNum: day,
      customersSeen: customerIndex + (currentCustomer ? 1 : 0), customersTotal: customerQueue.length };

    const isRentDay = day > 0 && day % 7 === 0;
    if (isRentDay) {
      const rent = tierData.weeklyRent;
      if (cash >= rent) {
        setCash(prev => prev - rent);
        summary.rentPaid = rent;
        summary.profit -= rent;
      } else {
        const newMissed = missedRent + 1;
        setMissedRent(newMissed);
        summary.rentMissed = true;
        summary.missedCount = newMissed;
        if (newMissed >= MAX_MISSED_RENT) { summary.gameOver = true; setGameOver(true); }
      }
    }

    setShowDaySummary(summary);
    setDay(prev => prev + 1);
    setDailyLog([]);
    setDayStarted(false);
    setCurrentCustomer(null);
    setCustomerQueue([]);
    setCustomerIndex(0);
    setSelectedSellBottle(null);
    setNegotiating(false);
    setNegResult(null);
    setDayEvent(null);
    setYearQuestioned(false);
  }, [day, dailyLog, cash, tierData, missedRent, customerIndex, currentCustomer, customerQueue]);

  const closeDaySummary = useCallback(() => { setShowDaySummary(null); }, []);

  const filteredInventory = inventory.filter(b => filterType === "All" || b.typeName === filterType).sort((a, b) => {
    if (sortBy === "value") return b.value - a.value; if (sortBy === "age") return b.age - a.age;
    if (sortBy === "proof") return b.proof - a.proof;
    if (sortBy === "rarity") { const o = RARITIES.map(r => r.name); return o.indexOf(b.rarity) - o.indexOf(a.rarity); } return 0;
  });
  const totalValue = inventory.reduce((s, b) => s + b.value, 0);

  return (
    <div style={{ minHeight: "100vh", background: "linear-gradient(170deg, #0d0a07 0%, #1a1410 40%, #0d0a07 100%)", color: "#C4A882", fontFamily: "'Libre Baskerville', 'Times New Roman', serif", padding: 0 }}>

      {showOptions && <OptionsMenu audio={audio} onClose={() => { setShowOptions(false); audio.playSfx("buttonClick"); }}
        onSfxChange={v => { audio.setSfxVolume(v); audio.playSfx("buttonClick"); }} onMusicChange={v => audio.setMusicVolume(v)} />}

      {/* Day Summary Modal */}
      {showDaySummary && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100 }}>
          <div style={{ background: "linear-gradient(145deg, #261f18, #1c1714)", borderRadius: "16px", padding: "32px", border: "2px solid #3a3028", width: "420px", maxWidth: "90vw", textAlign: "center" }}>
            <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "#D4AF37", margin: "0 0 4px 0", fontSize: "24px" }}>
              End of Day {showDaySummary.dayNum}
            </h2>
            <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace", marginBottom: "20px" }}>{STORE_TIERS[storeTier - 1].name}</div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "12px", marginBottom: "16px" }}>
              <div style={{ background: "#1a1510", borderRadius: "8px", padding: "12px" }}>
                <div style={{ fontSize: "10px", color: "#8B7355", fontFamily: "monospace", marginBottom: "4px" }}>REVENUE</div>
                <div style={{ fontSize: "18px", color: "#22C55E", fontFamily: "monospace" }}>+${showDaySummary.revenue.toLocaleString()}</div>
              </div>
              <div style={{ background: "#1a1510", borderRadius: "8px", padding: "12px" }}>
                <div style={{ fontSize: "10px", color: "#8B7355", fontFamily: "monospace", marginBottom: "4px" }}>EXPENSES</div>
                <div style={{ fontSize: "18px", color: "#C0392B", fontFamily: "monospace" }}>-${showDaySummary.expenses.toLocaleString()}</div>
              </div>
            </div>

            <div style={{ background: "#1a1510", borderRadius: "8px", padding: "12px", marginBottom: "16px" }}>
              <div style={{ fontSize: "10px", color: "#8B7355", fontFamily: "monospace", marginBottom: "4px" }}>NET PROFIT</div>
              <div style={{ fontSize: "22px", color: showDaySummary.profit >= 0 ? "#22C55E" : "#C0392B", fontFamily: "'Playfair Display', Georgia, serif", fontWeight: "bold" }}>
                {showDaySummary.profit >= 0 ? "+" : ""}${showDaySummary.profit.toLocaleString()}
              </div>
              <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace", marginTop: "4px" }}>
                {showDaySummary.deals} deal{showDaySummary.deals !== 1 ? "s" : ""} made · {showDaySummary.customersTotal || 0} customer{(showDaySummary.customersTotal || 0) !== 1 ? "s" : ""} visited
              </div>
            </div>

            {showDaySummary.rentPaid && (
              <div style={{ background: "#22C55E15", border: "1px solid #22C55E30", borderRadius: "8px", padding: "10px", marginBottom: "12px", fontSize: "12px", fontFamily: "monospace", color: "#22C55E" }}>
                Weekly rent paid: ${showDaySummary.rentPaid.toLocaleString()}
              </div>
            )}

            {showDaySummary.rentMissed && !showDaySummary.gameOver && (
              <div style={{ background: "#C0392B15", border: "1px solid #C0392B30", borderRadius: "8px", padding: "10px", marginBottom: "12px", fontSize: "12px", fontFamily: "monospace", color: "#C0392B" }}>
                RENT MISSED! You couldn't cover ${tierData.weeklyRent.toLocaleString()} this week.
                ({showDaySummary.missedCount}/{MAX_MISSED_RENT} missed — {MAX_MISSED_RENT - showDaySummary.missedCount} left before eviction)
              </div>
            )}

            {showDaySummary.gameOver && (
              <div style={{ background: "#C0392B20", border: "2px solid #C0392B", borderRadius: "8px", padding: "14px", marginBottom: "12px", fontSize: "14px", fontFamily: "'Playfair Display', Georgia, serif", color: "#C0392B" }}>
                EVICTION NOTICE — You've missed rent {MAX_MISSED_RENT} times. Your store is closed.
              </div>
            )}

            <button onClick={closeDaySummary} style={menuBtnStyle}>
              {showDaySummary.gameOver ? "ACCEPT FATE" : `BEGIN DAY ${showDaySummary.dayNum + 1}`}
            </button>
          </div>
        </div>
      )}

      {/* TITLE */}
      {screen === "title" && (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100vh", padding: "20px", textAlign: "center" }}>
          <div style={{ width: "100%", maxWidth: "540px", marginBottom: "24px", opacity: 0.85 }}><TitleShelfDisplay /></div>
          <h1 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "clamp(32px, 6vw, 52px)", color: "#D4AF37", margin: "0 0 4px 0", letterSpacing: "4px", textShadow: "0 0 30px rgba(212,175,55,0.3), 0 2px 4px rgba(0,0,0,0.5)", animation: "titlePulse 3s ease-in-out infinite" }}>RARE SPIRITS</h1>
          <div style={{ fontFamily: "monospace", fontSize: "clamp(10px, 2vw, 14px)", color: "#8B7355", letterSpacing: "6px", marginBottom: "40px" }}>WHISKEY TRADING CO.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: "12px", width: "260px" }}>
            <button onClick={() => { setScreen("saves"); audio.playSfx("buttonClick"); }} style={menuBtnStyle}
              onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "0 6px 20px rgba(212,175,55,0.5)"; }}
              onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 12px rgba(212,175,55,0.3)"; }}>START GAME</button>
            <button onClick={() => { setShowOptions(true); audio.playSfx("buttonClick"); }}
              style={{ ...menuBtnStyle, background: "linear-gradient(145deg, #3a3028, #2a2218)", color: "#D4AF37", boxShadow: "0 4px 12px rgba(0,0,0,0.3)" }}>OPTIONS</button>
            <button onClick={() => { if (window.close) window.close(); }}
              style={{ ...menuBtnStyle, background: "transparent", color: "#8B7355", border: "2px solid #3a302860", boxShadow: "none" }}>QUIT</button>
          </div>
        </div>
      )}

      {/* SAVE SLOTS */}
      {screen === "saves" && (
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: "100vh" }}>
          <SaveSlotScreen saves={saves} onSelectSlot={handleSelectSlot} onDeleteSlot={handleDeleteSlot} onBack={() => { setScreen("title"); audio.playSfx("buttonClick"); }} />
        </div>
      )}

      {/* NAME STORE */}
      {screen === "nameStore" && <StoreNameScreen onSubmit={handleNameSubmit} />}

      {/* GAME */}
      {screen === "game" && engine && (
        <>
          <div style={{ borderBottom: "2px solid #3a302830", padding: "16px 24px", background: "linear-gradient(180deg, #1a1510 0%, transparent 100%)" }}>
            <div style={{ maxWidth: "1200px", margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: "12px" }}>
              <div>
                <h1 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "22px", color: "#D4AF37", margin: 0, letterSpacing: "2px" }}>{storeName}</h1>
                <div style={{ fontSize: "10px", color: "#8B7355", letterSpacing: "2px", marginTop: "2px", fontFamily: "monospace" }}>
                  DAY {day} · {STORE_TIERS[storeTier - 1].name.toUpperCase()}
                  {missedRent > 0 && <span style={{ color: "#C0392B", marginLeft: "8px" }}>· RENT OVERDUE ({missedRent}/{MAX_MISSED_RENT})</span>}
                </div>
              </div>
              <div style={{ display: "flex", gap: "12px", alignItems: "center", fontSize: "12px", fontFamily: "monospace", flexWrap: "wrap" }}>
                <div style={{ background: "#1a1510", padding: "4px 10px", borderRadius: "6px", border: "1px solid #3a3028" }}>
                  <span style={{ color: "#8B7355" }}>CASH</span> <span style={{ color: cash < tierData.weeklyRent ? "#C0392B" : "#22C55E", fontWeight: "bold" }}>${cash.toLocaleString()}</span>
                </div>
                <div style={{ background: "#1a1510", padding: "4px 10px", borderRadius: "6px", border: "1px solid #3a3028" }}>
                  <span style={{ color: "#8B7355" }}>REP</span> <span style={{ color: "#D4AF37", fontWeight: "bold" }}>{reputation}</span>
                </div>
                <div style={{ background: "#1a1510", padding: "4px 10px", borderRadius: "6px", border: "1px solid #3a3028" }}>
                  <span style={{ color: "#8B7355" }}>SHELF</span> <span style={{ color: inventory.length >= shelfLimit ? "#C0392B" : "#F5E6CA", fontWeight: "bold" }}>{inventory.length}/{shelfLimit}</span>
                </div>
                <div style={{ background: "#1a1510", padding: "4px 10px", borderRadius: "6px", border: "1px solid #3a3028" }}>
                  <span style={{ color: "#8B7355" }}>RENT</span> <span style={{ color: "#F5E6CA" }}>${tierData.weeklyRent}/wk</span>
                  {day % 7 > 0 && <span style={{ color: "#8B735580", marginLeft: "4px" }}>({7 - (day % 7)}d)</span>}
                </div>
                <label style={{ display: "flex", alignItems: "center", gap: "6px", cursor: "pointer", fontSize: "11px", color: "#8B7355", userSelect: "none" }}>
                  <input type="checkbox" checked={showRarity} onChange={e => setShowRarity(e.target.checked)} style={{ accentColor: "#D4AF37" }} />RARITY (DEV)
                </label>
                <button onClick={() => { setShowOptions(true); audio.playSfx("buttonClick"); }}
                  style={{ padding: "6px 12px", border: "1px solid #3a3028", borderRadius: "6px", background: "transparent", color: "#8B7355", fontSize: "11px", cursor: "pointer", fontFamily: "monospace" }}>OPTIONS</button>
                <button onClick={() => { setScreen("title"); setOfferedBottle(null); audio.playSfx("buttonClick"); }}
                  style={{ padding: "6px 12px", border: "1px solid #3a3028", borderRadius: "6px", background: "transparent", color: "#8B7355", fontSize: "11px", cursor: "pointer", fontFamily: "monospace" }}>MENU</button>
              </div>
            </div>
          </div>

          <div style={{ maxWidth: "1200px", margin: "0 auto", padding: "16px 24px 0" }}>
            <div style={{ display: "flex", gap: "4px" }}>
              {["shop", "storefront", "inventory", "skills", "codex"].map(tab => (
                <button key={tab} onClick={() => { setActiveTab(tab); audio.playSfx("buttonClick"); }}
                  style={{ padding: "10px 24px", border: "none", borderRadius: "8px 8px 0 0", cursor: "pointer", fontSize: "13px", fontFamily: "monospace", letterSpacing: "1px", textTransform: "uppercase", background: activeTab === tab ? "#261f18" : "transparent", color: activeTab === tab ? "#D4AF37" : "#8B7355", transition: "all 0.2s" }}>{tab}</button>
              ))}
            </div>
          </div>

          <div style={{ maxWidth: "1200px", margin: "0 auto", padding: "24px", background: "#261f1820", borderRadius: "0 12px 12px 12px", minHeight: "500px" }}>
            {activeTab === "storefront" && (
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "20px" }}>
                <StorefrontSVG storeName={storeName} tier={storeTier} />
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "16px", color: "#D4AF37", marginBottom: "4px" }}>
                    {STORE_TIERS[storeTier - 1].name}
                  </div>
                  <p style={{ color: "#8B7355", fontSize: "13px", fontStyle: "italic", maxWidth: "500px", lineHeight: 1.6, margin: "0 auto" }}>
                    {STORE_TIERS[storeTier - 1].desc}
                  </p>
                </div>
                {/* Economy overview */}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: "12px", width: "100%", maxWidth: "500px" }}>
                  {[
                    ["Shelf Capacity", `${inventory.length} / ${shelfLimit}`],
                    ["Weekly Rent", `$${tierData.weeklyRent}`],
                    ["Reputation", `${reputation}`],
                  ].map(([label, val]) => (
                    <div key={label} style={{ background: "#1a1510", borderRadius: "8px", padding: "12px", textAlign: "center", border: "1px solid #2a2218" }}>
                      <div style={{ fontSize: "10px", color: "#8B7355", fontFamily: "monospace", letterSpacing: "1px", marginBottom: "4px" }}>{label}</div>
                      <div style={{ fontSize: "16px", color: "#F5E6CA", fontFamily: "'Playfair Display', Georgia, serif" }}>{val}</div>
                    </div>
                  ))}
                </div>
                {/* Upgrade section */}
                {storeTier < 6 && (() => {
                  const next = ECONOMY_TIERS[storeTier];
                  const canUpgrade = cash >= next.upgradeCost && reputation >= next.repRequired;
                  return (
                    <div style={{ background: "linear-gradient(145deg, #1c1714, #261f18)", borderRadius: "12px", padding: "20px", border: canUpgrade ? "2px solid #D4AF37" : "1px solid #3a3028", width: "100%", maxWidth: "500px", textAlign: "center" }}>

                        </div>
                        <div>
                          <span style={{ color: "#8B7355" }}>REP NEEDED </span>
                          <span style={{ color: reputation >= next.repRequired ? "#22C55E" : "#C0392B" }}>{next.repRequired}</span>
                        </div>
                      </div>
                      <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace", marginBottom: "12px" }}>

                      <button onClick={handleUpgrade} disabled={!canUpgrade}

                        UPGRADE — ${next.upgradeCost.toLocaleString()}
                      </button>
                    </div>
                  );
                })()}
                {storeTier >= 6 && (
                  <div style={{ color: "#D4AF37", fontFamily: "'Playfair Display', Georgia, serif", fontSize: "16px", fontStyle: "italic" }}>
                    Maximum tier reached. You've built an empire.
                  </div>

                {/* DEV: Tier selector */}
                <div style={{ display: "flex", gap: "6px", alignItems: "center", marginTop: "8px" }}>
                  <span style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace" }}>TIER (DEV)</span>
                  {[1,2,3,4,5,6].map(t => (
                    <button key={t} onClick={() => setStoreTier(t)}
                      style={{ width: "32px", height: "32px", border: storeTier === t ? "2px solid #D4AF37" : "1px solid #3a3028",
                        borderRadius: "6px", background: storeTier === t ? "#D4AF3720" : "#1a1510",
                        color: storeTier === t ? "#D4AF37" : "#8B7355", fontSize: "13px", cursor: "pointer", fontFamily: "monospace" }}>{t}</button>

                </div>

            {activeTab === "shop" && (

                    <p style={{ color: "#8B7355", fontSize: "14px", maxWidth: "400px", margin: "0 auto 24px", lineHeight: 1.6 }}>
                      You missed rent {MAX_MISSED_RENT} times. The landlord has changed the locks. Your rare whiskey venture has come to an end.
                    </p>
                    <button onClick={() => { setScreen("title"); audio.playSfx("buttonClick"); }} style={menuBtnStyle}>RETURN TO TITLE</button>
                  </div>
                ) : !dayStarted ? (
                  /* --- DAY NOT STARTED --- */
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "20px" }}>
                    <StorefrontSVG storeName={storeName} tier={storeTier} />

                    <p style={{ color: "#8B7355", fontSize: "13px", marginBottom: "8px", fontFamily: "monospace" }}>

                      <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace", marginBottom: "16px" }}>

                      <div style={{ marginTop: "16px", padding: "10px 16px", background: cash >= tierData.weeklyRent ? "#D4AF3710" : "#C0392B15", borderRadius: "8px", border: `1px solid ${cash >= tierData.weeklyRent ? "#D4AF3730" : "#C0392B30"}`, fontSize: "12px", fontFamily: "monospace", color: cash >= tierData.weeklyRent ? "#D4AF37" : "#C0392B" }}>

                    <div style={{ display: "flex", alignItems: "center", gap: "12px", marginBottom: "20px" }}>
                      <span style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace", whiteSpace: "nowrap" }}>

                      <div style={{ flex: 1, height: "6px", background: "#1a1510", borderRadius: "3px", overflow: "hidden" }}>
                        <div style={{ width: `${((customerIndex + (currentCustomer ? 0 : 1)) / customerQueue.length) * 100}%`, height: "100%", background: "linear-gradient(90deg, #D4AF37, #B8960C)", borderRadius: "3px", transition: "width 0.3s" }} />
                      </div>
                      <button onClick={handleEndDay}

                      <div style={{ textAlign: "center", marginBottom: "16px", padding: "10px 16px", borderRadius: "8px",

                        fontSize: "12px", fontFamily: "monospace" }}>
                        <span style={{ color: dayEvent.type === "hotTip" ? "#D4AF37" : "#22C55E", fontWeight: "bold" }}>{dayEvent.label}: </span>
                        <span style={{ color: "#C4A882" }}>{dayEvent.desc}</span>
                      </div>

                      <div style={{ fontSize: "11px", color: "#8B7355", fontFamily: "monospace", textAlign: "center", marginBottom: "16px" }}>

                      </div>

                            {currentCustomer.name}
                          </div>
                          <div style={{ fontSize: "12px", color: "#8B7355", fontStyle: "italic", marginBottom: "8px" }}>
                            {currentCustomer.descriptor}
                          </div>
