// ============================================================================
// SEEDED RANDOM
// ============================================================================
function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
}
function hashString(str) {
  let hash = 5381;
  for (let i = 0; i < str.length; i++) hash = ((hash << 5) + hash + str.charCodeAt(i)) & 0xffffffff;
  return hash >>> 0;
}

};

class AudioManager {
  constructor() { this.sfxVolume = 0.75; this.musicVolume = 0.50; this.currentMusic = null; this.musicAudio = null; }
  setSfxVolume(vol) { this.sfxVolume = Math.max(0, Math.min(1, vol)); }
  setMusicVolume(vol) {
    this.musicVolume = Math.max(0, Math.min(1, vol));
    if (this.musicAudio) this.musicAudio.volume = this.musicVolume;
  }
  playSfx(sfxKey) {
    const src = SOUND_EFFECTS[sfxKey];
    if (!src || this.sfxVolume === 0) return;
    try { const a = new Audio(src); a.volume = this.sfxVolume; a.play().catch(() => {}); } catch (e) {}
  }
  playMusic(trackKey) {
    const src = MUSIC_TRACKS[trackKey];
    if (this.currentMusic === trackKey) return;
    this.stopMusic(); this.currentMusic = trackKey;
    if (!src || this.musicVolume === 0) return;
    try { this.musicAudio = new Audio(src); this.musicAudio.loop = true; this.musicAudio.volume = this.musicVolume; this.musicAudio.play().catch(() => {}); } catch (e) {}
  }
  stopMusic() { if (this.musicAudio) { this.musicAudio.pause(); this.musicAudio = null; } this.currentMusic = null; }
  getState() { return { sfxVolume: this.sfxVolume, musicVolume: this.musicVolume }; }
  loadState(s) { if (s) { this.setSfxVolume(s.sfxVolume ?? 0.75); this.setMusicVolume(s.musicVolume ?? 0.50); } }
}

// ============================================================================
// PROCEDURAL GENERATION ENGINE
// ============================================================================
class WhiskeyEngine {
  constructor(gameSeed = Date.now()) {
    this.gameSeed = gameSeed; this.brands = {}; this.bottleCache = {}; this.brandNames = []; this._initBrands();
  }
  _initBrands() {
    const rng = seededRandom(this.gameSeed);
    const numBrands = 8 + Math.floor(rng() * 8);
    const usedNames = new Set();
    for (let i = 0; i < numBrands; i++) {
      let name, attempts = 0;
      do { name = `${BRAND_PREFIXES[Math.floor(rng() * BRAND_PREFIXES.length)]} ${BRAND_SUFFIXES[Math.floor(rng() * BRAND_SUFFIXES.length)]}`; attempts++; } while (usedNames.has(name) && attempts < 50);
      if (usedNames.has(name)) continue;
      usedNames.add(name);
      const allRegions = ["American", "Canadian"];
      this.brands[name] = {
        region: allRegions[Math.floor(rng() * allRegions.length)], types: {},
        bottleShapeIdx: Math.floor(rng() * BOTTLE_SHAPES.length),
        bottleColor: BOTTLE_COLORS[Math.floor(rng() * BOTTLE_COLORS.length)],
        capColor: CAP_COLORS[Math.floor(rng() * CAP_COLORS.length)],
        labelColor: LABEL_COLORS[Math.floor(rng() * LABEL_COLORS.length)],
        labelAccent: LABEL_ACCENT_COLORS[Math.floor(rng() * LABEL_ACCENT_COLORS.length)],
      };
      this.brandNames.push(name);
    }
  }
  _getBrandRng(brandName, extra = "") { return seededRandom(hashString(brandName + extra + this.gameSeed)); }
  _generateMashbill(typeDef, rng) {
    const primaryPct = typeDef.mashbill.primary.min + Math.floor(rng() * (typeDef.mashbill.primary.max - typeDef.mashbill.primary.min + 1));
    let remaining = 100 - primaryPct;
    const secondaryGrains = [...typeDef.mashbill.secondary];
    const mashbill = { [typeDef.mashbill.primary.grain]: primaryPct };
    for (let i = 0; i < secondaryGrains.length; i++) {
      if (i === secondaryGrains.length - 1) { if (remaining > 0) mashbill[secondaryGrains[i]] = remaining; }
      else { const portion = Math.floor(rng() * (remaining + 1)); if (portion > 0) mashbill[secondaryGrains[i]] = portion; remaining -= portion; }
    }
    return mashbill;
  }
  _getOrCreateBrandType(brandName, typeName) {
    const brand = this.brands[brandName]; if (!brand) return null;
    if (brand.types[typeName]) return brand.types[typeName];
    const typeDef = WHISKEY_TYPES[typeName]; if (!typeDef || !typeDef.regionTags.includes(brand.region)) return null;
    brand.types[typeName] = { mashbill: this._generateMashbill(typeDef, this._getBrandRng(brandName, typeName)) };
    return brand.types[typeName];
  }
  _selectModifiers(typeDef, proof, age, rng) {
    const modifiers = []; if (rng() > 0.55) return modifiers;
    const available = typeDef.modifiers.filter(m => {
      if (m.requirements.minAge && age < m.requirements.minAge) return false;
      if (m.requirements.minProof && proof < m.requirements.minProof) return false;
      // Don't filter by exactProof here — BiB will force proof after selection
      if (m.requirements.specialMashbill) return false; return true;
    });
    if (available.length === 0) return modifiers;
    const first = available[Math.floor(rng() * available.length)]; modifiers.push(first.name);
    if (first.combinable && rng() > 0.7) {
      const second = available.filter(m => m.combinable && m.name !== first.name);
      if (second.length > 0) modifiers.push(second[Math.floor(rng() * second.length)].name);
    }
    return modifiers;
  }
  _selectRarity(age, year, rng, tierLevel = 1, rep = 0) {
    // Rarity influenced by age, release year, and store progression
    const currentYear = 2026;
    const yearsOld = currentYear - year; // how long ago it was released
    
    // Base score from age and release year
    let rarityScore = 0;
    rarityScore += Math.min(age, 20) * 2; // age contributes up to 40 points
    rarityScore += Math.min(yearsOld, 30) * 1.5; // older release years add up to 45 points
    rarityScore += rng() * 20; // random variance
    
    // Tier/rep gating: cap the max achievable rarity at lower tiers
    const tierCap = [30, 50, 70, 85, 95, 120][Math.min(tierLevel - 1, 5)]; // tier 1 caps low
    const repBonus = Math.min(rep / 100, 10); // small rep bonus
    rarityScore = Math.min(rarityScore, tierCap + repBonus);
    
    // Map score to rarity
    if (rarityScore >= 90) return "Unicorn";
    if (rarityScore >= 75) return "Legendary";
    if (rarityScore >= 55) return "Epic";
    if (rarityScore >= 38) return "Rare";
    if (rarityScore >= 22) return "Uncommon";
    return "Common";
  }
  _calculateBaseValue(age, proof, rarity, modifiers, yearKnown = true) {
    // Base value from characteristics
    let v = 15 + age * 5 + (proof - 80) * 0.3;
    // Rarity multiplier
    v *= ({ Common: 1, Uncommon: 1.8, Rare: 3.5, Epic: 7, Legendary: 18, Unicorn: 45 })[rarity] || 1;
    // Modifier bonuses
    if (modifiers.length > 0) v *= 1 + modifiers.length * 0.15;
    if (modifiers.includes("Barrel Proof")) v *= 1.25;
    if (modifiers.includes("Bottled-in-Bond")) v *= 1.1;
    if (modifiers.includes("Single Barrel")) v *= 1.2;
    if (modifiers.some(m => m.startsWith("Finished in"))) v *= 1.15;
    // Unknown year penalty: bottles with unknown year are worth less on the surface
    if (!yearKnown) v *= 0.55;
    return Math.round(v);
  }
  generateBottle(tierLevel = 1, rep = 0) {
    const rng = seededRandom(Date.now() + Math.random() * 100000);
    const brandName = this.brandNames[Math.floor(rng() * this.brandNames.length)];
    const brand = this.brands[brandName];
    const compatibleTypes = Object.keys(WHISKEY_TYPES).filter(t => WHISKEY_TYPES[t].regionTags.includes(brand.region));
    const typeName = compatibleTypes[Math.floor(rng() * compatibleTypes.length)];
    const typeDef = WHISKEY_TYPES[typeName];
    this._getOrCreateBrandType(brandName, typeName);
    const mashbill = { ...brand.types[typeName].mashbill };
    
    // Age is influenced by tier: lower tiers skew toward younger bottles
    const maxAgeForTier = Math.min(typeDef.age.max, typeDef.age.min + Math.floor((typeDef.age.max - typeDef.age.min) * (0.3 + tierLevel * 0.12)));
    const age = typeDef.age.min + Math.floor(rng() * (maxAgeForTier - typeDef.age.min + 1));
    const year = 2026 - age - Math.floor(rng() * 5);
    
    // Proof: lower tiers skew toward standard proofs
    const proofRange = typeDef.proof.max - typeDef.proof.min;
    const maxProofForTier = typeDef.proof.min + Math.floor(proofRange * (0.4 + tierLevel * 0.1));
    let proof = typeDef.proof.min + Math.floor(rng() * (Math.min(maxProofForTier, typeDef.proof.max) - typeDef.proof.min + 1));
    
    // Modifiers: lower tiers have fewer modifiers
    const modifierChance = 0.15 + tierLevel * 0.07; // tier 1: ~22%, tier 6: ~57%
    let modifiers = rng() < modifierChance ? this._selectModifiers(typeDef, proof, age, rng) : [];
    if (modifiers.includes("Bottled-in-Bond")) proof = 100;
    
    const modKey = modifiers.length > 0 ? modifiers.sort().join("|") : "base";
    const cacheKey = `${brandName}|${typeName}|${year}|${modKey}`;
    
    // Rarity based on age, year, tier
    const rarity = this._selectRarity(age, year, rng, tierLevel, rep);
    // True value (with year known)
    const trueValue = this._calculateBaseValue(age, proof, rarity, modifiers, true);
    
    const isSpecial = rng() > 0.95;
    let displayMashbill = mashbill;
    if (isSpecial) {
      displayMashbill = this._generateMashbill(typeDef, seededRandom(hashString(cacheKey + "special")));
      if (JSON.stringify(displayMashbill) !== JSON.stringify(mashbill) && !modifiers.some(m => !WHISKEY_TYPES[typeName].modifiers.find(md => md.name === m)?.combinable))
        modifiers = ["Special Release"];
    }
    const finishMods = modifiers.filter(m => m.startsWith("Finished in"));
    const otherMods = modifiers.filter(m => !m.startsWith("Finished in"));
    // Age statement: 3-6 is "Unstated", >6 gets added to name, <=2 shown on card only
    const ageStated = age > 6;
    const ageHidden = age >= 3 && age <= 6;
    const ageDisplay = ageHidden ? "Unstated" : `${age}yr`;
    const ageSuffix = ageStated ? ` ${age} Year` : "";
    const bottle = {
      id: `b_${Date.now()}_${Math.floor(Math.random()*10000)}`, brandName, typeName, year, age, proof,
      ageDisplay, ageStated,
      mashbill: displayMashbill, region: brand.region, modifiers, rarity, trueValue,
      value: trueValue,
      yearKnown: true,
      bottleShapeIdx: brand.bottleShapeIdx, bottleColor: brand.bottleColor, capColor: brand.capColor, labelColor: brand.labelColor, labelAccent: brand.labelAccent,
    };
    bottle.baseDisplayName = `${brandName} ${otherMods.length ? otherMods.join(" ") + " " : ""}${typeName}${finishMods.length ? " " + finishMods.join(" ") : ""}${ageSuffix}`;
    bottle.displayName = `${year} ${bottle.baseDisplayName}`;
    return bottle;
  }
  getEngineStats() {
    return { totalBrands: this.brandNames.length, cachedBottles: Object.keys(this.bottleCache).length,
      brandDetails: Object.entries(this.brands).map(([name, b]) => ({ name, region: b.region, types: Object.keys(b.types) })) };
  }
}

function BottleSVG({ bottle, size = 160 }) {
  const shapeFn = BOTTLE_SHAPES[bottle.bottleShapeIdx] || BOTTLE_SHAPES[0];
  const labelLines = [...bottle.brandName.split(" "), bottle.typeName];
  return (
    <svg width={size} height={size} viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg" style={{ filter: "drop-shadow(2px 4px 8px rgba(0,0,0,0.5))" }}>
      <g dangerouslySetInnerHTML={{ __html: shapeFn(bottle.bottleColor, bottle.capColor) }} />
      <rect x="33" y="72" width="34" height="40" rx="2" fill={bottle.labelColor} stroke={bottle.labelAccent} strokeWidth="1" />
      {labelLines.slice(0, 3).map((line, i) => (
        <text key={i} x="50" y={82 + i * 11} textAnchor="middle" fill={bottle.labelAccent} fontSize="6" fontFamily="serif" fontWeight={i === 0 ? "bold" : "normal"}>
          {line.length > 8 ? line.slice(0, 8) + "." : line}
        </text>
      ))}
      <rect x="34" y="110" width="32" height="36" rx="1" fill={bottle.bottleColor} opacity="0.15" />
    </svg>
  );
}

function tagStyle(bg) {
  return { display: "inline-block", padding: "2px 10px", borderRadius: "10px", fontSize: "10px", fontFamily: "'Inter', sans-serif", fontWeight: "500", letterSpacing: "0.3px", background: bg + "20", color: "var(--text-muted)", border: `1px solid ${bg}40` };
}

function BottleCard({ bottle, showRarity = false, onClick, yearEstimate = null, hideValue = false, purchasePrice = null }) {
  const rarityDef = RARITIES.find(r => r.name === bottle.rarity);
  const borderStyle = showRarity
    ? rarityDef?.gradient ? { borderImage: `${rarityDef.gradient} 1`, borderWidth: "3px", borderStyle: "solid" } : { border: `3px solid ${rarityDef?.color || "#6B7280"}` }
    : { border: "2px solid var(--border)" };
  return (
    <div onClick={onClick} style={{ ...borderStyle, borderRadius: "16px", background: `linear-gradient(145deg, var(--bg3), var(--bg2))`, padding: "16px", cursor: onClick ? "pointer" : "default", width: "280px", maxWidth: "90vw", transition: "transform 0.2s, box-shadow 0.2s", boxShadow: "0 4px 12px rgba(0,0,0,0.4)", flexShrink: 0 }}
      onMouseEnter={e => { e.currentTarget.style.transform = "translateY(-4px)"; e.currentTarget.style.boxShadow = "0 8px 24px rgba(0,0,0,0.6)"; }}
      onMouseLeave={e => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 12px rgba(0,0,0,0.4)"; }}>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: "12px", background: "radial-gradient(ellipse at center, rgba(255,248,230,0.08) 0%, transparent 70%)", borderRadius: "8px", padding: "8px 0" }}>
        <BottleSVG bottle={bottle} size={140} />
      </div>
      <h3 style={{ fontFamily: "'Playfair Display', Georgia, serif", fontSize: "15px", color: "var(--text)", margin: "0 0 10px 0", lineHeight: 1.3, textAlign: "center", minHeight: "40px" }}>{bottle.displayName}</h3>
      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px", marginBottom: "10px", justifyContent: "center" }}>
        <span style={tagStyle("#8B4513")}>{bottle.region}</span>
        <span style={tagStyle("#704214")}>{bottle.typeName}</span>
        {bottle.modifiers.map((m, i) => <span key={i} style={tagStyle("#5B3A29")}>{m}</span>)}
        {showRarity && <span style={{ ...tagStyle(rarityDef?.color || "#6B7280"), ...(rarityDef?.gradient ? { background: rarityDef.gradient, color: "#fff" } : {}) }}>{bottle.rarity}</span>}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px", fontSize: "12px", color: "var(--text-muted)", fontFamily: "'JetBrains Mono', 'Courier New', monospace" }}>
        <div><span style={{ color: "var(--text-dim)" }}>PROOF</span> {bottle.proof}</div>
        <div><span style={{ color: "var(--text-dim)" }}>AGE</span> {bottle.ageDisplay || `${bottle.age}yr`}</div>
        <div style={{ gridColumn: "1 / -1" }}>
          <span style={{ color: "var(--text-dim)" }}>YEAR</span>{" "}
          {bottle.yearKnown ? bottle.year : yearEstimate ? (
            yearEstimate.exact ? <span style={{ color: "var(--accent)" }}>{yearEstimate.min} (verified)</span> : <span style={{ color: "var(--accent-dark)" }}>~{yearEstimate.min}–{yearEstimate.max}</span>
          ) : "Unknown"}
        </div>
      </div>
      <div style={{ marginTop: "10px" }}>
        <div style={{ fontSize: "10px", color: "var(--text-dim)", marginBottom: "4px", fontFamily: "monospace", letterSpacing: "1px" }}>MASHBILL</div>
        <div style={{ display: "flex", borderRadius: "4px", overflow: "hidden", height: "16px" }}>
          {Object.entries(bottle.mashbill).filter(([,v]) => v > 0).sort(([,a],[,b]) => b - a).map(([grain, pct]) => {
            const gc = { Corn: "var(--accent)", Rye: "#A0522D", Barley: "#DAA520", Wheat: "#DEB887" };
            return <div key={grain} style={{ width: `${pct}%`, background: gc[grain] || "#888", display: "flex", alignItems: "center", justifyContent: "center", fontSize: "8px", color: "var(--bg1)", fontWeight: "bold", fontFamily: "monospace", whiteSpace: "nowrap", overflow: "hidden" }} title={`${grain}: ${pct}%`}>{pct >= 15 ? `${grain.slice(0,3)} ${pct}%` : pct >= 8 ? `${pct}` : ""}</div>;
          })}
        </div>
        <div style={{ display: "flex", gap: "8px", marginTop: "4px", flexWrap: "wrap" }}>
          {Object.entries(bottle.mashbill).filter(([,v]) => v > 0).sort(([,a],[,b]) => b - a).map(([grain, pct]) => {
            const gc = { Corn: "var(--accent)", Rye: "#A0522D", Barley: "#DAA520", Wheat: "#DEB887" };
            return <span key={grain} style={{ fontSize: "9px", color: gc[grain] || "#888", fontFamily: "monospace" }}>{grain} {pct}%</span>;

      </div>
      {!hideValue && (
        <div style={{ marginTop: "12px", textAlign: "center", fontSize: "18px", fontFamily: "'Playfair Display', Georgia, serif", fontWeight: "bold", color: purchasePrice != null ? "var(--text-muted)" : "var(--accent)" }}>
          {purchasePrice != null ? `Paid: $${purchasePrice.toLocaleString()}` : `$${bottle.value.toLocaleString()}`}
        </div>
      )}

  );
}

function BrandPanel({ engine }) {

              style={{ background: "var(--surface)", borderRadius: "8px", padding: "10px 14px", cursor: "pointer", border: expanded === b.name ? "1px solid var(--accent)" : "1px solid var(--border)", transition: "border-color 0.2s" }}>

                  <div style={{ marginBottom: "4px" }}>Types: {b.types.length > 0 ? b.types.join(", ") : "None yet"}</div>

                    <div key={tn} style={{ marginTop: "6px", padding: "6px", background: "var(--bg1)", borderRadius: "4px" }}>

function themeToCSS(t) {
  // Parse hex to get RGB values for alpha variants
  const hexToRGB = (hex) => { const h = hex.replace('#',''); return `${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)}`; };
  return `--accent: ${t.accent}; --accent-dark: ${t.accentDark}; --bg1: ${t.bg1}; --bg2: ${t.bg2}; --bg3: ${t.bg3}; --surface: ${t.surface}; --border: ${t.border}; --text: ${t.text}; --text-muted: ${t.textMuted}; --text-dim: ${t.textDim}; --success: ${t.success}; --danger: ${t.danger}; --buy-accent: ${t.buyAccent}; --accent-rgb: ${hexToRGB(t.accent)}; --border-rgb: ${hexToRGB(t.border)}; --success-rgb: ${hexToRGB(t.success)}; --danger-rgb: ${hexToRGB(t.danger)}; --buy-accent-rgb: ${hexToRGB(t.buyAccent)}; --text-dim-rgb: ${hexToRGB(t.textDim)}; --bg3-rgb: ${hexToRGB(t.bg3)};`;
}

          <div style={{ fontFamily: "'Inter', sans-serif", fontSize: "11px", color: "var(--text-dim)", letterSpacing: "1px", marginBottom: "10px", fontWeight: "600" }}>COLOR THEME</div>

}

// ============================================================================
// MAIN APP
// ============================================================================
function WhiskeyGame() {
  const [screen, setScreen] = useState("title");
  const [saves, setSaves] = useState(() => {
    try {
      const stored = localStorage.getItem("rareSpirits_saves");
      if (stored) return JSON.parse(stored);
    } catch (e) {}
    return [null, null, null];
  });

  // Persist saves to localStorage whenever they change
  useEffect(() => {
    try {
      localStorage.setItem("rareSpirits_saves", JSON.stringify(saves));
    } catch (e) {}
  }, [saves]);
  const [activeSlot, setActiveSlot] = useState(null);
  const [showOptions, setShowOptions] = useState(false);
  const [colorTheme, setColorTheme] = useState(() => {
    try { return localStorage.getItem("rareSpirits_theme") || "classic"; } catch(e) { return "classic"; }
  });
  const handleThemeChange = useCallback((key) => {
    setColorTheme(key);
    try { localStorage.setItem("rareSpirits_theme", key); } catch(e) {}
  }, []);
  const [storeName, setStoreName] = useState("");
  const [storeTier, setStoreTier] = useState(1);
  const [inventory, setInventory] = useState([]);
  const [cash, setCash] = useState(STARTING_CASH);
  const [reputation, setReputation] = useState(0);
  const [day, setDay] = useState(1);
  const [missedRent, setMissedRent] = useState(0);
  const [gameOver, setGameOver] = useState(false);
  const [showDaySummary, setShowDaySummary] = useState(null); // { revenue, expenses, deals, dayNum }
  const [showRentDue, setShowRentDue] = useState(null); // { amount, canPay }
  const [showUpgradePanel, setShowUpgradePanel] = useState(false);
  const [dailyLog, setDailyLog] = useState([]); // [{type, desc, amount}] for current day
  const [offeredBottle, setOfferedBottle] = useState(null);
  const [showRarity, setShowRarity] = useState(false);
  const [activeTab, setActiveTab] = useState("shop");
  const [filterType, setFilterType] = useState("All");
  const [sortBy, setSortBy] = useState("newest");
  const [playerSkills, setPlayerSkills] = useState({ yearEstimation: 0, industryKnowledge: 0, peopleReader: 0 });
  const [codex, setCodex] = useState({}); // { brandName: { typeName+mods: { bottles: [{year,proof,age,mashbill}], minYear, maxYear, ... } } }
  const [codexExpandedBrand, setCodexExpandedBrand] = useState(null);
  const [codexExpandedVariant, setCodexExpandedVariant] = useState(null);

  const engineRef = useRef(null);
  const audioRef = useRef(null);
  if (!audioRef.current) audioRef.current = new AudioManager();
  const audio = audioRef.current;

  const initEngine = useCallback((seed) => { engineRef.current = new WhiskeyEngine(seed || Date.now()); }, []);

  const handleSelectSlot = useCallback((i) => {
    const save = saves[i];
    if (save) {
      setActiveSlot(i); setStoreName(save.storeName); setStoreTier(save.storeTier || 1); setInventory(save.inventory);
      setCash(save.cash ?? STARTING_CASH); setReputation(save.reputation ?? 0); setDay(save.day ?? 1); setMissedRent(save.missedRent ?? 0);
      setPlayerSkills(save.playerSkills ?? { yearEstimation: 0, industryKnowledge: 0, peopleReader: 0 });
      setCodex(save.codex ?? {});
      setGameOver(false); setDailyLog([]); setShowDaySummary(null); setShowRentDue(null);
      initEngine(save.gameSeed);
      if (save.engineBrands) engineRef.current.brands = save.engineBrands;
      if (save.engineBrandNames) engineRef.current.brandNames = save.engineBrandNames;
      if (save.engineBottleCache) engineRef.current.bottleCache = save.engineBottleCache;
      setActiveTab("shop"); setScreen("game");
    } else {
      setActiveSlot(i); initEngine(); setInventory([]); setCash(STARTING_CASH); setReputation(0); setDay(1); setMissedRent(0); setGameOver(false); setDailyLog([]); setStoreTier(1); setPlayerSkills({ yearEstimation: 0, industryKnowledge: 0, peopleReader: 0 }); setCodex({}); setScreen("nameStore");
    }
    audio.playSfx("buttonClick");
  }, [saves, initEngine, audio]);

  const handleDeleteSlot = useCallback((i) => { setSaves(p => { const n = [...p]; n[i] = null; return n; }); audio.playSfx("buttonClick"); }, [audio]);
  const handleNameSubmit = useCallback((name) => { setStoreName(name); setActiveTab("shop"); setScreen("game"); audio.playSfx("buttonClick"); }, [audio]);

  useEffect(() => {
    if (screen === "game" && activeSlot !== null && engineRef.current) {
      setSaves(p => { const n = [...p]; n[activeSlot] = { storeName, storeTier, inventory, cash, reputation, day, missedRent, playerSkills, codex, gameSeed: engineRef.current.gameSeed, engineBrands: engineRef.current.brands, engineBrandNames: engineRef.current.brandNames, engineBottleCache: engineRef.current.bottleCache }; return n; });
    }
  }, [screen, activeSlot, storeName, storeTier, inventory, cash, reputation, day, missedRent, playerSkills, codex]);

  const engine = engineRef.current;
  const tierData = ECONOMY_TIERS[storeTier - 1];
  const shelfLimit = tierData.shelfLimit;
  const canAfford = (price) => cash >= price;
  const shelfFull = inventory.length >= shelfLimit;

  // ---- PLAYER SKILLS ----

  const traitTier = (val) => val < 25 ? 0 : val < 50 ? 1 : val < 75 ? 2 : 3;
  const traitLabel = (axis, val) => TRAIT_LABELS[axis][traitTier(val)];

  // Descriptors based on trait combos
  const DESCRIPTORS = [
    { match: t => t.sociability > 65, pool: ["A warm, smiling person who complimented your shop on the way in", "Someone who shook your hand and introduced themselves", "A cheerful person who seems genuinely happy to be here"] },

    { match: t => t.confidence < 30, pool: ["A nervous-looking person fidgeting with their coat", "Someone who seems unsure about being here", "A hesitant individual glancing around the shop"] },

    { match: t => t.sociability < 30, pool: ["A quiet person who walked straight to the counter", "Someone who nodded silently in greeting", "An individual who keeps to themselves"] },
    { match: () => true, pool: ["A relaxed person browsing casually", "Someone in jeans and a flannel, looking around with mild curiosity", "A friendly face who wandered in off the street"] },
  ];

  // ---- CONVERSATION DIALOGUE DATA ----
  // Each option has: id, label (shown on button), category, variants (player lines),
  // requiresSkill/minLevel, dispositionEffects per trait tier, response pools per trait combo
  const CONVO_OPTIONS = [
    { id: "greet_warm", label: "Friendly Greeting", category: "greeting",
      variants: ["Welcome! Great to have you in the shop.", "Hey there! Come on in, take a look around.", "Good to see a new face! Let me know if anything catches your eye."],
      dispositionEffects: { highSociability: 6, lowSociability: 1, highPatience: 2, lowPatience: 0, highConfidence: 1, lowConfidence: 3 },
      responses: {

        lowConfidence: ['"Oh, thanks... I\'m just looking around, I think."','*customer just nods back silently*','"...do you guys have have any whiskey or bourbon here?"'],
      }},
    { id: "greet_professional", label: "Professional Greeting", category: "greeting",
      variants: ["Good afternoon. How can I help you today?", "Welcome in. Anything I can assist with?", "Hello. Let me know if you have any questions."],
      dispositionEffects: { highSociability: -2, lowSociability: 4, highPatience: 3, lowPatience: 2, highConfidence: 3, lowConfidence: 1 },
      responses: {
        highSociability: ['"A bit formal, but sure! What\'s good in here?"', '"All business, huh? I can respect that."'],
        lowSociability: ['*customer acknowledges you silently*', '"Just looking."'],
        highConfidence: ['"I think I can find my way around. Thanks."'],
        lowConfidence: ['"Oh, um, sure. I\'ll just browse a bit."'],
      }},

      variants: ["So what's your go-to pour at the end of a long day?", "Got any favorites on your shelf at home?", "What kind of whiskey do you usually gravitate toward?"],
      dispositionEffects: { highSociability: 5, lowSociability: -2, highKnowledge: 4, lowKnowledge: -3, highPatience: 2, lowPatience: -4 },
      responses: {

        lowKnowledge: ['"Oh, I don\'t know much about whiskey really... whatever\'s smooth?"', '"Honestly, I just grab whatever looks nice on the shelf."'],

  const handleInquireBusiness = useCallback(() => {

  // ---- CODEX TRACKING ----
  const trackBottleInCodex = useCallback((bottle) => {
    if (!bottle) return;
    const brand = bottle.brandName;
    const modKey = bottle.modifiers.length > 0 ? bottle.modifiers.sort().join(" ") + " " : "";
    const variantKey = `${modKey}${bottle.typeName}`;
    setCodex(prev => {
      const next = { ...prev };
      if (!next[brand]) next[brand] = {};
      const existing = next[brand][variantKey];
      if (existing) {
        if (bottle.yearKnown) {
          existing.minYear = Math.min(existing.minYear ?? bottle.year, bottle.year);
          existing.maxYear = Math.max(existing.maxYear ?? bottle.year, bottle.year);
        }
        existing.encounters = (existing.encounters || 1) + 1;
        existing.lastProof = bottle.proof;
        existing.lastAge = bottle.age;
        existing.lastMashbill = bottle.mashbill;
      } else {
        next[brand][variantKey] = {
          brandName: brand, typeName: bottle.typeName, modifiers: [...bottle.modifiers], variantKey,
          displayName: `${brand} ${variantKey}`,
          minYear: bottle.yearKnown ? bottle.year : null, maxYear: bottle.yearKnown ? bottle.year : null,

  const trackPriceInCodex = useCallback((bottle, dealType, price) => {
    if (!bottle) return;

    const modKey = bottle.modifiers.length > 0 ? bottle.modifiers.sort().join(" ") + " " : "";
    const variantKey = `${modKey}${bottle.typeName}`;
    const yearKey = bottle.yearKnown ? String(bottle.year) : "unknown";
    setCodex(prev => {
      const next = { ...prev };
      if (!next[brand] || !next[brand][variantKey]) return next;
      const entry = next[brand][variantKey];
      if (!entry.priceHistory) entry.priceHistory = {};
      if (!entry.priceHistory[yearKey]) entry.priceHistory[yearKey] = {};
      const yh = entry.priceHistory[yearKey];
      if (dealType === "buy") { yh.minBuy = yh.minBuy != null ? Math.min(yh.minBuy, price) : price; yh.maxBuy = yh.maxBuy != null ? Math.max(yh.maxBuy, price) : price; }
      else { yh.minSell = yh.minSell != null ? Math.min(yh.minSell, price) : price; yh.maxSell = yh.maxSell != null ? Math.max(yh.maxSell, price) : price; }
      return next;
    });
  }, []);

  const advanceToNextCustomer = useCallback(() => {
    const nextIdx = customerIndex + 1;
    setNegotiating(false); setNegResult(null); setSelectedSellBottle(null); setPreTacticUsed(null); setMidTacticUsed(null); setTacticResult(null); setShowTacticsMenu(false); setConvoPhase("greeting"); setConvoLog([]); setConvoTurns(0); setUsedConvoOptions([]); setTraitHints([]); setConvoWaiting(false);
    if (nextIdx < customerQueue.length) {

  // Calculate buyer's offer for a specific bottle (instead of using the average-based pre-computed one)
  const getOfferForBottle = useCallback((customer, bottle) => {
    if (!customer || !bottle || customer.type !== "buyer") return { offer: 0, maxPay: 0 };
    const t = customer.traits;
    const flexibility = (t.sociability * 0.3 + (100 - t.confidence) * 0.3 + t.patience * 0.2 + (100 - t.knowledge) * 0.2) / 100;
    const valueBasis = t.knowledge > 55 ? (bottle.trueValue || bottle.value) : bottle.value;
    // Disposition modifier: better disposition = willing to pay more
    const dispMod = customer.disposition ? 0.85 + (customer.disposition / 100) * 0.3 : 1; // 0.85 at disp=0, 1.15 at disp=100
    const budget = Math.round(valueBasis * (customer.budgetRatio || 1) * dispMod);
    const maxPay = Math.round(budget * (1 + flexibility * 0.5));
    const offer = Math.round(budget * (customer.offerRatio || 0.6));
    return { offer, maxPay, budget };
  }, []);

  const applyTactic = useCallback((tacticId, phase) => {
    if (!currentCustomer) return;
    const tactic = TACTICS[tacticId];
    if (!tactic) return;
    if (tactic.requiresSkill && (playerSkills[tactic.requiresSkill] || 0) < tactic.minLevel) return;

    const c = currentCustomer;
    const t = c.traits;
    // Map traits to effect level based on tactic's trait sensitivity
    const getEffect = () => {
      if (tacticId === "compliment") {
        if (t.sociability > 65 || (t.confidence < 35 && t.sociability > 40)) return "great";
        if (t.sociability > 40) return "good";
        if (t.confidence > 70 && t.knowledge > 60) return "neutral";
        return "neutral";
      } else if (tacticId === "flaw") {
        if (t.knowledge < 30 && t.confidence < 40) return "great";
        if (t.knowledge < 45) return "good";
        if (t.knowledge > 70 && t.confidence > 65) return "terrible";
        if (t.knowledge > 55) return "bad";
        return "neutral";
      } else if (tacticId === "compete") {
        if (t.patience < 35 || t.confidence < 30) return "great";
        if (t.patience < 50) return "good";
        if (t.confidence > 70) return "bad";
        return "neutral";
      } else if (tacticId === "knowledge") {
        if (t.knowledge < 35) return "great";
        if (t.knowledge < 55 || t.sociability > 60) return "good";
        return "neutral";
      } else if (tacticId === "askYear") {
        if (t.knowledge < 30 || t.confidence < 30) return "great";
        if (t.knowledge < 50) return "good";
        if (t.knowledge > 70) return "bad";
        return "neutral";
      }
      return "neutral";
    };
    const effect = getEffect();
    const mult = tactic.multipliers[effect];
    const isSeller = c.type === "seller";
    const bottle = isSeller ? c.bottle : inventory.find(b => b.id === selectedSellBottle);

    let playerText;
    if (tacticId === "flaw") playerText = getFlawText(bottle, !isSeller);
    else if (tacticId === "knowledge") playerText = getKnowledgeText(bottle, !isSeller);
    else playerText = isSeller ? tactic.sellerText : tactic.buyerText;

    const responsePool = tactic.responses[effect]?.[isSeller ? "seller" : "buyer"] || tactic.responses[effect]?.seller || ['"..."'];
    const response = responsePool[Math.floor(Math.random() * responsePool.length)];

    if (phase === "pre") setPreTacticUsed(tacticId);
    else setMidTacticUsed(tacticId);

    if (mult === null) {
      setTacticResult({ text: response, effect: "terrible" });
      if (negotiating) {
        setNegResult("walked");
        setNegHistory(prev => [...prev, { who: "player", amount: null, text: playerText }, { who: "customer", amount: null, text: response }]);
      } else {
        setTimeout(() => { advanceToNextCustomer(); }, 1500);
      }
      return;
    }

    setTacticResult({ text: response, effect });

    if (isSeller) {
      const newAsk = Math.max(Math.round(c.askingPrice * mult), c.minAccept);
      const newMin = Math.round(c.minAccept * (mult < 1 ? mult * 0.9 + 0.1 : mult));
      setCurrentCustomer(prev => ({ ...prev, askingPrice: newAsk, minAccept: Math.min(newMin, newAsk) }));
      if (negotiating) {
        setCustomerOffer(newAsk);
        setNegHistory(prev => [...prev, { who: "player", amount: null, text: playerText }, { who: "customer", amount: newAsk, text: `${response} $${newAsk.toLocaleString()}.` }]);
      }
    } else {
      const newMax = Math.round(c.maxPay * (mult < 1 ? 1 + (1 - mult) : mult));
      const newOffer = Math.round(c.openingOffer * (mult < 1 ? 1 + (1 - mult) * 0.5 : mult));
      setCurrentCustomer(prev => ({ ...prev, maxPay: newMax, openingOffer: Math.min(newOffer, newMax) }));
      if (negotiating) {
        setCustomerOffer(newOffer);
        setNegHistory(prev => [...prev, { who: "player", amount: null, text: playerText }, { who: "customer", amount: newOffer, text: `${response} $${newOffer.toLocaleString()}.` }]);
      }
    }

    setShowTacticsMenu(false);
    setTimeout(() => setTacticResult(null), 2500);
  }, [currentCustomer, negotiating, inventory, selectedSellBottle, playerSkills, getFlawText, getKnowledgeText, advanceToNextCustomer]);

  const FIRST_NAMES = ["James","Mary","Robert","Linda","Michael","Sarah","William","Karen","David","Lisa","Thomas","Nancy","John","Betty","Daniel","Sandra","Paul","Ruth","Mark","Helen","George","Laura","Frank","Anna","Ed","Carol","Tony","Marie","Victor","Grace"];
  const LAST_NAMES = ["Smith","Johnson","Brown","Davis","Wilson","Moore","Taylor","Anderson","Thomas","Harris","Martin","Garcia","Lee","Clark","Lewis","Hall","Young","King","Wright","Hill","Scott","Green","Baker","Adams","Reed","Cook","Morgan","Bell","Ross","Wood"];

  const generateCustomerName = useCallback((rng) => {
    return `${FIRST_NAMES[Math.floor(rng() * FIRST_NAMES.length)]} ${LAST_NAMES[Math.floor(rng() * LAST_NAMES.length)]}`;
  }, []);

  const BUYER_REQUESTS = [
    { text: "I'm looking for a good Bourbon.", filter: b => b.typeName === "Bourbon" },
    { text: "Got any Rye whiskey?", filter: b => b.typeName === "Rye" },
    { text: "I want something aged at least 10 years.", filter: b => b.age >= 10 },
    { text: "Looking for something high proof.", filter: b => b.proof >= 110 },
    { text: "I need a gift — something special.", filter: b => b.modifiers.length > 0 },
    { text: "What's the oldest bottle you have?", filter: b => b.age >= 8 },
    { text: "I'm after anything Bottled-in-Bond.", filter: b => b.modifiers.includes("Bottled-in-Bond") },
    { text: "Show me what you've got — I'm open to anything.", filter: () => true },
    { text: "I'm a barrel proof fanatic. Got any?", filter: b => b.modifiers.includes("Barrel Proof") },
    { text: "Something smooth — nothing too hot.", filter: b => b.proof <= 100 },
    { text: "I'm looking for a Single Barrel.", filter: b => b.modifiers.includes("Single Barrel") },
    { text: "Any barrel-finished whiskeys in stock?", filter: b => b.modifiers.some(m => m.startsWith("Finished in")) },
  ];

  const [dayEvent, setDayEvent] = useState(null); // null | { type, desc, ... }

  const DAY_EVENTS = [
    { type: "hotTip", chance: 0.08, label: "HOT TIP",
      descs: ["Word on the street: a serious collector is hunting for a specific bottle today.", "A wealthy client called ahead — they're willing to pay top dollar for the right bottle.", "A private auction fell through. The buyer is coming to you instead."] },
    { type: "estateSale", chance: 0.06, label: "ESTATE SALE",
      descs: ["A local estate is being liquidated — expect sellers with bottles priced to move.", "A family clearing out a collection is sending people your way today.", "An old bar closed down — their backstock is hitting the streets."] },
  ];

  const generateDayQueue = useCallback(() => {
    if (!engine) return [];
    const rng = seededRandom(Date.now() + day * 777);
    const [minC, maxC] = tierData.customersPerDay;
    let numCustomers = minC + Math.floor(rng() * (maxC - minC + 1));
    const queue = [];
    let event = null;
    for (const evt of DAY_EVENTS) { if (rng() < evt.chance) { event = { ...evt, desc: evt.descs[Math.floor(rng() * evt.descs.length)] }; break; } }
    if (event?.type === "estateSale") numCustomers += 2;
    for (let i = 0; i < numCustomers; i++) {
      const name = generateCustomerName(rng);
      const traits = { knowledge: Math.floor(rng() * 100), patience: Math.floor(rng() * 100), sociability: Math.floor(rng() * 100), confidence: Math.floor(rng() * 100) };
      const flexibility = (traits.sociability * 0.3 + (100 - traits.confidence) * 0.3 + traits.patience * 0.2 + (100 - traits.knowledge) * 0.2) / 100;
      const maxRounds = traits.patience < 25 ? 2 : traits.patience < 50 ? 3 : traits.patience < 75 ? 4 : 5;
      const counterLines = traits.confidence > 60 ? ["The fair price is closer to", "I know what this is worth —", "Let's be realistic —"] : traits.sociability > 60 ? ["How about we meet at", "What if we did", "Fair number around"] : ["How about", "I'll do", "Maybe"];
      const walkLine = traits.confidence > 60 ? "Not at that price." : traits.sociability > 60 ? "Maybe next time, friend." : traits.patience < 30 ? "Too slow. I'm out." : "Nah, I'll pass.";
      const descMatch = DESCRIPTORS.find(d => d.match(traits));
      const descriptor = descMatch ? descMatch.pool[Math.floor(rng() * descMatch.pool.length)] : "A person walks in.";
      const sellerChance = event?.type === "estateSale" ? 0.80 : 0.55;
      const isSeller = inventory.length === 0 ? true : rng() < sellerChance;
      if (isSeller) {
        const bottle = engine.generateBottle(storeTier, reputation);
        const yearKnownChance = traits.knowledge < 35 ? 0.15 : traits.knowledge < 60 ? 0.55 : 0.85;
        const yearKnown = rng() < yearKnownChance;
        bottle.yearKnown = yearKnown;
        if (!yearKnown) { bottle.value = engine._calculateBaseValue(bottle.age, bottle.proof, bottle.rarity, bottle.modifiers, false); bottle.displayName = bottle.baseDisplayName; }
        else { bottle.displayName = `${bottle.year} ${bottle.baseDisplayName}`; }
        let isHiddenGem = false;
        if (traits.knowledge < 35 && rng() < 0.18) isHiddenGem = true;
        const estateMult = event?.type === "estateSale" ? 0.6 + rng() * 0.2 : 1;
        const gemMult = isHiddenGem ? 0.25 + rng() * 0.25 : 1;
        const effectiveValue = bottle.value * estateMult * gemMult;
        const minAccept = Math.round(effectiveValue * (0.35 + flexibility * 0.4 + rng() * 0.2));
        const askingPrice = Math.max(Math.round(effectiveValue * (0.75 + rng() * 0.35)), Math.round(minAccept * 1.1));
        queue.push({ type: "seller", name, traits, descriptor, bottle, minAccept, askingPrice, isHiddenGem, disposition: 50, maxRounds, counterLines, walkLine, flexibility });
      } else {
        const validRequests = BUYER_REQUESTS.filter(r => inventory.some(r.filter));
        const request = validRequests.length > 0 ? validRequests[Math.floor(rng() * validRequests.length)] : BUYER_REQUESTS[BUYER_REQUESTS.length - 1];
        const matching = inventory.filter(request.filter);
        const avgValue = matching.length > 0 ? matching.reduce((s, b) => s + b.value, 0) / matching.length : 50;
        const avgTrueValue = matching.length > 0 ? matching.reduce((s, b) => s + (b.trueValue || b.value), 0) / matching.length : 50;
        const valueBasis = traits.knowledge > 55 ? avgTrueValue : avgValue;
        const hotTipMult = event?.type === "hotTip" && rng() < 0.35 ? 2 + rng() : 1;
        const budgetRatio = (0.7 + rng() * 0.8) * hotTipMult;
        const offerRatio = 0.5 + rng() * 0.3;
        const budget = Math.round(valueBasis * budgetRatio);
        const maxPay = Math.round(budget * (1 + flexibility * 0.5));
        const openingOffer = Math.round(budget * offerRatio);
        const isHotTipBuyer = hotTipMult > 1;
        queue.push({ type: "buyer", name, traits, descriptor, request: request.text, filter: request.filter, budget, maxPay, openingOffer, knowsYear: traits.knowledge > 55, isHotTipBuyer, budgetRatio, offerRatio, disposition: 50, maxRounds, counterLines, walkLine, flexibility });
      }
    }
    return { queue, event };
  }, [engine, day, tierData, inventory, generateCustomerName, storeTier, reputation]);

  // --- Negotiation logic ---
  const startNegotiation = useCallback((customer, targetPrice) => {
    setNegotiating(true);
    setNegRound(0);
    setNegResult(null);
    setNegHistory([]);
    if (customer.type === "seller") {
      setCustomerOffer(customer.askingPrice);
      // Default slider at ~60% of asking (within 25%-150% range)
      setPlayerOffer(Math.round(customer.askingPrice * 0.6));
      setNegHistory([{ who: "customer", amount: customer.askingPrice, text: `"I'm looking to get $${customer.askingPrice.toLocaleString()} for this."` }]);
    } else {
      const bottle = inventory.find(b => b.id === selectedSellBottle);
      const { offer, maxPay, budget } = getOfferForBottle(customer, bottle);
      setCustomerOffer(offer);
      setPlayerOffer(Math.round(offer * 1.3));
      setCurrentCustomer(prev => ({ ...prev, openingOffer: offer, maxPay, budget }));
      setNegHistory([{ who: "customer", amount: offer, text: `"I'd offer $${offer.toLocaleString()} for that."` }]);
    }
  }, [inventory, selectedSellBottle, getOfferForBottle]);

  const submitOffer = useCallback(() => {
    if (!currentCustomer || !negotiating) return;
    const c = currentCustomer;
    
    const round = negRound + 1;

    if (c.type === "seller") {
      // Player is offering to BUY at playerOffer. Seller wants at least minAccept.
      if (playerOffer >= c.askingPrice) {
        // Accepted immediately — overpaid
        setNegResult("accepted");
        setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"Deal! Pleasure doing business."` }]);
      } else if (playerOffer >= c.minAccept) {
        // In acceptable range — chance of accept scales with how close to asking
        const ratio = (playerOffer - c.minAccept) / (c.askingPrice - c.minAccept);
        const acceptChance = 0.2 + ratio * 0.7;
        if (Math.random() < acceptChance || round >= c.maxRounds) {
          setNegResult("accepted");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"...Alright, you've got a deal."` }]);
        } else {
          // Counter: move toward player's offer
          const newCounter = Math.round(customerOffer - (customerOffer - playerOffer) * (0.3 + c.flexibility * 0.3));
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${c.counterLines[Math.floor(Math.random() * c.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      } else {
        // Below minimum
        if (round >= c.maxRounds) {
          setNegResult("walked");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: null, text: `"${c.walkLine}"` }]);
        } else {
          // Counter more firmly
          const newCounter = Math.round(customerOffer - (customerOffer - c.minAccept) * 0.2);
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You offer $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${c.counterLines[Math.floor(Math.random() * c.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      }
    } else {
      // Player is SELLING at playerOffer. Buyer will pay up to maxPay.
      if (playerOffer <= c.openingOffer) {
        // Accepted immediately — undersold
        setNegResult("accepted");
        setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"Sold! That's a great price."` }]);
      } else if (playerOffer <= c.maxPay) {
        const ratio = (c.maxPay - playerOffer) / (c.maxPay - c.openingOffer);
        const acceptChance = 0.15 + ratio * 0.7;
        if (Math.random() < acceptChance || round >= c.maxRounds) {
          setNegResult("accepted");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: playerOffer, text: `"...Fine, I'll take it."` }]);
        } else {
          const newCounter = Math.round(customerOffer + (playerOffer - customerOffer) * (0.3 + c.flexibility * 0.3));
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${c.counterLines[Math.floor(Math.random() * c.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      } else {
        if (round >= c.maxRounds) {
          setNegResult("walked");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: null, text: `"${c.walkLine}"` }]);
        } else {
          const newCounter = Math.round(customerOffer + (c.maxPay - customerOffer) * 0.25);
          setCustomerOffer(newCounter);
          setPlayerOffer(Math.round((playerOffer + newCounter) / 2));
          setNegResult("countered");
          setNegHistory(prev => [...prev, { who: "player", amount: playerOffer, text: `You ask $${playerOffer.toLocaleString()}` }, { who: "customer", amount: newCounter, text: `"${c.counterLines[Math.floor(Math.random() * c.counterLines.length)]} $${newCounter.toLocaleString()}?"` }]);
        }
      }
    }
    setNegRound(round);
  }, [currentCustomer, negotiating, negRound, playerOffer, customerOffer, inventory, selectedSellBottle]);

  const acceptCounter = useCallback(() => {
    if (!currentCustomer) return;
    setPlayerOffer(customerOffer);
    setNegResult("accepted");
    setNegHistory(prev => [...prev, { who: "player", amount: customerOffer, text: `You accept $${customerOffer.toLocaleString()}` }, { who: "customer", amount: customerOffer, text: `"Deal!"` }]);
  }, [currentCustomer, customerOffer]);

  const finalizeDeal = useCallback(() => {
    if (!currentCustomer || negResult !== "accepted") return;
    const finalPrice = negHistory[negHistory.length - 1]?.amount || playerOffer;
    if (currentCustomer.type === "seller") {
      if (!canAfford(finalPrice) || shelfFull) return;
      const boughtBottle = { ...currentCustomer.bottle, purchasePrice: finalPrice };
      setCash(prev => prev - finalPrice);
      setDailyLog(prev => [...prev, { type: "buy", desc: boughtBottle.displayName, amount: -finalPrice }]);
      setInventory(p => [boughtBottle, ...p]);
      setReputation(prev => prev + (finalPrice < currentCustomer.bottle.trueValue * 0.7 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
      // Track buy price in codex
      trackPriceInCodex(boughtBottle, "buy", finalPrice);
      audio.playSfx("buySuccess");
    } else {
      const bottle = inventory.find(b => b.id === selectedSellBottle);
      if (!bottle) return;
      setCash(prev => prev + finalPrice);
      setDailyLog(prev => [...prev, { type: "sell", desc: bottle.displayName, amount: finalPrice }]);
      setInventory(p => p.filter(b => b.id !== selectedSellBottle));
      setReputation(prev => prev + (finalPrice > (bottle.purchasePrice || 0) * 1.3 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
      // Track sell price in codex
      trackPriceInCodex(bottle, "sell", finalPrice);
      // Also track encounter for buyer-side bottles
      trackBottleInCodex(bottle);
      audio.playSfx("sellSuccess");
    }
    setNegotiating(false);
    setNegResult(null);
    setSelectedSellBottle(null);
    advanceToNextCustomer();
  }, [currentCustomer, negResult, negHistory, playerOffer, shelfFull, inventory, selectedSellBottle, audio, advanceToNextCustomer, trackBottleInCodex]);

  const walkAway = useCallback(() => {
    setNegotiating(false);
    setNegResult(null);
    audio.playSfx("pass");
    advanceToNextCustomer();
  }, [audio, advanceToNextCustomer]);

  const handleStartDay = useCallback(() => {
    const { queue, event } = generateDayQueue();
    setDayEvent(event);
    setCustomerQueue(queue);
    setCustomerIndex(0);
    const first = queue.length > 0 ? queue[0] : null;
    setCurrentCustomer(first);
    if (first && first.type === "seller" && first.bottle) trackBottleInCodex(first.bottle);
    setDayStarted(true);
    setSelectedSellBottle(null);
    setNegotiating(false);
    setNegResult(null);
    audio.playSfx("buttonClick");
  }, [generateDayQueue, audio, trackBottleInCodex]);

  const handlePass = useCallback(() => {
    audio.playSfx("pass");
    setNegotiating(false); setNegResult(null);
    advanceToNextCustomer();
  }, [audio, advanceToNextCustomer]);

  // Upgrade store
  const handleUpgrade = useCallback(() => {
    if (storeTier >= 6) return;
    const nextTier = ECONOMY_TIERS[storeTier];
    if (cash < nextTier.upgradeCost || reputation < nextTier.repRequired) return;
    setCash(prev => prev - nextTier.upgradeCost);
    setStoreTier(prev => prev + 1);
    setDailyLog(prev => [...prev, { type: "upgrade", desc: `Upgraded to ${STORE_TIERS[storeTier].name}`, amount: -nextTier.upgradeCost }]);
    audio.playSfx("storeUpgrade");
  }, [storeTier, cash, reputation, audio]);

  // End of day / Rent system
  const handleEndDay = useCallback(() => {
    const revenue = dailyLog.filter(l => l.amount > 0).reduce((s, l) => s + l.amount, 0);
    const expenses = dailyLog.filter(l => l.amount < 0).reduce((s, l) => s + Math.abs(l.amount), 0);
    const buys = dailyLog.filter(l => l.type === "buy");
    const sells = dailyLog.filter(l => l.type === "sell");
    const deals = buys.length + sells.length;
    const bestDeal = sells.length > 0 ? sells.reduce((best, l) => l.amount > best.amount ? l : best, sells[0]) : null;
    const totalInventoryValue = inventory.reduce((s, b) => s + (b.purchasePrice || b.value), 0);
    const summary = { revenue, expenses, profit: revenue - expenses, deals, dayNum: day,
      buyCount: buys.length, sellCount: sells.length, bestDeal,
      totalWealth: cash + totalInventoryValue, inventoryValue: totalInventoryValue, inventoryCount: inventory.length,
      customersSeen: customerIndex + (currentCustomer ? 1 : 0), customersTotal: customerQueue.length };

    const isRentDay = day > 0 && day % 7 === 0;
    if (isRentDay) {
      const rent = tierData.weeklyRent;
      if (cash >= rent) {
        setCash(prev => prev - rent);
        summary.rentPaid = rent;
        summary.profit -= rent;
      } else {
        const newMissed = missedRent + 1;
        setMissedRent(newMissed);
        summary.rentMissed = true;
        summary.missedCount = newMissed;
        if (newMissed >= MAX_MISSED_RENT) { summary.gameOver = true; setGameOver(true); }
      }
    }

    setShowDaySummary(summary);
    setDay(prev => prev + 1);
    setDailyLog([]);
    setDayStarted(false);
    setCurrentCustomer(null);
    setCustomerQueue([]);
    setCustomerIndex(0);
    setSelectedSellBottle(null);
    setNegotiating(false);
    setNegResult(null);
    setDayEvent(null);
   
    setPreTacticUsed(null);
    setMidTacticUsed(null);
    setTacticResult(null);
    setConvoPhase("greeting"); setConvoLog([]); setConvoTurns(0); setUsedConvoOptions([]); setTraitHints([]); setConvoWaiting(false);
  }, [day, dailyLog, cash, tierData, missedRent, customerIndex, currentCustomer, customerQueue]);

  const closeDaySummary = useCallback(() => { setShowDaySummary(null); }, []);

  const filteredInventory = inventory.filter(b => filterType === "All" || b.typeName === filterType).sort((a, b) => {
    if (sortBy === "value") return b.value - a.value; if (sortBy === "age") return b.age - a.age;
    if (sortBy === "proof") return b.proof - a.proof;
    if (sortBy === "rarity") { const o = RARITIES.map(r => r.name); return o.indexOf(b.rarity) - o.indexOf(a.rarity); } return 0;
  });
  const totalValue = inventory.reduce((s, b) => s + b.value, 0);

  return (
    <div id="game-root" style={{ minHeight: "100vh", fontFamily: "'Inter', -apple-system, sans-serif", padding: 0 }}>
      {/* Inject theme CSS variables */}
      <style>{`#game-root { ${themeToCSS(THEMES[colorTheme] || THEMES.classic)} background: linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 40%, var(--bg1) 100%); color: var(--text-muted); }`}</style>

      {showOptions && <OptionsMenu audio={audio} onClose={() => { setShowOptions(false); audio.playSfx("buttonClick"); }}
        onSfxChange={v => { audio.setSfxVolume(v); audio.playSfx("buttonClick"); }} onMusicChange={v => audio.setMusicVolume(v)}
        currentTheme={colorTheme} onThemeChange={handleThemeChange} />}

      {/* Day Summary Modal */}
      {showDaySummary && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: "16px" }}>
          <div style={{ background: `linear-gradient(145deg, var(--bg3), var(--bg2))`, borderRadius: "16px", padding: "24px", border: "2px solid var(--border)", width: "420px", maxWidth: "90vw", textAlign: "center", animation: "fadeIn 0.4s ease-out" }}>
            <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "2px", marginBottom: "4px" }}>END OF DAY</div>
            <h2 style={{ fontFamily: "'Playfair Display', Georgia, serif", color: "var(--accent)", margin: "0 0 4px 0", fontSize: "28px" }}>
              Day {showDaySummary.dayNum}
            </h2>
            <div style={{ fontSize: "11px", color: "var(--text-dim)", fontFamily: "monospace", marginBottom: "16px" }}>{STORE_TIERS[storeTier - 1].name} · {showDaySummary.customersTotal} visitor{showDaySummary.customersTotal !== 1 ? "s" : ""}</div>

            <div style={{ height: "1px", background: "linear-gradient(90deg, transparent, #3a3028, transparent)", margin: "0 0 16px 0" }} />

            {/* Revenue & Expenses */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "8px", marginBottom: "12px" }}>
              <div style={{ background: "var(--surface)", borderRadius: "8px", padding: "10px" }}>
                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px", marginBottom: "2px" }}>REVENUE</div>
                <div style={{ fontSize: "20px", color: "var(--success)", fontFamily: "monospace", fontWeight: "bold" }}>+${showDaySummary.revenue.toLocaleString()}</div>
                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace" }}>{showDaySummary.sellCount} sale{showDaySummary.sellCount !== 1 ? "s" : ""}</div>
              </div>
              <div style={{ background: "var(--surface)", borderRadius: "8px", padding: "10px" }}>
                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace", letterSpacing: "1px", marginBottom: "2px" }}>EXPENSES</div>
                <div style={{ fontSize: "20px", color: "var(--danger)", fontFamily: "monospace", fontWeight: "bold" }}>-${showDaySummary.expenses.toLocaleString()}</div>
                <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace" }}>{showDaySummary.buyCount} purchase{showDaySummary.buyCount !== 1 ? "s" : ""}</div>
              </div>
            </div>

            {/* Net Profit - prominent */}
            <div style={{ background: showDaySummary.profit >= 0 ? "#22C55E08" : "#C0392B08", borderRadius: "10px", padding: "14px", marginBottom: "12px", border: `1px solid ${showDaySummary.profit >= 0 ? "#22C55E20" : "#C0392B20"}` }}>

                            </div>

                        {/* ---- CONVERSATION PHASE ---- */}
                        {(convoPhase === "greeting" || convoPhase === "chat" || convoPhase === "forced") && (

                                      background: msg.who === "player" ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)",
                                      color: msg.who === "player" ? "var(--accent)" : "var(--text-muted)",
                                      border: msg.who === "player" ? "1px solid rgba(255,255,255,0.08)" : "none",

                                      borderBottomLeftRadius: msg.who === "player" ? "10px" : "2px" }}>
                                      {msg.text}
                                    </div>
                                  </div>
                                ))}
                                {convoWaiting && (
                                  <div style={{ display: "flex", justifyContent: "flex-start", animation: "msgFadeIn 0.3s ease-out" }}>
                                    <div style={{ padding: "8px 12px", borderRadius: "10px", fontSize: "13px", fontFamily: "monospace", background: "var(--border)", color: "var(--text-dim)" }}>
                                      ...
                                    </div>
                                  </div>
                                )}
                              </div>
                            )}

                            {/* Conversation options — hidden while customer is responding */}
                            {!convoWaiting && (
                            <div style={{ display: "flex", flexDirection: "column", gap: "6px", width: "100%" }}>

                                  if (usedConvoOptions.includes(opt.id)) return false;
                                  if (convoPhase === "greeting" && opt.category !== "greeting" && opt.category !== "intuition") return false;
                                  if (convoPhase === "chat" && opt.category === "greeting") return false;

                                  return true;
                                })
                                .map(opt => (
                                  <button key={opt.id} onClick={() => handleConvoChoice(opt)}

                                  </button>

                              {/* Always available: Inquire Business */}
                              <button onClick={handleInquireBusiness}
                                style={{ padding: "12px 16px", background: "var(--surface)", border: "2px solid var(--accent)", borderRadius: "12px", color: "var(--accent)", fontSize: "14px", cursor: "pointer", fontFamily: "'Inter', sans-serif", fontWeight: "700", width: "100%", textShadow: "0 1px 2px rgba(0,0,0,0.5)", letterSpacing: "0.3px" }}>
                                Let's talk business
                              </button>
                            </div>
                            )}
                          </div>
                        )}

                        {/* ---- DEAL PHASE: SELLER ---- */}
                        {convoPhase === "deal" && currentCustomer.type === "seller" && (
                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "12px" }}>
                            <BottleCard bottle={currentCustomer.bottle} showRarity={showRarity} yearEstimate={estimateYear(currentCustomer.bottle)} hideValue={true} />
                            {/* Codex price intel */}
                            {(() => {
                              const b = currentCustomer.bottle;
                              const modK = b.modifiers.length > 0 ? b.modifiers.sort().join(" ") + " " : "";
                              const vk = `${modK}${b.typeName}`;
                              const entry = codex[b.brandName]?.[vk];
                              const yearKey = b.yearKnown ? String(b.year) : "unknown";
                              const ph = entry?.priceHistory?.[yearKey];
                              if (!ph) return null;
                              return (
                                <div style={{ fontSize: "11px", fontFamily: "monospace", color: "var(--text-dim)", padding: "6px 12px", background: "rgba(255,255,255,0.04)", borderRadius: "6px", border: "1px solid var(--border)" }}>

                                  {ph.minSell != null && <span style={{ color: "var(--success)" }}>Sold: ${ph.minSell.toLocaleString()}{ph.maxSell !== ph.minSell ? `–$${ph.maxSell.toLocaleString()}` : ""}</span>}
                                </div>
                              );
                            })()}

                              <div style={{ fontSize: "13px", color: tacticResult.effect === "great" || tacticResult.effect === "good" ? "var(--success)" : tacticResult.effect === "bad" || tacticResult.effect === "terrible" ? "var(--danger)" : "var(--text-muted)", fontStyle: "italic", textAlign: "center", padding: "8px 12px", background: "rgba(255,255,255,0.04)", borderRadius: "6px" }}>
                                {tacticResult.text}

                              <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", width: "100%" }}>

                                        const boughtBottle = { ...currentCustomer.bottle, purchasePrice: currentCustomer.askingPrice };
                                        setCash(prev => prev - currentCustomer.askingPrice);
                                        setDailyLog(prev => [...prev, { type: "buy", desc: boughtBottle.displayName, amount: -currentCustomer.askingPrice }]);
                                        setInventory(p => [boughtBottle, ...p]);
                                        setReputation(prev => prev + (currentCustomer.askingPrice < currentCustomer.bottle.trueValue * 0.7 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
                                        trackPriceInCodex(boughtBottle, "buy", currentCustomer.askingPrice);
                                        audio.playSfx("buySuccess");
                                        advanceToNextCustomer();
                                      }

                                  </>
                                )}
                              </div>
                            )}
                          </div>

                        {/* ---- DEAL PHASE: BUYER ---- */}
                        {convoPhase === "deal" && currentCustomer.type === "buyer" && (
                          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: "12px" }}>
                            {tacticResult && (
                              <div style={{ fontSize: "13px", color: tacticResult.effect === "great" || tacticResult.effect === "good" ? "var(--success)" : tacticResult.effect === "bad" || tacticResult.effect === "terrible" ? "var(--danger)" : "var(--text-muted)", fontStyle: "italic", textAlign: "center", padding: "8px 12px", background: "rgba(255,255,255,0.04)", borderRadius: "6px" }}>
                                {tacticResult.text}
                              </div>
                            )}
                            {!negotiating && (
                              <>
                                <div style={{ fontSize: "11px", color: "var(--text-dim)", fontFamily: "monospace" }}>Select a bottle to offer:</div>
                                {(() => {
                                  const matching = inventory.filter(currentCustomer.filter);

                                  return (
                                    <div style={{ width: "100%", maxHeight: "260px", overflowY: "auto", display: "flex", flexWrap: "wrap", gap: "8px", justifyContent: "center", padding: "4px 0" }}>

                                        const isSelected = selectedSellBottle === b.id;
                                        const isMatch = currentCustomer.filter(b);
                                        return (
                                          <div key={b.id} onClick={() => setSelectedSellBottle(b.id)}
                                            style={{ padding: "8px", borderRadius: "8px", cursor: "pointer", width: "180px",

                                              opacity: isMatch ? 1 : 0.5 }}>
                                            <div style={{ fontSize: "11px", color: "var(--text)", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "2px", lineHeight: 1.3 }}>{b.displayName}</div>
                                            <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace" }}>{b.typeName} · {b.ageDisplay || `${b.age}yr`} · {b.proof}pf</div>
                                            <div style={{ fontSize: "11px", color: "var(--text-muted)", fontFamily: "monospace", marginTop: "2px" }}>{b.purchasePrice != null ? `Paid: $${b.purchasePrice.toLocaleString()}` : ""}</div>
                                            {!isMatch && <div style={{ fontSize: "9px", color: "var(--text-dim)", fontFamily: "monospace", marginTop: "2px" }}>Not what they asked for</div>}
                                          </div>
                                        );
                                      })}
                                    </div>
                                  );
                                })()}
                                <div style={{ display: "flex", gap: "10px", flexWrap: "wrap", justifyContent: "center", width: "100%" }}>
                                  {selectedSellBottle && (() => {

                                    const { offer } = getOfferForBottle(currentCustomer, selBottle);
                                    return (
                                    <>
                                      <button onClick={() => {
                                        const bottle = selBottle; if (!bottle) return;
                                        setCash(prev => prev + offer);
                                        setDailyLog(prev => [...prev, { type: "sell", desc: bottle.displayName, amount: offer }]);
                                        setInventory(p => p.filter(b => b.id !== selectedSellBottle));
                                        setReputation(prev => prev + (offer > (bottle.purchasePrice || 0) * 1.3 ? REP_PER_GREAT_DEAL : REP_PER_GOOD_DEAL));
                                        trackPriceInCodex(bottle, "sell", offer); trackBottleInCodex(bottle);
                                        setSelectedSellBottle(null); audio.playSfx("sellSuccess"); advanceToNextCustomer();
                                      }}
                                        style={{ flex: "1 1 auto", minWidth: "100px", padding: "12px 16px", background: "linear-gradient(145deg, #22C55E, var(--success))", border: "none", borderRadius: "8px", color: "#fff", fontSize: "13px", fontWeight: "bold", cursor: "pointer", fontFamily: "monospace" }}>

                                        NEGOTIATE
                                      </button>

                                </div>

                            {negotiating && (() => {
                              const bottle = inventory.find(b => b.id === selectedSellBottle);
                              if (!bottle) return null;
                              const sliderMin = Math.round(currentCustomer.openingOffer * 0.25);

                                <div style={{ width: "100%", maxWidth: "460px" }}>
                                  <div style={{ background: "rgba(255,255,255,0.03)", borderRadius: "8px", padding: "8px", marginBottom: "10px", textAlign: "center" }}>
                                    <div style={{ fontSize: "13px", color: "var(--text)", fontFamily: "'Playfair Display', Georgia, serif" }}>{bottle.displayName}</div>
                                    <div style={{ fontSize: "11px", color: "var(--text-dim)", fontFamily: "monospace" }}>Paid: ${(bottle.purchasePrice ?? 0).toLocaleString()}</div>

                                    <div ref={negHistoryRef} style={{ maxHeight: "160px", overflowY: "auto", marginBottom: "12px", display: "flex", flexDirection: "column", gap: "6px", scrollBehavior: "smooth" }}>
                                      {negHistory.map((h, i) => (
                                        <div key={i} style={{ display: "flex", justifyContent: h.who === "player" ? "flex-end" : "flex-start", animation: "msgFadeIn 0.3s ease-out" }}>
                                          <div style={{ padding: "8px 12px", borderRadius: "10px", maxWidth: "85%", fontSize: "12px", fontFamily: "monospace", lineHeight: 1.4,
                                            background: h.who === "player" ? "rgba(255,255,255,0.06)" : "rgba(255,255,255,0.03)", color: h.who === "player" ? "var(--buy-accent)" : "var(--text-muted)",
                                            border: h.who === "player" ? "1px solid rgba(255,255,255,0.08)" : "none",
                                            borderBottomRightRadius: h.who === "player" ? "2px" : "10px", borderBottomLeftRadius: h.who === "player" ? "10px" : "2px" }}>
                                            {h.text}
                                          </div>
                                        </div>
                                      ))}
                                    </div>
                                    <div style={{ fontSize: "10px", color: "var(--text-dim)", fontFamily: "monospace", textAlign: "center", marginBottom: "8px" }}>Negotiation round {negRound + 1}</div>

                                      <div style={{ textAlign: "center" }}>
                                        <div style={{ color: "var(--success)", fontSize: "16px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Deal Agreed!</div>

                                          CONFIRM SALE — ${(negHistory[negHistory.length-1]?.amount || 0).toLocaleString()}
                                        </button>
                                      </div>

                                      <div style={{ textAlign: "center" }}>
                                        <div style={{ color: "var(--danger)", fontSize: "14px", fontFamily: "'Playfair Display', Georgia, serif", marginBottom: "12px" }}>Customer walked away.</div>

                                      </div>

                                      <>

                                            </button>
                                          </div>
